<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
/* CDN 読み込み失敗時の案内（本体スクリプトは Phaser 前提で書かれているため、
   Phaser が無い場合はここで理由を表示して止める） */
window.addEventListener('load',function(){
  if(!window.Phaser){
    var m=document.getElementById('boot-msg');
    if(m)m.textContent='起動エラー：Phaser（CDN）の読み込みに失敗しました。通信環境を確認して、再読み込みしてください。';
  }
});
/* iOS Safari のピンチズーム（gesturestart）とダブルタップズームを抑止する */
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
</script>
<script>
"use strict";
/* ============================================================
   ファイアーシックス Phaser版 ― フェーズ6 第4段階（グラフィック強化）
   ＋最終フェーズ（スマホ対応）: タッチ操作（仮想十字キー＋決定／
   キャンセル／ライブラリ／絞り込みのオンスクリーンボタン、タップで
   メニュー・会話・試合コマンド選択）、縦持ち時の横持ち推奨案内、
   スクロール／ズーム抑止、PWA風 manifest＋アイコン（ホーム画面追加）。
   タッチUIは (pointer: coarse) の端末でのみ表示し、PCでは出さない。
   会話ウィンドウには話者の顔を表示する（本人カットインイラストが
   manifest にある話者はイラストの顔切り抜き、無い話者は歩行チップと
   同じ割り当てのドット顔。ナレーション行は顔なし）。
   必殺技演出の強化（Phaser 側の演出層のみ。Core は不変）:
   カットイン中はレターボックス（上下の黒帯）がせり出し、イラストは
   ゆっくりズーム＋パンし、帯にはスピード線が流れる。発動中は使用者に
   属性色の溜めオーラが出て、必殺技のボールには属性別の軌跡（火=炎の
   尾／風=渦／林=葉／山=土煙）が付く。ボールが放たれる瞬間と得点の
   瞬間には、技の威力ランク（弱／中／強／最強）で量が変わるヒット
   ストップと画面シェイクが入る。効果音は WebAudio のシンセ生成
   （音源ファイルなし）で、カットイン突入／溜め／打撃／得点の4種。
   ON/OFF は localStorage 'firesix_se' に保存し、タイトル右上か
   M キーで切り替える（演出速度 'firesix_fx' の既存仕様とは独立）。
   第4段階の内容: ドット絵を 48×64 に精密化（2段シェーディング＋輪郭線）、
   試合中のアクションポーズ（スパイク／レシーブ／トス／ブロック）、
   ボールの残像・スピンとスパイク決定時のヒットエフェクト、
   カットインのイラスト差し替え（3段フォールバック: 本人イラスト
   assets/cutin/<フルネーム（空白除去）> → 属性×性別の汎用イラスト
   assets/cutin/generic-<属性キー>-<性別> → 顔ドット絵。実ファイルは
   manifest.json にある分だけ読み、WebP 優先・PNG フォールバック）、
   探索画面の装飾レイヤー
   （大きな樹冠・建物の屋根／看板／窓・商店街ファサード・小物）。
   第3段階までの内容: 選手／NPC のドット絵歩行スプライト（4方向×3コマ、
   髪型6種・肌色を名前から決定的に割当）、マップタイルの質感付け、
   試合コートの木目フロア＋観客席＋ネット、カットインの顔ドット絵と
   属性エフェクト、タイトル／会話／メニューのUIポリッシュ。
   ------------------------------------------------------------
   データ／ロジックの扱い（二重管理を避けるための方式）:
   起動時に同フォルダのゲーム本体（公開構成では core.html、開発構成では
   index.html。候補を順に試して取得できた方を使う）を fetch し、その
   <script> を抽出して、DOMスタブ環境で評価する（リポジトリの Node テスト
   test-v07〜v16 が使うのと同じ手法）。これにより本体（現行 v1.0.3）の
   データ層（選手250人・技・マップ・イベント定義）とロジック層
   （対決計算・特訓・装備・セーブ・試合状態機械・ライブラリ／編成の
   更新処理）を「Core」としてそのまま共有する。
   セーブは実 localStorage を渡すため、保存先キー
   (SAVE_KEY='asanagi_vb_save_v01'／演出速度 'firesix_fx') も本体と
   完全に共通で、セーブデータは相互に読み書きできる。
   Core 側の Canvas 描画ループは requestAnimationFrame スタブで
   起動しない。入力と描画は Phaser 側が持つ:
   - 入力: Phaser が受けたキー／クリックを、Core の入力モデル
     （keys=押しっぱなし／pressed=押した瞬間／mouseClick）へ
     ブリッジ関数（__hold／__press／__click）で流し込む。
   - 駆動: 毎フレーム Core の更新関数（titleUpdate／exploreUpdate／
     matchUpdate／dialogUpdate）をブリッジ（__stepTitle 等）で進める。
     これにより試合のラリー進行・加入／章イベント・クリア後ルート・
     ライブラリ／スカウト／合体技／編成はすべて Core 側の実装が
     そのまま動き、Phaser は Core の状態（scene／M／dlg／menu／lib／
     form／profileOpen）を描画するだけになる。
   Core 本体はこのファイルからは一切変更していない（並存）。
   ============================================================ */

/* ---------- Core ローダ ---------- */
/* Core 本体のファイル名は構成によって異なる（公開構成=core.html／
   開発構成=index.html）。候補を順に試し、取得できたものを Core とする */
async function loadCore(){
  const CORE_FILES=['core.html','index.html'];
  let src=null,lastErr=null;
  for(const f of CORE_FILES){
    try{
      const res=await fetch(f);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const html=await res.text();
      const m=html.match(/<script>([\s\S]*)<\/script>/);
      if(!m)throw new Error('ゲーム本体スクリプトを抽出できませんでした');
      src=m[1];break;
    }catch(e){lastErr=e;}
  }
  if(src===null)throw new Error('ゲーム本体（'+CORE_FILES.join('／')+'）の取得に失敗しました'+(lastErr?'：'+lastErr.message:''));
  /* DOMスタブ: 何を呼ばれても自分自身を返す万能プロキシ（テストハーネスと同方式）。
     getElementById はこれを返し、querySelectorAll は空配列を返す */
  function makeUni(){
    const f=function(){};
    const u=new Proxy(f,{
      get:(t,k)=>{if(k===Symbol.toPrimitive)return ()=>0;return u;},
      apply:()=>u,set:()=>true});
    return u;
  }
  const uni=makeUni();
  const documentStub={
    getElementById:()=>uni,
    querySelectorAll:()=>[],
    addEventListener:()=>{},
    createElement:()=>uni,
    body:uni,
  };
  const noop=()=>{};
  /* セーブ共有のため localStorage は実物を渡す。取得できない環境ではメモリ代替
     （その場合 本体とのセーブ共有はできない） */
  let storage;
  try{storage=window.localStorage;storage.getItem('__probe__');}
  catch(e){const mem={};storage={getItem:k=>(k in mem?mem[k]:null),setItem:(k,v)=>{mem[k]=String(v);},removeItem:k=>{delete mem[k];}};}
  const exportTail=
    '\nfunction __press(){for(var i=0;i<arguments.length;i++)pressed[arguments[i]]=true;}'+
    '\nfunction __click(x,y){mouseClick={x:x,y:y};}'+
    '\nfunction __hold(o){for(const k in keys)delete keys[k];for(const k in o)if(o[k])keys[k]=true;}'+
    '\nfunction __stepTitle(){titleUpdate();pressed={};mouseClick=null;}'+
    '\nfunction __stepExplore(dt){exploreUpdate(dt);pressed={};mouseClick=null;}'+
    '\nfunction __stepMatch(dt){if(dlg&&!dlg.choices){dialogUpdate();}else if(M){matchUpdate(dt);}pressed={};mouseClick=null;}'+
    '\n;return {'+
    'get G(){return G;},set G(v){G=v;},'+
    'get curMapId(){return curMapId;},set curMapId(v){curMapId=v;},'+
    'get scene(){return scene;},get M(){return M;},get menu(){return menu;},get dlg(){return dlg;},'+
    'get lib(){return lib;},get form(){return form;},'+
    'get profileOpen(){return profileOpen;},get profileSel(){return profileSel;},'+
    'get titleSel(){return titleSel;},get titleWarn(){return titleWarn;},get player(){return player;},'+
    'SAVE_KEY:SAVE_KEY,PLAYER_DB:PLAYER_DB,SCHOOL_OF:SCHOOL_OF,'+
    'MAPS:MAPS,TILE:TILE,MW:MW,MH:MH,curMap:curMap,solid:solid,spotAt:spotAt,'+
    'npcLines:npcLines,INTRO_SCENE:INTRO_SCENE,MOB_TEAMS:MOB_TEAMS,'+
    'saveGame:saveGame,loadGame:loadGame,hasSave:hasSave,validSave:validSave,ensureSave:ensureSave,'+
    'goalText:goalText,hudGoalLine:hudGoalLine,coreCount:coreCount,joinStep:joinStep,eventNpcIds:eventNpcIds,'+
    'STAT_NAMES:STAT_NAMES,ELEM:ELEM,RANK:RANK,tech:tech,'+
    'baseOf:baseOf,progOf:progOf,effSt:effSt,effPlayer:effPlayer,'+
    'libPlayers:libPlayers,teamPlayers:teamPlayers,teamProblem:teamProblem,'+
    'trainCheck:trainCheck,doTrain:doTrain,'+
    'buyEquip:buyEquip,equipOf:equipOf,equipSlotShort:equipSlotShort,equipSlotText:equipSlotText,equipPriceOf:equipPriceOf,'+
    'EQ_SHOES:EQ_SHOES,EQ_UNIFORM:EQ_UNIFORM,EQ_SUP:EQ_SUP,EQ_SUP_PARTS:EQ_SUP_PARTS,EQUIP_TIERS:EQUIP_TIERS,'+
    'MATCHES:MATCHES,matchDef:matchDef,currentMatchDef:currentMatchDef,PRACTICE_KASHIWA:PRACTICE_KASHIWA,AI_LEVELS:AI_LEVELS,'+
    'SLOT_POS:SLOT_POS,slotPos:slotPos,mkRuntime:mkRuntime,'+
    'duelVal:duelVal,fpFactor:fpFactor,elemMult:elemMult,servePowOf:servePowOf,lucky:lucky,'+
    'fxFast:fxFast,setFx:setFx,'+
    'COMBO_TECHS:COMBO_TECHS,comboState:comboState,ROLE_LABEL:ROLE_LABEL,roleOf:roleOf,LEARN:LEARN,'+
    'LV_MAX:LV_MAX,expNeed:expNeed,LIB_MAX:LIB_MAX,SCOUT_SCHOOLS:SCOUT_SCHOOLS,'+
    'buildCandidates:buildCandidates,scoutList:scoutList,scoutRows:scoutRows,scoutScrollTop:scoutScrollTop,'+
    'libScrollTop:libScrollTop,formScrollTop:formScrollTop,isAwake:isAwake,awakeLeft:awakeLeft,'+
    'traditionReady:traditionReady,PROF_ROWS:PROF_ROWS,FORM_ROWS:FORM_ROWS,LIB_ROWS:LIB_ROWS,'+
    'startMatch:startMatch,startPractice:startPractice,mobEncounter:mobEncounter,openFormation:openFormation,'+
    '__press:__press,__click:__click,__hold:__hold,'+
    '__stepTitle:__stepTitle,__stepExplore:__stepExplore,__stepMatch:__stepMatch'+
    '};';
  const factory=new Function('document','localStorage','addEventListener','removeEventListener',
    'requestAnimationFrame','cancelAnimationFrame',src+exportTail);
  return factory(documentStub,storage,noop,noop,noop,noop);
}

let Core=null; /* loadCore() の戻り（全シーンから参照する） */
const FONT='"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const C16=s=>parseInt(String(s).replace('#',''),16);

/* 日本語の文字単位折り返し（v1.0 の wrapText と同じ測り方） */
const _mc=document.createElement('canvas').getContext('2d');
function wrapJa(text,widthPx,font){
  _mc.font=font;
  const lines=[];let line='';
  for(const ch of String(text)){
    if(_mc.measureText(line+ch).width>widthPx){lines.push(line);line=ch;}
    else line+=ch;
  }
  if(line)lines.push(line);
  return lines.join('\n');
}
/* ---------- 効果音（WebAudio シンセ生成。音源ファイルは使わない） ----------
   必殺技演出強化に合わせて追加した Phaser 側専用の仕組みで、Core には
   一切触れない。ON/OFF は localStorage 'firesix_se'（'on'／'off'、既定 on）
   に保存し、タイトル画面右上の表示か M キーで切り替える。
   ブラウザの自動再生制限に配慮し、AudioContext は初回のユーザー操作
   （pointerdown／keydown）で初期化・再開する。鳴動は SE.log に記録し、
   動作確認用に window.FS_SE から参照できる。音量は控えめ（master 0.22） */
const SE=(()=>{
  let ctx=null,master=null,noiseBuf=null;
  let enabled=true;
  try{enabled=window.localStorage.getItem('firesix_se')!=='off';}catch(e){}
  const log=[];
  function ensure(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return ctx;}
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.22;master.connect(ctx.destination);
    }catch(e){ctx=null;}
    return ctx;
  }
  function tone(o){ /* {f0,f1,type,dur,vol,a,delay} */
    const t0=ctx.currentTime+(o.delay||0);
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(Math.max(20,o.f0),t0);
    if(o.f1)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t0+o.dur);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(o.vol,t0+(o.a||0.008));
    g.gain.exponentialRampToValueAtTime(0.0008,t0+o.dur);
    osc.connect(g);g.connect(master);
    osc.start(t0);osc.stop(t0+o.dur+0.05);
  }
  function noise(o){ /* {dur,vol,f0,f1,type,q,a,delay} */
    if(!noiseBuf){
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    const t0=ctx.currentTime+(o.delay||0);
    const src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    const fl=ctx.createBiquadFilter();fl.type=o.type||'bandpass';fl.Q.value=o.q||0.9;
    fl.frequency.setValueAtTime(Math.max(30,o.f0||1000),t0);
    if(o.f1)fl.frequency.exponentialRampToValueAtTime(Math.max(30,o.f1),t0+o.dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(o.vol,t0+(o.a||0.01));
    g.gain.exponentialRampToValueAtTime(0.0008,t0+o.dur);
    src.connect(fl);fl.connect(g);g.connect(master);
    src.start(t0);src.stop(t0+o.dur+0.05);
  }
  function play(name,fn){
    const ok=enabled&&!!ensure();
    log.push({n:name,t:Math.round(performance.now()),ok:!!ok});
    if(log.length>80)log.shift();
    if(!ok)return;
    try{fn();}catch(e){}
  }
  const RANKV={'弱':0.35,'中':0.55,'強':0.8,'最強':1};
  return {
    log:log,
    get enabled(){return enabled;},
    ensure:ensure,
    toggle:function(){
      enabled=!enabled;
      try{window.localStorage.setItem('firesix_se',enabled?'on':'off');}catch(e){}
      return enabled;
    },
    /* カットイン突入: 風切りノイズ＋低い衝撃音 */
    cutin:function(){play('cutin',()=>{
      noise({dur:0.32,vol:0.5,f0:500,f1:2600,q:1.2});
      tone({f0:170,f1:65,type:'sine',dur:0.28,vol:0.5});
    });},
    /* 溜め: カットイン表示中に上っていく持続音 */
    charge:function(fast){play('charge',()=>{
      const d=fast?0.38:0.85;
      tone({f0:150,f1:740,type:'triangle',dur:d,vol:0.16,a:0.05});
      tone({f0:303,f1:1490,type:'sine',dur:d,vol:0.06,a:0.05});
    });},
    /* 打撃: 必殺技のボールが放たれる瞬間。威力ランクで音量が変わる */
    hit:function(rank){const v=RANKV[rank]||0.55;play('hit:'+rank,()=>{
      noise({dur:0.13,vol:0.55*v+0.15,type:'lowpass',f0:1100,f1:220});
      tone({f0:250,f1:52,type:'sine',dur:0.2,vol:0.65*v+0.1});
    });},
    /* 得点: 自チームは上昇2音、相手は下降2音 */
    score:function(mine){play('score',()=>{
      if(mine){tone({f0:659,type:'triangle',dur:0.1,vol:0.26});tone({f0:880,type:'triangle',dur:0.16,vol:0.26,delay:0.09});}
      else{tone({f0:392,type:'triangle',dur:0.1,vol:0.2});tone({f0:311,type:'triangle',dur:0.16,vol:0.2,delay:0.09});}
    });},
  };
})();
window.FS_SE=SE;
window.addEventListener('pointerdown',()=>SE.ensure(),{passive:true});
window.addEventListener('keydown',()=>SE.ensure());

/* ---------- ドット絵ユーティリティ（第3段階） ---------- */
function hashStr(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
/* 色を f 倍に暗く／明るくする（'#rgb' 形式にも対応） */
function shade(hex,f){
  let s=String(hex).replace('#','');
  if(s.length===3)s=s.split('').map(c=>c+c).join('');
  const n=parseInt(s,16);
  const r=clamp(Math.round(((n>>16)&255)*f),0,255),
        g=clamp(Math.round(((n>>8)&255)*f),0,255),
        b=clamp(Math.round((n&255)*f),0,255);
  return 'rgb('+r+','+g+','+b+')';
}
/* 決定的乱数（タイルの質感付け用。同じ入力なら同じ模様になる） */
function tileRand(seed){let s=(seed>>>0)||1;return ()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const SKIN_TONES=['#f6cf9f','#f2c79b','#eebd8d','#e0aa72'];

/* ---------- テクスチャ生成（プログラム生成のドット絵） ---------- */
/* タイルセット: v1.0 の drawExplore のタイル描画を 32×32 タイルとして再現する。
   地面／通路の色はマップごとに違うため、マップ別に生成する */
const CHAR_TO_TILE={'.':0,'P':1,'C':2,'T':3,'B':4,'D':5,'S':6,'F':7,'W':8};
/* タイルのバリエーション割り当て（描画側のみ。Core の MAPS は不変）
   9:地面・明 / 10:地面・暗 / 11:地面・花or汚れ / 12:道・縁石 / 13:道・暗 /
   14:壁・窓あり / 15:壁・縦目地 / 16:地面・土パッチ / 17:花壇・密 */
function tileIndexFor(mapId,ch,x,y){
  const baseIdx=CHAR_TO_TILE[ch];
  if(baseIdx===undefined)return 0;
  const h=hashStr(mapId+':'+x+','+y)%100;
  if(ch==='.'){
    if(mapId==='school'){if(h<10)return 9;if(h<20)return 10;if(h<26)return 11;if(h<31)return 16;}
    else{if(h<12)return 9;if(h<24)return 10;if(h<29)return 16;}
    return 0;
  }
  if(ch==='P'){if(h<22)return 12;if(h<30)return 13;return 1;}
  if(ch==='B'){if(h<45)return 14;if(h<60)return 15;return 4;}
  if(ch==='F'){if(h<40)return 17;return 7;}
  return baseIdx;
}
function makeTileset(scene,mapId){
  const key='tiles-'+mapId;
  if(scene.textures.exists(key))return key;
  const map=Core.MAPS[mapId];

/* 建物の塊（'B'/'D' の連結領域）を矩形の集まりとして抽出する */
function buildingBlocks(tiles){
  const H=tiles.length,W=tiles[0].length,seen=new Set(),blocks=[];
  const isB=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&(tiles[y][x]==='B'||tiles[y][x]==='D');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!isB(x,y)||seen.has(x+','+y))continue;
    /* 行方向のランを縦にマージする簡易ブロック化 */
    let x0=x,x1=x;while(isB(x1+1,y))x1++;
    let y1=y;let grow=true;
    while(grow){grow=false;
      let ok=true;for(let xx=x0;xx<=x1;xx++)if(!isB(xx,y1+1))ok=false;
      if(ok){y1++;grow=true;}}
    for(let yy=y;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)seen.add(xx+','+yy);
    blocks.push({x0:x0,x1:x1,y0:y,y1:y1});
  }
  return blocks;
}
const SHOP_NAMES=['サクマスポーツ','青果 いちば','パン工房 麦','古本屋 あおば','喫茶 あさなぎ','花の店 すみれ','薬局 ひまわり','文具 たんぽぽ'];
const SHOP_COLORS=[0xb0503c,0x3f7a4a,0xc9862b,0x5e4a8e,0x7a4a2a,0xc25e7a,0x3a6e8e,0x8e6a3a];
function buildExploreDecor(scene,map,mapId){
  const tiles=map.tiles,H=tiles.length,W=tiles[0].length;
  const g=scene.add.graphics().setDepth(44);
  const occupied=new Set();
  for(const n of map.npcs)occupied.add(Math.floor(n.x/32)+','+Math.floor(n.y/32));
  for(const s of (map.spots||[]))occupied.add(s.x+','+s.y);
  for(const w of (map.warps||[]))occupied.add(w.x+','+w.y);
  /* --- 木（大きな樹冠を重ねる） --- */
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(tiles[y][x]!=='T')continue;
    const v=hashStr(mapId+'tree:'+x+','+y)%3;
    scene.add.image(x*32+16,(y+1)*32+2,makeTreeTexture(scene,v))
      .setOrigin(0.5,1).setDepth((y+1)*32-1);
  }
  /* --- 建物: 屋根・影・窓・看板 --- */
  const blocks=buildingBlocks(tiles);
  const isStreet=(mapId==='street');
  for(const b of blocks){
    const px0=b.x0*32,px1=(b.x1+1)*32,py0=b.y0*32,py1=(b.y1+1)*32;
    const bw=px1-px0;

    g.fillStyle(0x000000,0.10);g.fillRect(px1-2,py0+6,6,py1-py0);

    const roofC=isStreet?0x46586e:0xa84a38,roofD=isStreet?0x2e3c50:0x7c3426,roofL=isStreet?0x5f748e:0xc05a44;

    for(let y=b.y0+1;y<=b.y1;y++)for(let x=b.x0;x<=b.x1;x++){
      if(tiles[y][x]!=='B')continue;
      if(hashStr(mapId+'win:'+x+','+y)%100<45)continue; /* タイル窓あり側と重ねない */
      const wx=x*32,wy=y*32;
      g.fillStyle(0x54627f,1);g.fillRect(wx+9,wy+9,14,14);
      g.fillStyle(0xa9d2ee,1);g.fillRect(wx+10,wy+10,12,12);
      g.fillStyle(0x54627f,1);g.fillRect(wx+15,wy+10,1,12);g.fillRect(wx+10,wy+15,12,1);

  const SIGN_TEXT={school:'朝 凪 学 園',station:'朝 凪 駅'};
  if(SIGN_TEXT[mapId]&&blocks.length){
    const b=blocks.reduce((a,c)=>(c.x1-c.x0)>(a.x1-a.x0)?c:a,blocks[0]);
    const cx=(b.x0+b.x1+1)*16,ty=b.y0*32+38;

    g.fillStyle(0xf2ead6,1);g.fillRect(cx-72,ty,144,24);
    g.lineStyle(2,0x7a6a4a,1);g.strokeRect(cx-72,ty,144,24);
    scene.add.text(cx,ty+4,SIGN_TEXT[mapId],{fontFamily:FONT,fontSize:'15px',color:'#3a3a4a',fontStyle:'bold'}).setOrigin(0.5,0).setDepth(46);
  }
  /* --- 商店街のファサード: 店ごとに看板・のれん・ショーウィンドウ --- */
  if(isStreet){
    /* 店舗のドアがある行を、最大ブロック周辺で最も 'D' の多い行として求める */
    const mainB=blocks.reduce((a,c)=>{
      const areaA=(a.x1-a.x0+1)*(a.y1-a.y0+1),areaC=(c.x1-c.x0+1)*(c.y1-c.y0+1);
      return areaC>areaA?c:a;},blocks[0]);
    let doorRow=mainB?mainB.y1:3,bestDn=-1;
    if(mainB)for(let y=mainB.y0;y<=Math.min(H-1,mainB.y1+1);y++){
      let dn=0;for(let x=0;x<W;x++)if(tiles[y][x]==='D')dn++;

function makeCharaTexture(scene,hair,uni,seed,forceStyle){
  seed=String((seed===undefined||seed===null||seed==='')?(hair+'_'+uni):seed);
  const hs=hashStr(seed);
  const style=(forceStyle===undefined||forceStyle===null)?hs%6:forceStyle;
  const skin=SKIN_TONES[(hs>>>3)%SKIN_TONES.length];
  const key='chara_'+hashStr(hair+'|'+uni+'|'+seed+'|'+style).toString(36);
  CHARA_PARAMS.set(key,{hair:hair,uni:uni,skin:skin,style:style});
  if(scene.textures.exists(key)){
    if(!scene.anims.exists(key+'-walk-d'))makeCharaAnim(scene,key);
    return key;
  }
  const o={hair:hair,uni:uni,skin:skin,style:style};
  const cv=document.createElement('canvas');cv.width=144;cv.height=256;
  const g=cv.getContext('2d');
  for(let f=0;f<3;f++){
    drawChara(g,f*48,0,'d',f,o);
    drawChara(g,f*48,192,'u',f,o);
  }
  const tc=document.createElement('canvas');tc.width=144;tc.height=64;
  const tg=tc.getContext('2d');
  for(let f=0;f<3;f++)drawChara(tg,f*48,0,'l',f,o);
  g.drawImage(tc,0,64);
  for(let f=0;f<3;f++){ /* 右向きは左向きをコマごとに反転 */
    g.save();g.translate((f+1)*48,128);g.scale(-1,1);
    g.drawImage(tc,f*48,0,48,64,0,0,48,64);
    g.restore();
  }
  scene.textures.addCanvas(key,cv);
  const tex=scene.textures.get(key);
  const rows={d:0,l:64,r:128,u:192};
  for(const d in rows)for(let f=0;f<3;f++)tex.add(d+f,0,f*48,rows[d],48,64);
  makeCharaAnim(scene,key);
  return key;
}
function makeCharaAnim(scene,key){
  for(const d of ['d','l','r','u']){
    const ak=key+'-walk-'+d;
    if(scene.anims.exists(ak))continue;
    scene.anims.create({key:ak,
      frames:[{key:key,frame:d+'1'},{key:key,frame:d+'0'},{key:key,frame:d+'2'},{key:key,frame:d+'0'}],
      frameRate:8,repeat:-1});

}

/* ---------- 入力ブリッジ: Phaser の入力を Core の入力モデルへ流す ---------- */
/* スマホ対応: 現在アクティブなシーンの CoreInput（タッチUIが流し込む先）と、
   オンスクリーンボタンの矩形（ゲーム座標 960×540）。ボタン上のタップは
   ゲーム画面へのクリックとして扱わない（ボタン操作と画面タップの二重発火防止） */
let ACTIVE_INPUT=null;
let FS_TOUCH_ON=false; /* タッチUI表示中か */
const FS_TOUCH_RECTS=[]; /* {x1,y1,x2,y2} */
function fsInTouchRect(x,y){
  for(const r of FS_TOUCH_RECTS)if(x>=r.x1&&x<=r.x2&&y>=r.y1&&y<=r.y2)return true;
  return false;
}
class CoreInput{
  constructor(scene){
    this.pressQ=[];this.clickQ=[];this.held={};
    ACTIVE_INPUT=this;
    const kb=scene.input.keyboard;
    if(kb){
      kb.addCapture(['UP','DOWN','LEFT','RIGHT','SPACE','W','A','S','D','Z','X','L','F','ENTER','ESC','PAGEUP','PAGEDOWN']);
      kb.on('keydown',e=>{this.held[e.key]=true;if(!e.repeat)this.pressQ.push(e.key);});
      kb.on('keyup',e=>{this.held[e.key]=false;});
    }
    scene.input.on('pointerdown',p=>{
      if(FS_TOUCH_ON&&fsInTouchRect(p.x,p.y))return; /* オンスクリーンボタン上のタップは除外 */
      this.clickQ.push({x:p.x,y:p.y});
    });
  }
  /* 押下エッジとクリックを Core に渡す（保持キーは __hold で毎回同期する）。
     Core 側のステップ関数が pressed／mouseClick を消費・クリアする */
  feed(){
    Core.__hold(this.held);
    for(const k of this.pressQ)Core.__press(k);
    this.pressQ.length=0;
    if(this.clickQ.length){
      const c=this.clickQ[this.clickQ.length-1];
      Core.__click(c.x,c.y);this.clickQ.length=0;
    }
  }
  /* プログラムからキー押下を注入する（動作確認用） */
  press(k){this.pressQ.push(k);}
  click(x,y){this.clickQ.push({x:x,y:y});}
}

/* ---------- スマホ対応: オンスクリーン・タッチUI（全シーン共通の重ねシーン） ----------
   仮想十字キー（移動）と Z／X／L／F ボタンを、タッチ端末でのみ表示する。
   入力は ACTIVE_INPUT（現在のゲームシーンの CoreInput）の held／pressQ へ
   キーボードと同じキー名で流すため、Core 側は無改造でタッチ操作できる。
   タイトル／会話／メニュー／ライブラリ／試合コマンドは、画面タップ自体も
   Core の mouseClick 処理でそのまま効く（ボタン矩形内だけ除外する）。
   表示判定: (pointer: coarse) の端末のみ。PC（fine ポインタ）では出さない。
   動作確認用に URL の ?touch=1 でも強制表示できる */
const FS_FORCE_TOUCH=/[?&]touch=1/.test(location.search);
function fsTouchCapable(){
  if(FS_FORCE_TOUCH)return true;

class TouchScene extends Phaser.Scene{
  constructor(){super('Touch');}

    this.built=false;

    if(fsTouchCapable())this.build();

    /* ボタン外で指を離した場合も保持キーを確実に解除する */
    this.input.on('pointerup',p=>{
      for(const b of this.btns)if(b.pointers.has(p.id)){b.pointers.delete(p.id);if(!b.pointers.size)this.releaseBtn(b);}
    });
  }
  build(){
    if(this.built)return;
    this.built=true;FS_TOUCH_ON=true;
    const D=990; /* 全シーンより前面 */
    this.g=this.add.graphics().setDepth(D);
    const defs=[
      /* 仮想十字キー（左下）: 押している間 Arrow キーを保持する */
      {x:100,y:389,k:'ArrowUp',label:'▲',hold:true,s:52},
      {x:100,y:501,k:'ArrowDown',label:'▼',hold:true,s:52},
      {x:44,y:445,k:'ArrowLeft',label:'◀',hold:true,s:52},
      {x:156,y:445,k:'ArrowRight',label:'▶',hold:true,s:52},
      /* アクションボタン（右下）: 指で押しやすい大きさ */
      {x:878,y:472,k:'z',label:'決定',sub:'Z',hold:false,s:72},
      {x:788,y:502,k:'x',label:'戻る',sub:'X',hold:false,s:54},
      {x:788,y:424,k:'l',label:'編成',sub:'L',hold:false,s:54},
      {x:882,y:390,k:'f',label:'絞込',sub:'F',hold:false,s:48},
    ];
    for(const def of defs)this.addBtn(def,D);
    /* 縦持ち時の横持ち推奨案内（上部の帯。タップは妨げない） */
    this.hintBg=this.add.rectangle(480,26,640,36,0x080c1c,0.85).setDepth(D+5).setVisible(false);

  }

    FS_TOUCH_RECTS.push(rect);

    if(def.sub)this.add.text(def.x,def.y+13,def.sub,{fontFamily:FONT,fontSize:'10px',color:'#99c2ff'}).setOrigin(0.5).setDepth(depth+2);
    const zone=this.add.zone(def.x,def.y,def.s,def.s).setInteractive();
    const btn={def:def,pointers:new Set()};
    zone.on('pointerdown',p=>{btn.pointers.add(p.id);this.applyBtn(btn);});
    const release=p=>{if(btn.pointers.delete(p.id)&&!btn.pointers.size)this.releaseBtn(btn);};

    inp.held[btn.def.k]=true;

  }
  releaseBtn(btn){
    if(ACTIVE_INPUT)ACTIVE_INPUT.held[btn.def.k]=false;
    this.drawBtn(btn,false);
  }
  drawBtn(btn,on){
    const def=btn.def,half=def.s/2,g=this.g;
    g.fillStyle(on?0x33507e:0x0a1022,on?0.92:0.62);

    const portrait=window.innerWidth<window.innerHeight;
    if(this.hintT)this.hintT.setVisible(portrait);
    if(this.hintBg)this.hintBg.setVisible(portrait);
  }
}

/* ---------- 描画ヘルパー: 矩形＋テキストの「オプ」を毎フレーム適用する ---------- */
class OpView{
  constructor(scene,depth,poolSize){
    this.scene=scene;
    this.g=scene.add.graphics().setDepth(depth).setScrollFactor(0);
    this.pool=[];
    const n=poolSize||110;
    for(let i=0;i<n;i++){
      this.pool.push(scene.add.text(0,0,'',{fontFamily:FONT,fontSize:'15px',color:'#ffffff'}).setDepth(depth+1).setVisible(false).setScrollFactor(0));
    }
    this.used=0;
    /* 会話の顔表示専用の Image（テクスチャ画像は Graphics では描けないため
       別枠で持つ。begin() で毎フレーム隠し、viewDialog が話者ありの行の
       時だけ face() で出す。それ以外の画面には一切出ない） */
    if(!scene.textures.exists('__dlgface_blank')){
      const bcv=document.createElement('canvas');bcv.width=1;bcv.height=1;
      scene.textures.addCanvas('__dlgface_blank',bcv);
    }
    this.faceImg=scene.add.image(0,0,'__dlgface_blank').setDepth(depth+1).setVisible(false).setScrollFactor(0).setOrigin(0,0);
    this.faceKey=null;this.faceCrop=null;
  }
  begin(){this.g.clear();this.used=0;this.faceImg.setVisible(false);}
  /* 顔テクスチャを (x,y) に size×size で表示する。
     crop はテクスチャ画素での切り抜き {x,y,w,h}（null なら全体） */
  face(key,x,y,size,crop){
    const img=this.faceImg;
    const ck=crop?(crop.x+','+crop.y+','+crop.w+','+crop.h):'';
    if(this.faceKey!==key||this.faceCrop!==ck){
      img.setTexture(key);
      if(crop)img.setCrop(crop.x,crop.y,crop.w,crop.h);
      else img.setCrop(0,0,img.frame.realWidth||img.frame.width,img.frame.realHeight||img.frame.height);
      this.faceKey=key;this.faceCrop=ck;
    }
    img.setPosition(x,y);img.setDisplaySize(size,size);img.setVisible(true);
  }
  rect(x,y,w,h,fill,alpha){
    this.g.fillStyle(fill,alpha===undefined?1:alpha);this.g.fillRect(x,y,w,h);
  }
  stroke(x,y,w,h,color,lw){
    this.g.lineStyle(lw||2,color,1);this.g.strokeRect(x,y,w,h);
  }
  text(x,y,s,size,color,opt){
    if(this.used>=this.pool.length)return;
    const t=this.pool[this.used++];
    opt=opt||{};
    t.setVisible(true);
    t.setPosition(x,y);
    t.setFontSize(size||15);
    t.setColor(color||'#ffffff');
    t.setFontStyle(opt.bold?'bold':'');
    t.setOrigin(opt.ox||0,opt.oy||0);
    t.setLineSpacing(opt.ls||0);
    t.setText(s===undefined||s===null?'':String(s));
  }
  end(){
    for(let i=this.used;i<this.pool.length;i++)this.pool[i].setVisible(false);
  }
}

      fetch('assets/cutin/manifest.json').then(r=>r.ok?r.json():[]).then(list=>{
        DLG_ILLU.manifest=new Set(Array.isArray(list)?list:[]);
        const q=DLG_ILLU.queue.splice(0);DLG_ILLU.queued.clear();
        for(const [s,n] of q)ensureDlgIllu(s,n);
      }).catch(()=>{DLG_ILLU.manifest=new Set();DLG_ILLU.queue.splice(0);DLG_ILLU.queued.clear();});
    }
    if(!DLG_ILLU.queued.has(nm)){DLG_ILLU.queued.add(nm);DLG_ILLU.queue.push([scene,nm]);}
    return;
  }
  if(!file)return;
  scene.__dlgIlluLoading=scene.__dlgIlluLoading||new Set();
  scene.__dlgIlluLoading.add(nm);
  scene.load.image('dlgillu_'+nm,'assets/cutin/'+encodeURIComponent(file));
  scene.load.start();
}
/* 話者の顔を解決する。戻り値 {key, crop}（crop=null はドット顔＝全体表示） */
function dlgFace(scene,name){
  const C=Core;
  const nm=String(name||'').replace(/[\s　]/g,'');
  if(!nm)return null;
  /* 1段目: 本人イラスト */
  ensureDlgIllu(scene,nm);
  for(const key of ['cutin_'+nm,'dlgillu_'+nm]){
    if(!scene.textures.exists(key))continue;
    if(key.indexOf('cutin_')===0&&scene.cutinReg){
      const rec=scene.cutinReg.get(key);
      if(rec&&rec.status!=='ok')continue;
    }
    const src=scene.textures.get(key).getSourceImage();
    if(!src||!src.width)continue;
    /* 切り抜きは専用キャンバステクスチャに焼き込んでから表示する
       （Image の setCrop は表示スケール計算と干渉するため使わない） */
    const faceKey='dlgface_'+nm;
    if(!scene.textures.exists(faceKey)){
      const d=FACE_CROPS[nm]||FACE_CROP_DEFAULT;
      const side=Math.min(d.s*src.height,src.width,src.height);
      const x=Math.max(0,Math.min(src.width-side,d.cx*src.width-side/2));
      const y=Math.max(0,Math.min(src.height-side,d.cy*src.height-side/2));
      const cv=document.createElement('canvas');cv.width=160;cv.height=160;
      cv.getContext('2d').drawImage(src,x,y,side,side,0,0,160,160);
      scene.textures.addCanvas(faceKey,cv);
    }
    return {key:faceKey,crop:null};
  }
  /* 2段目: ドット顔 */
  if(nm==='高嶺陽翔')return {key:makeFaceTexture(scene,'#a03c28','#bfe3ff','高嶺 陽翔'),crop:null};
  let npc=null,npcSuf=null;
  for(const mid in C.MAPS)for(const n of C.MAPS[mid].npcs){
    if(n.name===name)npc=n;
    else if(n.name&&name.length>n.name.length&&name.endsWith(n.name)&&(!npcSuf||n.name.length>npcSuf.name.length))npcSuf=n;
  }
  const nn=npc||npcSuf;
  if(nn)return {key:makeFaceTexture(scene,nn.hair,nn.uni,nn.name),crop:null};
  const p=C.baseOf(name);
  if(p)return {key:makeFaceTexture(scene,p.hair,C.ELEM[p.elem].c,p.name),crop:null};
  const hs=hashStr(nm);
  const HAIRS=['#3a3a44','#5e4632','#26355e','#7a4a22','#2c2c2c','#4a2c3a','#6e5e3a','#8e2a1e'];
  const UNIS=['#cbb','#bfe3ff','#d8e0f0','#e8dcc0','#c8ccd8','#d0d8e8','#ffe0d0','#d8ffd0'];
  return {key:makeFaceTexture(scene,HAIRS[hs%HAIRS.length],UNIS[(hs>>>4)%UNIS.length],nm),crop:null};
}

/* ============================================================
   探索シーン（Core の exploreUpdate を駆動し、状態を描画する）
   マップ／NPC／スポット／会話／メニュー／特訓／ショップ／加入・章
   イベント／クリア後ルート／ライブラリ／編成はすべて Core 側の
   ロジックが動き、ここでは Core.player・curMapId・各UI状態を
   Phaser で描く。マップ遷移（ワープ）は curMapId の変化で検出する。
   ============================================================ */
class ExploreScene extends Phaser.Scene{
  constructor(){super('Explore');}
  create(){
    const C=Core;
    this.mapId=C.curMapId;
    this.mapData=C.MAPS[this.mapId];
    this.input2=new CoreInput(this);
    const map=this.mapData;
    /* --- タイルマップ（バリエーション割り当ては描画側のみ） --- */
    const tsKey=makeTileset(this,this.mapId);
    const data=map.tiles.map((row,y)=>row.split('').map((ch,x)=>tileIndexFor(this.mapId,ch,x,y)));
    const tm=this.make.tilemap({data:data,tileWidth:32,tileHeight:32});
    const ts=tm.addTilesetImage('tiles',tsKey,32,32,0,0);
    tm.createLayer(0,ts,0,0);
    /* --- 装飾レイヤー（木・建物・小物。第4段階） --- */
    buildExploreDecor(this,map,this.mapId);
    this.add.text(map.labelX,map.labelY-15,map.label,{fontFamily:FONT,fontSize:'15px',color:'#20304a',fontStyle:'bold'}).setDepth(50);
    /* --- 特訓スポットのマーカー（v1.0 drawExplore と同じ見た目） --- */
    const SPOT_COLORS=[0xe0684a,0xc9a44a,0x4a9e6a,0x4a7ac9,0x9a5ac9,0x3fb8c9,0xb8724a,0x7ac94a];
    const SPOT_SHORT=['スパ','ブロ','レシ','サー','トス','スピ','スタ','運'];
    const sg=this.add.graphics().setDepth(60);
    for(const s of (map.spots||[])){
      const x=s.x*32,y=s.y*32;
      if(s.id==='SHOP'){
        sg.fillStyle(0xe0a33e,1);sg.fillRect(x+2,y+9,28,14);
        this.add.text(x+11,y+11,'店',{fontFamily:FONT,fontSize:'9px',color:'#10131f',fontStyle:'bold'}).setDepth(61);
      }else if(s.stat<0){
        sg.fillStyle(0x57d95e,1);sg.fillRect(x+6,y+12,20,7);sg.fillRect(x+12,y+6,7,20);
      }else if(s.hidden){
        sg.fillStyle(0xffffff,0.4);sg.fillRect(x+14,y+14,4,4);
      }else{
        sg.fillStyle(SPOT_COLORS[s.stat],1);sg.fillRect(x+2,y+9,28,14);
        this.add.text(x+5,y+11,SPOT_SHORT[s.stat],{fontFamily:FONT,fontSize:'9px',color:'#10131f',fontStyle:'bold'}).setDepth(61);
      }
    }
    /* --- ワープの行き先ラベル（Core v1.0.2 の表示に合わせる。
       ラベル全体がマップ内に収まるよう、Core と同じく左右位置をクランプする） --- */
    for(const w of (map.warps||[])){
      const dest=C.MAPS[w.to];if(!dest)continue;
      const lt=this.add.text(w.x*32+16,w.y*32-17,'→ '+dest.name,{fontFamily:FONT,fontSize:'11px',color:'#ffd76a',
        backgroundColor:'rgba(8,12,28,.85)',padding:{x:5,y:1}}).setOrigin(0.5,0).setDepth(62);
      const half=lt.width/2,mapW=map.tiles[0].length*32;
      lt.x=Math.max(half+2,Math.min(mapW-half-2,lt.x));
    }
    /* --- NPC（48×64 スプライト: 足元をタイル下端に合わせ、横はタイル中央） --- */
    for(const n of map.npcs){
      const key=makeCharaTexture(this,n.hair,n.uni,n.name);
      this.add.sprite(n.x+16,n.y+33,key,'d0').setOrigin(0.5,1).setDepth(n.y+32);
      this.add.text(n.x+16,n.y-38,n.name,{fontFamily:FONT,fontSize:'11px',color:'#ffffff'}).setOrigin(0.5,0).setDepth(n.y+33);
    }
    /* --- 重要NPCマーカー（頭上の「！」） ---
       対象は Core の eventNpcIds() で判定する（今話しかけると物語イベントが
       起きるNPC: 序章の凪／加入イベント対象／コア8人後の凪）。
       表示可否は update() で毎フレーム再判定し、進行に合わせて付け替える */
    this.eventMarks={};
    for(const n of map.npcs){
      const t=this.add.text(n.x+16,n.y-66,'！',{fontFamily:FONT,fontSize:'15px',color:'#ffffff',fontStyle:'bold',
        backgroundColor:'#e04a3a',padding:{x:5,y:1}}).setOrigin(0.5,0).setDepth(n.y+35).setVisible(false);
      this.eventMarks[n.id]={txt:t,npc:n};
    }
    /* --- 話しかけプロンプト（Core の話しかけ判定＝最寄りNPCまで44px以内・
       向き不問で斜めからも届く、と同じ条件で NPC の頭上に表示する） --- */
    this.talkPrompt=this.add.text(0,0,'▼ 話す',{fontFamily:FONT,fontSize:'12px',color:'#ffffff',
      backgroundColor:'rgba(8,12,28,.85)',padding:{x:5,y:2}}).setOrigin(0.5,0).setVisible(false);
    /* --- プレイヤー（位置は Core.player が正。主人公はツンツン髪で固定） --- */
    this.playerKey=makeCharaTexture(this,'#a03c28','#bfe3ff','高嶺 陽翔',1);
    this.playerSpr=this.add.sprite(C.player.x+16,C.player.y+33,this.playerKey,'d0').setOrigin(0.5,1);
    this.faceDir='d';
    this.lastPx=C.player.x;this.lastPy=C.player.y;
    /* --- HUD（所持P＋次の目標。カメラに追従させず画面固定） --- */
    const hg=this.add.graphics().setDepth(800).setScrollFactor(0);
    hg.fillStyle(0x080c1c,0.85);hg.fillRect(10,10,560,56);
    hg.fillStyle(0x080c1c,0.7);hg.fillRect(620,10,330,24);
    this.pointsT=this.add.text(20,18,'',{fontFamily:FONT,fontSize:'15px',color:'#ffd76a'}).setDepth(801).setScrollFactor(0);
    this.goalT=this.add.text(20,42,'',{fontFamily:FONT,fontSize:'12px',color:'#ccffee'}).setDepth(801).setScrollFactor(0);
    this.add.text(632,16,'Z:話す　X:選手　L:ライブラリ/編成',{fontFamily:FONT,fontSize:'12px',color:'#ccffee'}).setDepth(801).setScrollFactor(0);
    /* --- カメラ（第4段階フォローアップ: v1.0.3 の拡大マップ 38×21 対応） ---
       プレイヤーへ追従し、マップ端でクランプする */
    const cam=this.cameras.main;
    cam.setBounds(0,0,map.tiles[0].length*32,map.tiles.length*32);
    cam.startFollow(this.playerSpr,true,0.12,0.12);
    cam.centerOn(this.playerSpr.x,this.playerSpr.y); /* 初期位置へ即スナップ（パン防止） */
    /* --- Core UI の描画ビュー --- */
    this.view=new OpView(this,900,120);
    this.refreshHud();
  }
  refreshHud(){
    const C=Core;
    this.pointsT.setText('ねっけつP '+C.G.nekketsu+'　ゆうじょうP '+C.G.yuujou+'　部費 '+(C.G.buhi||0)+'円');
    this.goalT.setText(C.hudGoalLine()||'');
  }
  update(time,delta){
    const C=Core;
    const dt=Math.min(0.05,delta/1000||0.016);
    this.input2.feed();
    C.__stepExplore(dt);
    /* シーン遷移の検出: 試合開始（Core.scene が 'match' に変わる） */
    if(C.scene==='match'&&C.M){this.scene.start('Match');return;}
    /* マップ遷移の検出: ワープで Core.curMapId が変わる */
    if(C.curMapId!==this.mapId){this.scene.restart();return;}
    /* プレイヤー描画（Core.player に追随。移動方向で歩行アニメを切り替える） */
    const px=C.player.x,py=C.player.y;
    const dx=px-this.lastPx,dy=py-this.lastPy;
    const moving=(dx!==0||dy!==0);
    this.playerSpr.setPosition(px+16,py+33).setDepth(py+32);
    if(moving){
      if(Math.abs(dx)>=Math.abs(dy))this.faceDir=dx>0?'r':'l';
      else this.faceDir=dy>0?'d':'u';
      this.playerSpr.play(this.playerKey+'-walk-'+this.faceDir,true);
    }else{
      this.playerSpr.anims.stop();
      this.playerSpr.setFrame(this.faceDir+'0');
    }
    this.lastPx=px;this.lastPy=py;
    this.refreshHud();
    /* 話しかけプロンプト: 会話・メニュー等が開いていない時だけ、
       判定範囲内（44px以内）の最寄りNPCの頭上に「▼ 話す」を出す */
    let promptNpc=null;
    if(!C.dlg&&!C.menu&&!C.lib&&!C.form&&!C.profileOpen){
      let bd=44;
      for(const n of this.mapData.npcs){
        const d=Math.hypot(px-n.x,py-n.y);
        if(d<bd){bd=d;promptNpc=n;}
      }
    }
    if(promptNpc)this.talkPrompt.setPosition(promptNpc.x+16,promptNpc.y-62).setDepth(promptNpc.y+34).setVisible(true);
    else this.talkPrompt.setVisible(false);
    /* 重要NPCマーカー: 会話・メニュー等が開いている間は隠す。
       話しかけプロンプトが出ている本人については、プロンプトを優先して隠す */
    {
      const markIds=(C.eventNpcIds?C.eventNpcIds():[]);
      const uiOpen=!!(C.dlg||C.menu||C.lib||C.form||C.profileOpen);
      const bob=Math.round(Math.sin(time/280)*3);
      for(const id in this.eventMarks){
        const mk=this.eventMarks[id];
        const on=!uiOpen&&markIds.indexOf(id)>=0&&promptNpc!==mk.npc;
        mk.txt.setVisible(on);
        if(on)mk.txt.setPosition(mk.npc.x+16,mk.npc.y-66+bob).setDepth(mk.npc.y+35);
      }
    }
    /* Core UI の描画（会話→メニュー→プロフィール→ライブラリ→編成の順に重ねる） */
    const v=this.view;v.begin();
    viewDialog(v);
    viewMenu(v);
    viewProfile(v);
    viewLibrary(v);
    viewForm(v);
    v.end();
  }
}

/* ---------- 必殺技演出強化用ヘルパー（Phaser 側の解釈のみ。Core は不変） ----------
   技の威力ランクは Core の技データ（t.rank＝弱／中／強／最強、t.pow）から
   読み取るだけ。ヒットストップ秒とシェイク量はランクで段階付ける */
function rankOfTech(t){
  if(!t)return '中';
  if(t.rank)return t.rank;
  const pw=t.pow||0;
  return pw>=50?'最強':pw>=32?'強':pw>=18?'中':'弱';
}

    this.lbProg=0;this.prevCutin=null;this.lastCutin=null;

    /* --- カットイン用（顔ドット絵＋属性エフェクト） --- */

       横長イラストを大きく表示しても、帯の外と技名エリアにはみ出さない */
    const cmg=this.make.graphics({add:false});
    cmg.fillStyle(0xffffff,1);cmg.fillRect(0,210,380,120);
    this.cutinMask=cmg.createGeometryMask();
    /* --- カットイン・イラストのローダ（第4段階・3段フォールバック） ---
       1) assets/cutin/<選手フルネーム（空白除去）>（本人イラスト）
       2) assets/cutin/generic-<属性キー>-<性別>（属性×性別の汎用イラスト）
       3) 顔ドット絵（従来）
       実ファイルは manifest.json にある分だけ読み込み（無いファイルへの
       404を防ぐ）、WebP を優先して PNG にフォールバックする。
       読み込み成否はテクスチャキーごとに記録する */
    this.cutinReg=new Map(); /* テクスチャキー -> {status:'loading'|'ok'|'ng',key} */
    this.load.on('loaderror',file=>{
      const rec=this.cutinReg.get(file.key);
      if(rec)rec.status='ng';
    });
    this.cutinManifest=null; /* null=取得中。Set にファイル名一覧が入る */
    this.cutinPending=[];
    fetch('assets/cutin/manifest.json').then(r=>r.ok?r.json():[]).then(list=>{
      this.cutinManifest=new Set(Array.isArray(list)?list:[]);

    }).catch(()=>{this.cutinManifest=new Set();this.cutinPending=[];});
    if(C.M){
      for(const p of [...C.M.A.all,...C.M.H.all])this.ensureCutin(p);
      this.lastScore=C.M.scoreA+C.M.scoreH;
      this.lastScoreA=C.M.scoreA;this.lastScoreH=C.M.scoreH;
    }

    this.view=new OpView(this,900,120);

  /* テクスチャ1枚の読み込みを開始する（成否は cutinReg に記録） */
  loadCutinTex(key,url){
    if(this.cutinReg.has(key))return;
    if(this.textures.exists(key)){this.cutinReg.set(key,{status:'ok',key:key});return;}
    const rec={status:'loading',key:key};
    this.cutinReg.set(key,rec);
    this.load.image(key,url);
    this.load.once('filecomplete-image-'+key,()=>{rec.status='ok';});
    this.load.start();
  }
  /* 選手のカットイン素材（本人＋汎用）の読み込みを開始する。
     manifest 取得前は保留し、取得後にまとめて読み込む */
  ensureCutin(p){
    if(this.cutinManifest===null){
      if(!this.cutinPending.includes(p))this.cutinPending.push(p);
      return;
    }
    const nm=String((p&&p.name)||'').replace(/[\s　]/g,'');
    if(nm)this.loadCutinFile('cutin_'+nm,nm);
    const ek=ELEM_KEY[p&&p.elem];
    if(ek)this.loadCutinFile('cutingen_'+ek+'_'+genderOf(p),'generic-'+ek+'-'+genderOf(p));
  }
  /* ベース名（拡張子なし）から manifest 内の実ファイルを選び読み込む。
     WebP 優先・PNG フォールバック。どちらも無ければ読みに行かない */
  loadCutinFile(key,base){
    if(this.cutinReg.has(key))return;
    let file=null;
    if(this.cutinManifest.has(base+'.webp'))file=base+'.webp';
    else if(this.cutinManifest.has(base+'.png'))file=base+'.png';
    if(!file){this.cutinReg.set(key,{status:'ng',key:key});return;}
    this.loadCutinTex(key,'assets/cutin/'+encodeURIComponent(file));
  }
  /* 現在のカットインで使えるイラスト情報（{key,w,h} or null）。
     本人イラスト優先、無ければ属性×性別の汎用イラスト */
  cutinIlluFor(p){
    const nm=String((p&&p.name)||'').replace(/[\s　]/g,'');
    const ek=ELEM_KEY[p&&p.elem];
    const keys=['cutin_'+nm];
    if(ek)keys.push('cutingen_'+ek+'_'+genderOf(p));
    for(const key of keys){
      const rec=this.cutinReg.get(key);
      if(!rec||rec.status!=='ok')continue;
      const src=this.textures.get(rec.key).getSourceImage();
      if(!src||!src.width)continue;
      const H=336,W=Math.round(H*src.width/src.height);
      return {key:rec.key,w:W,h:H};
    }
    return null;
  }
  entryFor(p,uni,facing){
    let e=this.sprMap.get(p);
    if(e)return e;
    const key=makeCharaTexture(this,p.hair,uni,p.name||p.short);
    const spr=this.add.sprite(p.x||480,p.y||270,key,'d0').setOrigin(0.5,1);
    const nameT=this.add.text(0,0,p.short,{fontFamily:FONT,fontSize:'10px',color:'#ffffff'}).setOrigin(0.5,0);
    const awT=this.add.text(0,0,'',{fontFamily:FONT,fontSize:'9px',color:'#ffd76a'}).setOrigin(0.5,0);
    e={spr:spr,nameT:nameT,awT:awT,baseKey:key,facing:facing,pose:null,tex:null};
    this.sprMap.set(p,e);
    return e;
  }
  /* 対決の局面から各選手のアクションポーズを決める（描画側の解釈のみ。Core は不変） */
  computePoses(M,time){
    const poses=new Map();
    const setP=(p,pose)=>{if(p&&pose&&!poses.has(p))poses.set(p,pose);};
    const now=time||0;
    if(M.cutin){
      const cat=M.cutin.t&&M.cutin.t.cat;
      setP(M.cutin.p,cat==='spike'?'spike':cat==='block'?'block':cat==='receive'?'receive':cat==='toss'?'toss':cat==='serve'?'toss':null);
    }
    if(M.phase==='spikeMenu')setP(M.actor,'spike');
    else if(M.phase==='tossMenu')setP(M.actor,'toss');
    else if(M.phase==='receiveMenu')setP(M.actor,'receive');
    else if(M.phase==='serveMenu')setP(M.actor,'toss');
    else if(M.phase==='defendMenu'){
      setP(M.actor,'receive');
      let bl=null;
      for(const s of [1,2,3]){const p=M.A.court[s];if(p&&(!bl||p.st[1]>bl.st[1]))bl=p;}
      setP(bl,'block');
    }
    if(M.ballAnim){
      const b=M.ballAnim;
      /* 飛来先の選手はレシーブ姿勢で迎える */
      let dest=null,bd=1e9;
      for(const t of [M.A,M.H])for(const p of t.court){
        const d=(p.x-b.x1)*(p.x-b.x1)+(p.y-b.y1)*(p.y-b.y1);
        if(d<bd){bd=d;dest=p;}
      }
      if(dest&&bd<1600)setP(dest,'receive');
      /* スパイク飛行中: 打った選手はスパイク、相手前衛2枚はブロック */
      if(M.pointActors&&M.pointActors[1]&&b.x1===480){
        const att=M.pointActors[1];
        setP(att,'spike');setP(M.pointActors[0],'toss');
        const df=M.A.court.includes(att)?M.H:M.A;
        const fronts=[1,2,3].map(s=>df.court[s]).filter(Boolean).sort((a,c)=>c.st[1]-a.st[1]);
        setP(fronts[0],'block');setP(fronts[1],'block');
        this.recentAtt={p:att,until:now+900};
      }
    }
    if(!M.ballAnim&&this.recentAtt&&now<this.recentAtt.until)setP(this.recentAtt.p,'spike');
    return poses;
  }
  applyPose(e,pose){
    const spr=e.spr;
    if(pose){
      const pk=makePoseTexture(this,e.baseKey,pose);
      if(e.tex!==pk){spr.setTexture(pk);e.tex=pk;}
      spr.setFlipX(e.facing==='l');
      const lift=pose==='spike'?-18:pose==='block'?-13:pose==='toss'?-3:0;
      spr.y+=lift;
    }else{
      if(e.tex!==e.baseKey){spr.setTexture(e.baseKey,e.facing+'0');e.tex=e.baseKey;}
      spr.setFlipX(false);
      spr.setFrame(e.facing+'0');
    }
    e.pose=pose;
  }
  /* ボールの残像とヒットエフェクト（閃光・スピード線・火花）を描く */
  drawBallFx(dt){
    const fx=this.fxG;fx.clear();
    const MM=Core.M;
    /* 必殺技の溜めオーラ: カットインの間、使用者を属性色の光で包む。
       進み具合（timer 1.15→0）で輪が広がり、火花が上っていく */
    if(MM&&MM.cutin){
      const cp=MM.cutin.p,ccol=C16(Core.ELEM[cp.elem].c);
      const tt=this.time.now/1000,pr=clamp(1-(MM.cutin.timer/1.15),0,1);
      const cx=cp.x,cy=cp.y+2,R=26+pr*17+Math.sin(tt*10)*2;
      fx.fillStyle(ccol,0.15+0.10*pr);fx.fillEllipse(cx,cy,R*1.15,R*1.55);
      fx.fillStyle(0xffffff,0.09+0.08*pr);fx.fillEllipse(cx,cy,R*0.62,R*0.9);
      fx.lineStyle(2,ccol,0.75);fx.strokeEllipse(cx,cy,R*1.15,R*1.55);
      for(let i=0;i<7;i++){
        const ph=(tt*0.9+i/7)%1;
        const px=cx+Math.sin(i*2.39+tt*3)*R*0.7,py=cy+18-ph*56;
        fx.fillStyle(i%2?0xffffff:ccol,0.85*(1-ph));fx.fillRect(px-1.5,py-1.5,3,3);
      }
    }
    /* 残像: 古いものほど小さく薄く。必殺技の飛行中は属性別の軌跡になる */
    const tnow=this.time.now/1000;
    this.ballTrail.forEach((pt,i)=>{
      if(i===0)return;
      const k=i/this.ballTrail.length,a=0.30*(1-k);
      if(!pt.elem){
        fx.fillStyle(0xffffff,a);fx.fillCircle(pt.x,pt.y,7-i*0.6);
        fx.fillStyle(0x9fd0ff,a*0.8);fx.fillCircle(pt.x,pt.y,4-i*0.35);
        return;
      }
      if(pt.elem==='火'){ /* 炎の尾: 3色の火球が揺らぎながら細る */
        const cols=[0xff5030,0xff8a3c,0xffd76a];
        const fl=Math.sin(tnow*34+i*2.1)*1.6;
        fx.fillStyle(cols[(i+((tnow*9)|0))%3],0.55*(1-k));
        fx.fillCircle(pt.x,pt.y+fl*0.4,Math.max(1.5,8-i*0.5));
        if(i%3===0){fx.fillStyle(0xffd76a,0.7*(1-k));fx.fillRect(pt.x-1,pt.y-8-i*0.4,2,2);}
      }else if(pt.elem==='風'){ /* 渦: 弧の連なりと風切りの粒（明るい床でも見えるよう濃いめに） */
        fx.lineStyle(2,0x7ac9e8,0.8*(1-k));
        fx.beginPath();fx.arc(pt.x,pt.y,6+i*0.8,i*0.9+tnow*6,i*0.9+tnow*6+2.2);fx.strokePath();
        fx.lineStyle(2,0xe8fbff,0.65*(1-k));
        fx.beginPath();fx.arc(pt.x,pt.y,3.5+i*0.5,i*0.9+tnow*6+2.6,i*0.9+tnow*6+4.6);fx.strokePath();
        fx.fillStyle(0xffffff,0.6*(1-k));fx.fillCircle(pt.x,pt.y,2.2);
      }else if(pt.elem==='林'){ /* 葉: 緑の葉片が舞う */
        const cols=[0x3fae5a,0x63c474,0x2c7a40];
        fx.fillStyle(cols[i%3],0.85*(1-k));
        fx.fillEllipse(pt.x,pt.y+Math.sin(i*1.7)*2,Math.max(3,11-i*0.55),Math.max(2,5.5-i*0.3));
      }else{ /* 山: 土煙が広がって沈む（重量感） */
        fx.fillStyle(i%2?0xb8862f:0x8a6a3a,0.38*(1-k));
        fx.fillCircle(pt.x,pt.y+2+k*5,5+i*0.55);
        fx.fillStyle(0xe8cf9a,0.4*(1-k));fx.fillCircle(pt.x,pt.y,2.4);
      }
    });
    /* ヒットエフェクト */
    this.hitFx=this.hitFx.filter(h=>(h.t+=dt)<h.dur);
    for(const h of this.hitFx){
      const k=h.t/h.dur,R0=h.big?64:44;
      /* 閃光コア */
      fx.fillStyle(0xffffff,0.85*(1-k));fx.fillCircle(h.x,h.y,(h.big?16:11)*(1-k*0.5));
      fx.fillStyle(0xffd76a,0.55*(1-k));fx.fillCircle(h.x,h.y,(h.big?30:20)*(0.4+k*0.6));
      /* 拡散リング */
      fx.lineStyle(3,0xffe9a0,0.8*(1-k));fx.strokeCircle(h.x,h.y,6+k*R0);
      fx.lineStyle(2,0xffffff,0.5*(1-k));fx.strokeCircle(h.x,h.y,3+k*R0*0.6);
      /* スピード線（放射状） */
      fx.lineStyle(2,0xffffff,0.75*(1-k));
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4+0.4,r1=8+k*R0*0.5,r2=r1+10+k*R0*0.5;
        fx.beginPath();fx.moveTo(h.x+Math.cos(a)*r1,h.y+Math.sin(a)*r1);
        fx.lineTo(h.x+Math.cos(a)*r2,h.y+Math.sin(a)*r2);fx.strokePath();
      }
      /* 火花 */
      for(let i=0;i<6;i++){
        const a=i*1.13+0.7,d=k*(h.big?52:36);
        fx.fillStyle(i%2?0xffd76a:0xff8a3c,0.9*(1-k));
        fx.fillRect(h.x+Math.cos(a)*d-1.5,h.y+Math.sin(a)*d-1.5,3,3);
      }
    }
  }
  update(time,delta){
    const C=Core;
    const dt=Math.min(0.05,delta/1000||0.016);
    /* ヒットストップ中は入力も Core の進行も止める（描画だけ続ける）。
       数十〜百数十ms の短時間だけなので、ラリーのテンポは壊さない */
    if(this.hitStopT>0){
      this.hitStopT-=dt;
    }else{
      this.input2.feed();
      C.__stepMatch(dt);
    }
    if(C.scene!=='match'){this.scene.start('Explore');return;}
    const M=C.M;
    if(!M)return;
    /* --- カットインの開始／終了を検出して演出フックを打つ --- */
    if(M.cutin&&this.prevCutin!==M.cutin){
      SE.cutin();SE.charge(C.fxFast());
    }
    if(!M.cutin&&this.prevCutin){
      const pc=this.prevCutin;
      this.lastCutin={elem:(pc.t&&pc.t.elem)||pc.p.elem,rank:rankOfTech(pc.t),cat:pc.t?pc.t.cat:null,at:time};
    }
    this.prevCutin=M.cutin||null;
    /* レターボックスの開閉（目標へなめらかに寄せる） */
    const lbTgt=M.cutin?1:0;
    this.lbProg+=(lbTgt-this.lbProg)*Math.min(1,dt*10);
    if(Math.abs(lbTgt-this.lbProg)<0.02)this.lbProg=lbTgt;
    /* --- 選手スプライト同期（コート内のみ表示） --- */
    const poses=this.computePoses(M,time);
    const onCourt=new Set();
    const syncTeam=(team,uni,libUni,facing)=>{
      for(const p of team.court){
        onCourt.add(p);
        const e=this.entryFor(p,p.pos==='L'?libUni:uni,facing);
        e.spr.setVisible(true);e.nameT.setVisible(true);
        e.spr.setPosition(p.x,p.y+20).setDepth(p.y+20);
        this.applyPose(e,poses.get(p)||null);
        const awL=C.awakeLeft(p);
        e.nameT.setPosition(p.x,p.y-58).setDepth(p.y+21);
        e.nameT.setColor(awL?'#ffd76a':'#ffffff');
        e.nameT.setText((awL?'★':'')+p.short);
        if(awL){e.awT.setVisible(true);e.awT.setPosition(p.x,p.y-70).setDepth(p.y+21);e.awT.setText('覚醒 残り'+awL);}
        else e.awT.setVisible(false);
      }
    };
    syncTeam(M.A,'#bfe3ff','#f2b13c','r'); /* 自チームはネット（右）向き */
    syncTeam(M.H,'#eef2f2','#f2b13c','l'); /* 相手はネット（左）向き */
    for(const [p,e] of this.sprMap){
      if(!onCourt.has(p)){e.spr.setVisible(false);e.nameT.setVisible(false);e.awT.setVisible(false);}
    }
    /* --- ボール（軌跡・スピン・ヒットエフェクト） --- */
    this.ballSpr.setPosition(M.ball.x,M.ball.y);
    if(M.ballAnim){
      if(this.lastAnim!==M.ballAnim){
        this.lastAnim=M.ballAnim;
        this.flightSpike=!!(M.pointActors&&M.pointActors[1]&&M.ballAnim.x1===480);
        /* カットイン直後の最初の飛行＝その必殺技のボールとして属性を付ける
           （AI必殺スパイクはカットイン→守備メニュー→飛行の順でも拾えるよう、
           得点で消費されるまで保持する）。放たれる瞬間に打撃音＋小ヒット
           ストップ＋小シェイクを入れる */
        this.flightElem=null;this.justScoredElem=null;
        if(this.lastCutin&&time-this.lastCutin.at<9000){
          this.flightElem={elem:this.lastCutin.elem,rank:this.lastCutin.rank,cat:this.lastCutin.cat};
          this.lastCutin=null;
          SE.hit(this.flightElem.rank);
          const hs=HITSTOP_S[this.flightElem.rank]||0.06;
          this.hitStopT=Math.max(this.hitStopT,C.fxFast()?hs*0.4:hs);
          this.cameras.main.shake(110,SHAKE_F[this.flightElem.rank]||0.002);
          const tn=ELEM_TINT[this.flightElem.elem];
          if(tn)this.ballSpr.setTint(tn);
        }
      }
      this.ballSpr.rotation+=dt*9;
      const s=1+0.15*Math.sin(Math.min(1,M.ballAnim.t)*Math.PI);
      this.ballSpr.setScale(s);
      this.ballTrail.unshift({x:M.ball.x,y:M.ball.y,elem:this.flightElem?this.flightElem.elem:null});
      const cap=this.flightElem?15:9;
      if(this.ballTrail.length>cap)this.ballTrail.pop();
    }else{
      if(this.lastAnim){ /* 飛行終了: スパイクのネット接触で閃光 */
        if(this.flightSpike)this.hitFx.push({x:480,y:this.lastAnim.y1,t:0,dur:0.3,big:false});
        this.lastAnim=null;this.flightSpike=false;
        /* 得点は飛行終了と同フレームに確定するので、属性は得点判定まで保持 */
        this.justScoredElem=this.flightElem;this.flightElem=null;
        this.ballSpr.clearTint();
      }
      this.ballSpr.rotation=0;this.ballSpr.setScale(1);
      if(this.ballTrail.length)this.ballTrail.pop();
    }
    /* 得点が入ったらボールの位置に大きめの閃光 */
    const sc=M.scoreA+M.scoreH;
    if(sc!==this.lastScore){
      if(this.recentAtt&&time<this.recentAtt.until+600)
        this.hitFx.push({x:M.ball.x,y:M.ball.y,t:0,dur:0.45,big:true});
      /* 得点音＋、必殺技で決まった点なら強めのヒットストップとシェイク */
      SE.score(M.scoreA>this.lastScoreA);
      const fe=this.flightElem||this.justScoredElem;
      if(fe){
        const hs=HITSTOP_P[fe.rank]||0.07;
        this.hitStopT=Math.max(this.hitStopT,C.fxFast()?hs*0.4:hs);
        this.cameras.main.shake(170,SHAKE_P[fe.rank]||0.003);
      }
      this.lastCutin=null; /* ラリー終了。次のラリーの飛行へ誤って付けない */
      this.lastScore=sc;this.lastScoreA=M.scoreA;this.lastScoreH=M.scoreH;
    }
    this.justScoredElem=null;
    this.drawBallFx(dt);
    /* --- パネル類の描画 --- */
    const v=this.view;v.begin();
    /* スコアボード */
    v.rect(230,8,500,44,0x080c1c,0.92);
    v.text(480,16,M.myName+' '+M.scoreA+' ― '+M.scoreH+' '+M.oppName,22,'#ffffff',{bold:true,ox:0.5});
    v.text(736,TY(32,12),'● '+(M.serve==='A'?M.myName:M.oppName)+'サーブ',12,'#ffd76a');
    /* メッセージバー（試合結果の表示中は結果文をパネル側に任せ、
       バーには描かない。「探索に戻る」メニューとの重なりを避ける） */
    v.rect(180,456,600,42,0x080c1c,0.88);
    if(!(M.over&&M.result))v.text(192,464,wrapJa(M.msg||'',566,'15px sans-serif'),15,'#ffffff',{ls:3});
    /* チームパネル（自チームのコート内選手 FP/TP） */
    v.rect(6,452,168,84,0x080c1c,0.88);
    M.A.court.forEach((p,i)=>{
      const y=458+i*11,awL=C.awakeLeft(p);
      v.text(10,y,(awL?'★':'')+p.short,10,C.isAwake(p)?'#ffd76a':'#ccffee');
      v.rect(44,y+1,58,5,0x28406b,1);v.rect(108,y+1,40,5,0x28406b,1);
      v.rect(44,y+1,58*clamp(p.fp/p.maxFP,0,1),5,0x57d95e,1);
      v.rect(108,y+1,40*clamp(p.tp/p.maxTP,0,1),5,0xffd76a,1);
      if(awL)v.text(152,y,'残'+awL,9,'#ffd76a');
    });
    v.text(10,524,'緑:FP 黄:TP'+(M.mini?'':'　タイムアウト残り'+(M.timeouts?M.timeouts.A:0)),10,'#99aabb');
    /* 覚醒中の選手の枠（属性色） */
    for(const t of [M.A,M.H])for(const p of t.court){
      if(C.isAwake(p))v.stroke(p.x-25,p.y-45,50,66,C16(C.ELEM[p.elem].c),2);
    }
    /* アクターパネル（コマンド選択中の選手） */
    if(M.actor&&(C.menu||M.phase==='defendMenu')){
      const p=M.actor,col=C16(C.ELEM[p.elem].c);
      v.rect(6,120,240,170,0x080c1c,0.94);v.stroke(6,120,240,170,col,2);
      v.text(16,TY(146,16),p.name,16,'#ffffff',{bold:true});
      v.text(16,TY(164,12),p.pos+' / '+p.elem+'属性',12,'#99aabb');
      v.text(16,TY(182,12),'FP '+Math.round(p.fp)+'/'+p.maxFP+'　TP '+Math.round(p.tp)+'/'+p.maxTP,12,'#99aabb');
      const lb=['スパイク','ブロック','レシーブ','サーブ','トス','スピード'];
      lb.forEach((s,i)=>{v.text(16+(i%2)*110,TY(204+Math.floor(i/2)*18,12),s+' '+p.st[i],12,'#ccffee');});
      v.text(16,246,wrapJa(p.intro||'',224,'11px sans-serif'),11,'#eef',{ls:4});
    }
    /* 結果パネル（初回説明などで note が長くなっても下端で切れないよう、
       パネルを上下に広げ、note は行数を数えてパネル下端にアンカーする。
       Lvアップ表示は note と重ならない件数までに制限する） */
    if(M.over&&M.result){
      const r=M.result;
      const PB=448; /* パネル下端（メッセージバー 456 の直上） */
      v.rect(230,56,500,PB-56,0x040814,0.88);v.stroke(230,56,500,PB-56,0xffd76a,2);
      v.text(480,TY(118,34),r.win?'勝 利！':'敗 北…',34,'#ffffff',{bold:true,ox:0.5});
      v.text(480,TY(161,20),M.myName+' '+M.scoreA+' ― '+M.scoreH+' '+M.oppName,20,'#ffffff',{ox:0.5});
      v.text(480,TY(200,17),(r.rk||r.yk||r.buhi)?('ねっけつP +'+r.rk+'　ゆうじょうP +'+r.yk+(r.buhi?'　部費 +'+r.buhi+'円':'')):'報酬なし（また挑戦しよう）',17,'#ffd76a',{ox:0.5});
      if(r.expSummary)v.text(480,TY(228,14),r.expSummary,14,'#ccffee',{ox:0.5});
      const note=r.note?r.note:(M.mini?(r.win?'ミニバトル勝利！':'負けてもゲームオーバーにはならない。再戦可能')
        :(r.win?M.oppName+'に勝利！ 次の相手へ向けて特訓しよう':'再挑戦は凪から。作戦ヒントか補助モードが選べる'));
      const noteLines=wrapJa(note,464,'12px sans-serif').split('\n').length;
      const noteTop=PB-8-(noteLines*16-4);
      const maxUps=Math.max(0,Math.min(6,Math.floor((noteTop-262)/22)+1));
      (r.levelUps||[]).slice(0,maxUps).forEach((u,i)=>{
        v.text(480,TY(256+i*22,15),'Lvアップ！ '+u.short+' → Lv'+u.lv+(u.techs.length?'　新技「'+u.techs.join('」「')+'」習得':''),15,'#ffd76a',{ox:0.5});
      });
      v.text(480,noteTop,wrapJa(note,464,'12px sans-serif'),12,'#99aabb',{ox:0.5,ls:4});
    }
    /* レターボックス（必殺技の間）: カットイン中は上下に黒帯がせり出し、
       終わると収まる。帯の内側ではスコア等の文字はそのまま読める */
    if(this.lbProg>0.02){
      const bh=Math.round(46*this.lbProg);
      v.rect(0,0,960,bh,0x000000,0.96);
      v.rect(0,540-bh,960,bh,0x000000,0.96);
    }
    /* カットイン */
    if(M.cutin){
      const c=M.cutin,col=C16(C.ELEM[c.p.elem].c);
      const illu=this.cutinIlluFor(c.p);
      const tx=illu?400:186;
      v.rect(0,0,960,540,0x000000,0.45);
      v.rect(0,210,960,120,col,1);
      /* 突入直後の一瞬だけ白フラッシュ（帯の中だけ。控えめに） */
      const cpr=clamp(1-(c.timer/1.15),0,1);
      if(cpr<0.14)v.rect(0,210,960,120,0xffffff,(0.14-cpr)/0.14*0.32);
      v.rect(0,222,960,10,0xffffff,0.15);v.rect(0,308,960,10,0xffffff,0.15);
      if(!illu){v.rect(26,202,144,136,0x000000,0.35);v.stroke(26,202,144,136,col,2);} /* 顔ドット絵の土台（イラスト時は出さない） */
      v.text(tx,TY(248,15),c.p.name+'（'+c.p.elem+'）',15,'#ffffff',{bold:true});
      /* 技名は残り幅に合わせて自動で縮小する（長い技名でも右端へはみ出さない） */
      const tlen=c.t.name.length+1,tsize=Math.min(38,Math.floor((960-tx-20)/tlen));
      v.text(tx,TY(300,tsize),c.t.name+'！',tsize,'#ffffff',{bold:true});
      v.text(700,TY(248,14),c.t.awake?'全対決値 +10％（3ラリー）':'威力 '+c.t.rank+' ／ TP '+c.t.tp+' 消費',14,'#ffffff');
    }
    /* 会話（試合中に開くことは基本ないが、保険として Core と同じ順序で描く） */
    viewDialog(v);
    /* メニュー（最前面） */
    viewMenu(v);
    v.end();
    /* カットイン演出（イラスト優先＋属性エフェクト。OpView より前面に置く）
       3段フォールバック: 本人イラスト → 属性×性別の汎用イラスト → 顔ドット絵 */
    if(M.cutin){
      const c=M.cutin;
      this.ensureCutin(c.p);
      if(this.cutinFor!==c){
        this.cutinFor=c;
        const illu=this.cutinIlluFor(c.p);
        if(illu){
          this.cutinImg.setTexture(illu.key);
          this.cutinImg.setDisplaySize(illu.w,illu.h);
          this.cutinImg.setPosition(36+illu.w/2,282);
          this.cutinImg.setMask(this.cutinMask);
        }else{
          const fk=makeFaceTexture(this,c.p.hair,C.ELEM[c.p.elem].c,c.p.name||c.p.short);
          this.cutinImg.setTexture(fk);
          this.cutinImg.setDisplaySize(132,132);
          this.cutinImg.setPosition(98,270);
          this.cutinImg.clearMask();
        }
        this.cutinImg.setVisible(true);
        this.cutinFx.setVisible(true);
      }else{
        /* 読み込みがカットイン開始後に完了した場合はイラストへ差し替える */
        const illu=this.cutinIlluFor(c.p);
        if(illu&&this.cutinImg.texture.key!==illu.key){
          this.cutinImg.setTexture(illu.key);
          this.cutinImg.setDisplaySize(illu.w,illu.h);
          this.cutinImg.setPosition(36+illu.w/2,282);
          this.cutinImg.setMask(this.cutinMask);
        }
      }
      /* ゆっくりズーム＋パン: 静止画のカットインに「間」の動きを持たせる。
         イラストはマスク（帯の左 380px）の内側で大きくなるだけなので、
         既存レイアウト（帯マスク＋技名）は崩れない */
      const zpr=clamp(1-(c.timer/1.15),0,1);
      const illuZ=this.cutinIlluFor(c.p);
      if(illuZ){
        const z=1+0.08*zpr;
        this.cutinImg.setDisplaySize(illuZ.w*z,illuZ.h*z);
        this.cutinImg.setPosition(36+illuZ.w/2+zpr*12,282);
      }else{
        const sz=132*(1+0.05*zpr);
        this.cutinImg.setDisplaySize(sz,sz);
      }
      this.drawCutinFx(c.p.elem);
    }else if(this.cutinFor){
      this.cutinFor=null;
      this.cutinImg.setVisible(false);
      this.cutinImg.clearMask();
      this.cutinFx.clear();
      this.cutinFx.setVisible(false);
    }
  }
  /* 属性エフェクト: 炎の揺らぎ／風の流れ／葉の舞い／岩の隆起を Graphics で描く */
  drawCutinFx(elem){
    const fx=this.cutinFx;fx.clear();
    const t=this.time.now/1000;
    const fr=(i,k)=>{const v=Math.sin(i*127.1+k*311.7)*43758.5453;return v-Math.floor(v);};
    const col=C16(Core.ELEM[elem].c);
    if(elem==='火'){
      const cols=[0xff5030,0xff8a3c,0xffd76a];
      for(let i=0;i<16;i++){
        const x=24+fr(i,1)*900,base=332,h=26+fr(i,2)*64+Math.sin(t*9+i*1.7)*6;
        fx.fillStyle(cols[i%3],0.5);
        fx.fillTriangle(x,base,x+13,base,x+6.5,base-h);
      }
      for(let i=0;i<10;i++){
        const x=30+fr(i,3)*900,y=326-((t*70+i*41)%118);
        fx.fillStyle(0xffd76a,0.8);fx.fillRect(x,y,3,3);
      }
    }else if(elem==='風'){
      fx.lineStyle(2,0xbff2ff,0.75);
      for(let i=0;i<12;i++){
        const y=222+fr(i,1)*100,x=((t*300+i*113)%1120)-80;
        fx.beginPath();fx.moveTo(x,y);fx.lineTo(x+30+fr(i,2)*36,y);fx.strokePath();
      }
      fx.lineStyle(2,col,0.5);
      for(let i=0;i<6;i++){
        const y=230+fr(i,4)*88,x=((t*190+i*167)%1060)-50;
        fx.beginPath();fx.moveTo(x,y);fx.lineTo(x+18,y);fx.strokePath();
      }
    }else if(elem==='林'){
      const cols=[0x3fae5a,0x63c474,0x2c7a40];
      for(let i=0;i<14;i++){
        const x=(fr(i,1)*940+t*26*(0.5+fr(i,2)))%980-10;
        const y=216+((fr(i,3)*130+t*34*(0.6+fr(i,4)))%118);
        fx.fillStyle(cols[i%3],0.85);fx.fillEllipse(x,y,10,5);
      }
    }else{ /* 山 */
      const cols=[0xd29a3d,0x8a6a3a,0xb8862f];
      for(let i=0;i<11;i++){
        const x=30+i*84+fr(i,1)*24,base=332,h=16+fr(i,2)*36+Math.sin(t*3+i)*2;
        fx.fillStyle(cols[i%3],0.8);
        fx.fillTriangle(x,base,x+20,base,x+10,base-h);
      }
      for(let i=0;i<8;i++){
        const x=40+fr(i,5)*880,y=300-((t*24+i*29)%70);
        fx.fillStyle(0xe8cf9a,0.6);fx.fillRect(x,y,3,3);
      }
    }
    /* スピード線: 帯を横切る流線で疾走感を足す（白＋属性色、控えめな透明度） */
    fx.lineStyle(2,0xffffff,0.26);
    for(let i=0;i<10;i++){
      const y=216+fr(i,7)*108,x=((t*900+i*197)%1240)-140,len=60+fr(i,8)*90;
      fx.beginPath();fx.moveTo(x,y);fx.lineTo(x+len,y);fx.strokePath();
    }
    fx.lineStyle(1,col,0.35);
    for(let i=0;i<6;i++){
      const y=218+fr(i,9)*104,x=((t*700+i*263)%1200)-120;
      fx.beginPath();fx.moveTo(x,y);fx.lineTo(x+44+fr(i,10)*60,y);fx.strokePath();
    }
  }
}

/* ---------- 起動 ---------- */
window.addEventListener('load',async()=>{
  const msg=document.getElementById('boot-msg');
  try{
    if(!window.Phaser)throw new Error('Phaser（CDN）の読み込みに失敗しました');
    Core=await loadCore();
    msg.style.display='none';
    window.FS_CORE=Core; /* 動作確認用ハンドル */
    window.FS_GAME=new Phaser.Game({
      type:Phaser.AUTO,
      parent:'game',
      width:960,height:540,
      backgroundColor:'#10131f',
      pixelArt:true,
      scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
      scene:[TitleScene,ExploreScene,MatchScene,TouchScene],
    });
  }catch(e){
    msg.textContent='起動エラー：'+e.message+' ― GitHub Pages などの HTTP 環境で、ゲーム本体（core.html または index.html）と同じフォルダに置いて開いてください（file:// では読み込めません）。';
  }
});
</script>
