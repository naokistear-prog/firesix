  if(BEATS[atkElem]===defElem) return 1.10;
  if(BEATS[defElem]===atkElem) return 0.92;

/* ============================================================
   フェーズ5-A: クリア後ルート3本（設計の正: post-clear-routes.md）
   ルート1「真・県大会編 ― 王者再戦ルート」: 本編8校の強化版との再戦（8試合）
   ルート2「ごちゃまぜカップ ― 街の最強決定戦ルート」: モブ選抜6人制（5試合）
   ルート3「県選抜招待ルート ― 夢の先の3連戦」: 県選抜ドリームチーム（3試合）
   解放: ルート1・2はクリア直後（ルート2は探索ミニバトル通算10勝も必要）、
   ルート3はルート1か2の全制覇で招待状が届く（§0.2）。
   進行は G.routes（本編の G.wins / G.stage には触れない）。
   報酬は各ルートの単価表どおり。再戦は ゆうじょうP・ねっけつP 40％／部費 50％／
   経験値 70％ に逓減し、敗北時は経験値のみ勝利時の20％が入る（§0.2）
   ============================================================ */
/* 強化版選手の生成: 基礎データを書き換えず、全能力に boost を加えて（99キャップ）
   追加技を付けた複製を返す。相手専用データなので PLAYER_DB には登録しない */
function boostPlayer(p,boost,extraTechs){
  const st=p.st.map(v=>Math.min(99,v+boost));
  const techs=extraTechs?p.techs.concat(extraTechs):p.techs.slice();
  return P({name:p.name,short:p.short,pos:p.pos,elem:p.elem,hair:p.hair,st,techs,intro:p.intro});
}
function boostedTeam(arr,boost,extraMap){
  return arr.map(p=>boostPlayer(p,boost,extraMap?extraMap[p.name]:null));
}

/* ルート2用: モブの6人制読み替え（§2.0）。チーム共通値を土台に、主力能力はそのまま、
   それ以外をポジション適性で ±5 の範囲で振って全能力を個別値化する。
   boost はステージの能力帯（§2.2）に合わせるためのルート側の底上げ */
const POS_ADJ={OH:[0,2,-1,0,-3,2,0,-2],OP:[0,1,-2,1,-3,0,1,-2],MB:[-2,3,-3,0,-3,-1,2,-2],
  S:[-3,-2,0,0,0,1,0,2],L:[-4,-4,2,-3,1,3,0,0]};
function mob6(name,pos,elem,hair,base,mains,techDefs,boost,intro){
  const st=mobSt(base,mains);
  const mainIdx=new Set(Object.keys(mains).map(k=>STAT_IDX[k]));
  for(let i=0;i<8;i++){
    if(!mainIdx.has(i))st[i]+=POS_ADJ[pos][i];
    st[i]=clamp(st[i]+(boost||0),1,99);
  }
  return P({name,short:name,pos,elem,hair,st,techs:techDefs||[],intro:intro||''});
}

/* ルート戦1試合分の実効定義（相手チーム・報酬・AI）を組み立てる */
function routeMatchDef(routeId,no){
  if(routeId==='r1'){
    const m=MATCHES[no-1],r=ROUTE1[no-1];
    return {routeId,no,label:'王者再戦 第'+no+'戦',name:r.name,schoolId:m.id,
      team:boostedTeam(m.team,r.boost,ROUTE1_EXTRA[m.id]),start:r.start||m.start,ai:r.ai,
      exp:r.exp,yj:r.yj,nk:r.nk,buhi:r.buhi,flavor:r.flavor,debuff:!!r.debuff};
  }
  if(routeId==='r2'){
    const r=ROUTE2[no-1];
    return {routeId,no,label:'ごちゃまぜカップ 第'+no+'戦',name:r.name,
      team:r.build(),start:r.start,ai:r.ai,exp:r.exp,yj:r.yj,nk:r.nk,buhi:r.buhi,flavor:r.flavor};
  }
  const r=ROUTE3[no-1];
  return {routeId,no,label:'県選抜招待 第'+no+'戦',name:r.name,
    team:r.build(),start:r.start,ai:r.ai,exp:r.exp,yj:r.yj,nk:r.nk,buhi:r.buhi,flavor:r.flavor,guide:r.guide||null};
}
/* ---------- ルートの進行管理（G.routes） ---------- */
function routeProg(r){
  if(!G.routes)G.routes={r1:{win:{}},r2:{win:{}},r3:{win:{}}};
  if(!G.routes[r])G.routes[r]={win:{}};
  if(!G.routes[r].win)G.routes[r].win={};
  return G.routes[r];
}
function routeWinCount(r){return Object.keys(routeProg(r).win).length;}
function routeDone(r){const t=(ROUTE_LIST.find(x=>x.id===r)||{}).total||0;return routeWinCount(r)>=t;}
function routeMatchOpen(r,no){return no===1||!!routeProg(r).win[no-1];}
function miniTotalWins(){let s=0;for(const k in (G.miniWinN||{}))s+=G.miniWinN[k]||0;return s;}
function routeUnlocked(r){
  if(!G.cleared)return {ok:false,reason:'県優勝（本編クリア）後に解放される'};
  if(r==='r2'&&miniTotalWins()<10)
    return {ok:false,reason:'探索ミニバトルの通算勝利が10勝で解放される（現在 '+miniTotalWins()+'勝）'};
  if(r==='r3'&&!routeDone('r1')&&!routeDone('r2'))
    return {ok:false,reason:'ルート1かルート2を全制覇すると、県協会から招待状が届く'};
  return {ok:true};
}
let routeResultWin=false; /* ルート戦の勝敗（試合後の会話分岐用） */
/* ルート戦の開始（既存の試合基盤 setupMatch に routeDef を渡して乗せる） */
function beginRouteMatch(routeId,no){
  const prob=teamProblem();
  if(prob){startDialog([{name:'',text:'編成が整っていない：'+prob+'。Lキーで選手ライブラリを開いて編成しよう'}]);return;}
  const def=routeMatchDef(routeId,no);
  setupMatch({myPlayers:teamPlayers(),myStart:[0,1,2,3,4,5],liberoName:G.libero,
    oppPlayers:def.team,oppStart:def.start,myName:'朝凪学園',oppName:def.name,
    routeDef:def,ai:def.ai,routeDebuff:def.debuff&&!routeProg(routeId).win[no]});
  M.onReturn=()=>routeAfterDialog(routeId,no);
}
/* ルート戦後の会話（節目のみ。ルート3最終戦後は送別マッチの会話イベント §3.4） */

  if(!routeResultWin)return;

    G.flags.sendoff=true;saveGame();

function registerGuests(){
  const add=DREAM_TEAM.filter(p=>!G.library.includes(p.name));
  if(!add.length){startDialog([{name:'',text:'夢チーム6人は全員ゲスト登録済みだ'}]);return;}
  if(G.library.length+add.length>LIB_MAX){startDialog([{name:'',text:'ライブラリの上限に達していて登録できない'}]);return;}
  if(!G.guests)G.guests={};
  for(const p of add){G.library.push(p.name);G.guests[p.name]=true;progOf(p.name);}
  saveGame();
  startDialog([
    {name:'',text:'夢チーム6人がゲスト登録された！（セナ／イオリ／ヒビキ／キョウヤ／スズカ／リョウマ）'},
    {name:'',text:'ゲスト選手は合同メンバー扱いで、ミニバトルでのみ起用できる（公式戦・ルート戦のエントリーには入らない）'},
  ]);
}
/* 凪から開くルート選択メニュー */
function openRouteMenu(){
  const items=ROUTE_LIST.map(r=>{
    const un=routeUnlocked(r.id);
    return {label:r.name,
      sub:un.ok?('制覇 '+routeWinCount(r.id)+'/'+r.total+(routeDone(r.id)?' ✓全制覇':'')):'🔒',
      _r:r.id,_locked:!un.ok,_reason:un.reason};
  });
  items.push({label:'やめておく',_back:true});
  dlg={lines:[],i:0,choices:true};
  openMenu(400,110,items,idx=>{
    dlg=null;
    const it=items[idx];
    if(it._back)return;
    if(it._locked){startDialog([{name:'早瀬 凪',text:it._reason}]);return;}
    openRouteMatchMenu(it._r);
  });
}
function openRouteMatchMenu(r){
  const meta=ROUTE_LIST.find(x=>x.id===r);
  const items=[];
  for(let no=1;no<=meta.total;no++){
    const d=routeMatchDef(r,no);
    const won=!!routeProg(r).win[no];
    const open=routeMatchOpen(r,no);
    items.push({label:(won?'✓ ':open?'▶ ':'🔒 ')+d.label+' vs '+d.name,sub:won?'再戦可':(d.guide?'⚠ 十分な育成と装備、合体技の準備を推奨':''),_no:no,disabled:!open});
  }
  if(r==='r2'&&routeDone('r2'))
    items.push({label:'夢チームをゲスト登録する',sub:'制覇報酬',_guest:true,disabled:!canGuestRegister()});
  items.push({label:'ルート選択に戻る',_back:true});
  dlg={lines:[],i:0,choices:true};
  openMenu(400,90,items,idx=>{
    dlg=null;
    const it=items[idx];
    if(it._back){openRouteMenu();return;}
    if(it._guest){registerGuests();return;}
    const d=routeMatchDef(r,it._no);
    startDialog([{name:'早瀬 凪',text:d.flavor+(d.guide?'。'+d.guide:'')+'。始める？'}],()=>{
      dlg={lines:[],i:0,choices:true};
      openMenu(560,330,[
        {label:'試合を始める（'+d.label+'）'},
        {label:'まだ準備中'},
      ],i2=>{dlg=null;if(i2===0)beginRouteMatch(r,it._no);});
    });
  });
}
/* ルート3の招待状イベント（ルート1か2の全制覇で一度だけ、探索中に差し込む §3.2） */
function checkRouteInvite(){
  if(!G.cleared||scene!=='explore')return false;
  if(!G.flags)G.flags={};
  if(G.flags.r3invited)return false;
  if(!routeDone('r1')&&!routeDone('r2'))return false;
  G.flags.r3invited=true;saveGame();
  startDialog([
    {name:'',text:'―― 体育館の掲示板に、県バレーボール協会からの封書が届いていた'},
    {name:'梶原 美緒',text:'（手紙）県優勝、おめでとう。協会主催の選抜招待試合に、朝凪学園を招待します。相手は、県選抜。……ベスト4の先を一緒に見た仲間として、楽しみにしています'},
    {name:'早瀬 凪',text:'県選抜と3連戦だって。ルート3「県選抜招待ルート」が解放されたよ。凪に話しかけて挑もう'},
  ]);
  return true;
}

function schoolUnlocked(sc){
  if(sc.unlock.wins)return G.wins>=sc.unlock.wins;
  if(sc.unlock.clear)return !!G.cleared||G.wins>=8; /* クリア＝県決勝（帝峰戦）勝利。フェーズ4-Aで G.cleared に接続 */
  return true;

function scoutedCountOfSchool(schoolId){
  const sc=SCOUT_SCHOOLS.find(s=>s.id===schoolId);if(!sc)return 0;
  return sc.members.filter(m=>G.scouted&&G.scouted[m.name]).length;
}
/* 条件1件の達成状況 {ok,text} を返す。ctx={name,schoolId,teamId} */
function condCheck(c,ctx){
  /* フェーズ5-A（post-clear-routes §1.5）: ルート1でその学校の強化版を撃破済みなら、
     「ミニバトル勝利」「好感イベント」条件は達成済み扱いに緩和する
     （ゆうじょうP価格と「先行スカウト」条件は不変） */
  if(ctx.schoolId&&(c.t==='miniAny'||c.t==='event')){
    const no={hamakaze:1,isohama:2,shirakaba:3,kashiwa:4,nanryo:5,kokuyokan:6,suiran:7,teiho:8}[ctx.schoolId];
    if(no&&G.routes&&G.routes.r1&&G.routes.r1.win&&G.routes.r1.win[no])
      return {ok:true,text:(c.label||'ミニバトル勝利')+'（王者再戦の撃破で達成扱い）'};
  }
  switch(c.t){
    case 'mini':return {ok:!!G.miniWin[ctx.teamId],text:'ミニバトル勝利'};

    case 'talk':return {ok:(G.talkN&&G.talkN[ctx.name]||0)>=c.n,text:ctx.name+'と会話×'+c.n};
    case 'train':return {ok:(G.trainStatN&&G.trainStatN[c.stat]||0)>=c.n,text:STAT_NAMES[c.stat]+'特訓を'+c.n+'回見せる'};
    case 'pre':return {ok:scoutedCountOfSchool(ctx.schoolId)>=c.n,text:'同校の選手を先に'+c.n+'人スカウト'};
    case 'event':return {ok:!!(G.evtDone&&G.evtDone[ctx.name]),text:c.label||'好感イベント'};
    case 'freewin':return {ok:!!G.freeWinTeiho,text:'フリー対戦で帝峰に勝利'};
    /* v0.12: 街NPC会話（G.talkN は街NPCの表示名でも数える） */
    case 'npc':return {ok:(G.talkN&&G.talkN[c.name]||0)>=(c.n||1),text:c.label||(c.name+'と会話')};
    /* v0.12: 双子の相方条件（scout-mobs.md §2-4 の詰み回避運用:
       相方が未加入の間はどちらからでも加入でき、相方が加入済みなら達成扱い） */
    case 'twin':return {ok:!!(G.scouted&&G.scouted[c.name])||!(G.scouted&&G.scouted[ctx.name]),
      text:'相方（'+c.name+'）とセットで加入'};
    /* v0.12: 指定選手の先行スカウト（双葉夕陽など） */
    case 'preName':return {ok:!!(G.scouted&&G.scouted[c.name]),text:c.name+'を先にスカウト'};
    /* v0.12: ミニバトル通算 n 勝（全チーム合計） */
    case 'miniTotal':return {ok:miniTotalWins()>=(c.n||1),text:'ミニバトル通算'+c.n+'勝'};
    /* v0.12: クリア後ルート2ステージ5「モブオールスターズ」勝利（scout-mobs.md §5） */
    case 'r2win':return {ok:!!(G.routes&&G.routes.r2&&G.routes.r2.win&&G.routes.r2.win[5]),
      text:'ルート2ステージ5「モブオールスターズ」に勝利'};
    /* v0.12: ルート3全制覇（神崎レイの追加条件、characters-national-schools.md） */
    case 'route3':return {ok:routeDone('r3'),text:'ルート3「県選抜招待」を全制覇'};
  }
  return {ok:true,text:''};
}
/* スカウト候補一覧を組み立てる（ライブラリ画面の候補タブ用）。
   戻り値: [{name,cost,from,locked,owned,conds:[{ok,text,def}],canScout}] */
function buildCandidates(){
  const out=[];
  for(const sc of SCOUT_SCHOOLS){
    const locked=!schoolUnlocked(sc);
    for(const m of sc.members){
      const owned=G.library.includes(m.name);
      const conds=m.cond.map(c=>Object.assign(condCheck(c,{name:m.name,schoolId:sc.id}),{def:c}));
      out.push({name:m.name,cost:m.cost,from:sc.name,locked,owned,conds,
        canScout:!locked&&!owned&&conds.every(c=>c.ok)});
    }
  }
  for(const t of Object.values(MOB_TEAMS)){
    const defs=SCOUT_MOBS[t.id]||{};
    for(const mem of t.members){
      const d=defs[mem.name];if(!d)continue;
      /* 夢チーム6人はゲスト登録済みでも「正規スカウトで昇格」できる
         （scout-mobs.md §5.2）。ゲストの間は owned 扱いにしない */
      const guest=!!(G.guests&&G.guests[mem.name]);
      const owned=G.library.includes(mem.name)&&!guest;
      const all=[{t:'mini'}].concat(d.cond);
      const conds=all.map(c=>Object.assign(condCheck(c,{name:mem.name,teamId:t.id}),{def:c}));
      out.push({name:mem.name,cost:d.cost,from:t.name,locked:false,owned,guest,conds,
        canScout:!owned&&conds.every(c=>c.ok)});
    }
  }
  /* 無所属（v0.12）: 解放条件はなく、条件と価格のみで候補に出る */
  for(const f of SCOUT_FREE){
    const owned=G.library.includes(f.name);
    const conds=f.cond.map(c=>Object.assign(condCheck(c,{name:f.name}),{def:c}));
    out.push({name:f.name,cost:f.cost,from:'無所属',locked:false,owned,junior:!!f.junior,conds,
      canScout:!owned&&conds.every(c=>c.ok)});
  }
  return out;
}
/* スカウト実行（ゆうじょうPを払ってライブラリへ）。成否とメッセージを返す */
function doScout(cand){
  if(cand.owned)return {ok:false,msg:'すでに仲間になっている'};
  if(cand.locked)return {ok:false,msg:'まだ解放されていない'};
  /* ゲスト登録済みの夢チーム選手は、正規スカウトで正規メンバーへ昇格する
     （scout-mobs.md §5.2。ライブラリには既にいるので重複追加しない） */
  if(cand.guest){
    if(G.yuujou<cand.cost)return {ok:false,msg:'ゆうじょうPが足りない（必要 '+cand.cost+'P／所持 '+G.yuujou+'P）'};
    G.yuujou-=cand.cost;
    delete G.guests[cand.name];
    if(!G.scouted)G.scouted={};
    G.scouted[cand.name]=true;
    saveGame();
    return {ok:true,msg:cand.name+' がゲストから正規メンバーに昇格した！（ゆうじょうP -'+cand.cost+'）'};
  }
  if(G.library.length>=LIB_MAX)return {ok:false,msg:'ライブラリが上限（'+LIB_MAX+'人）に達している'};
  if(G.yuujou<cand.cost)return {ok:false,msg:'ゆうじょうPが足りない（必要 '+cand.cost+'P／所持 '+G.yuujou+'P）'};
  G.yuujou-=cand.cost;
  G.library.push(cand.name);
  if(!G.scouted)G.scouted={};
  G.scouted[cand.name]=true;
  /* 中学生の有望株は「入学後の扱い」（characters-free-agents-v2.md §5）:
     仮登録の間はエントリーできず、クリア後に入学して解禁になる */
  if(cand.junior){if(!G.junior)G.junior={};G.junior[cand.name]=true;}
  progOf(cand.name);
  if(G.entry.length<ENTRY_MAX)G.entry.push(cand.name); /* 空きがあればエントリーにも自動で入れる */
  if(MILESTONES.some(m=>G.library.length>=m.n&&!(G.msGiven&&G.msGiven[m.n])))pendingMilestone=true;
  saveGame();
  return {ok:true,msg:cand.name+' が仲間になった！（ゆうじょうP -'+cand.cost+'）'};
}
/* ライブラリ内の役割（3層構造）: 'start'=スタメン / 'libero'=リベロ / 'bench'=エントリー控え / 'none'=未エントリー */
function roleOf(name){
  if(G.starters&&G.starters.includes(name))return 'start';
  if(G.libero===name)return 'libero';
  if(G.entry&&G.entry.includes(name))return 'bench';
  return 'none';
}
const ROLE_LABEL={start:'スタメン',libero:'リベロ',bench:'控え',none:'未登録'};
/* 役割を1段階進める（未登録→控え→スタメン→リベロ→未登録）。失敗時は理由文字列を返す */
function cycleRole(name){
  /* フェーズ5-A: ゲスト選手（夢チーム）はミニバトル専用。エントリー登録はできない（§2.3） */
  if(G.guests&&G.guests[name])return 'ゲスト選手はエントリー登録できない（ミニバトル専用）';
  /* v0.12: 中学生の有望株は入学後（クリア後）にエントリー解禁（ミニバトルは起用可） */
  if(G.junior&&G.junior[name]&&!G.cleared)return '中学生の有望株は入学後（クリア後）にエントリーできる';
  const r=roleOf(name);
  if(r==='none'){
    if(G.entry.length>=ENTRY_MAX)return 'エントリーは'+ENTRY_MAX+'人までです';
    G.entry.push(name);
  }else if(r==='bench'){
    if(G.starters.length>=6)return 'スタメンは6人までです';
    G.starters.push(name);
  }else if(r==='start'){
    if(G.libero&&G.libero!==name)return 'リベロは1人だけです（先に '+G.libero+' を外してください）';
    G.starters.splice(G.starters.indexOf(name),1);
    G.libero=name;
  }else{ /* libero → 未登録（エントリーからも外れる） */
    G.libero=null;
    G.entry.splice(G.entry.indexOf(name),1);
  }
  saveGame();
  return null;
}
/* 公式戦の出場メンバー（スタメン→リベロ→控えの順に並べた実効データ） */
function teamPlayers(){
  const order=[];
  for(const n of (G.starters||[]))order.push(n);
  if(G.libero)order.push(G.libero);
  for(const n of (G.entry||[]))if(!order.includes(n))order.push(n);
  return order.map(n=>effPlayer(baseOf(n)));
}
/* 公式戦を開始できる編成か（スタメン6＋リベロ1が全員エントリー内） */
function teamProblem(){
  if(!G.starters||G.starters.length!==6)return 'スタメンが6人そろっていない（ライブラリで編成しよう）';
  if(!G.libero)return 'リベロが決まっていない（ライブラリで編成しよう）';
  for(const n of G.starters)if(!G.entry.includes(n))return 'スタメンがエントリーに入っていない';
  if(!G.entry.includes(G.libero))return 'リベロがエントリーに入っていない';
  return null;
}
function libPlayers(){return G.library.map(baseOf).filter(Boolean);}

   視聴要件が免除されている状態。烈の合体技（retsu）はルート1全制覇が前提 */
function comboState(c){
  if(!G.combo)G.combo={};
  if(!G.comboEv)G.comboEv={};
  const learned=!!G.combo[c.name];
  const members=comboMembers(c);
  const owned=members.every(n=>G.library&&G.library.includes(n));
  const lvOk=members.every(n=>progOf(n).lv>=c.lv);
  const eventSeen=!!G.comboEv[c.name];
  const eventWaived=!!(G.flags&&G.flags.comboFrame);
  const retsuOk=!c.retsu||routeDone('r1');
  const cost=COMBO_COST[c.rank];
  const canEvent=owned&&retsuOk&&!eventSeen&&!eventWaived;
  const canLearn=!learned&&owned&&lvOk&&retsuOk&&(eventSeen||eventWaived);

    afford:G.yuujou>=cost};

  if(!st.retsuOk)return {ok:false,msg:'条件未達：ルート1全制覇で解放される合同練習が必要'};
  if(!st.lvOk)return {ok:false,msg:'条件未達：ペア全員 Lv'+c.lv+' 以上が必要'};
  if(!st.eventSeen&&!st.eventWaived)return {ok:false,msg:'条件未達：先にミニイベントを見よう'};
  if(!st.afford)return {ok:false,msg:'ゆうじょうPが足りない（必要 '+st.cost+'P／所持 '+G.yuujou+'P）'};

/* レベルアップ成長のポジション別配分（§3.2、1レベルで合計+4。運はレベルでは上がらない）

/* 装備を購入して即装備する。買い替え時は旧装備を購入価格の50％で下取り（§8.1 売却）。

function buyEquip(name,item){

/* 実効能力値 = 基礎 + レベル成長 + 特訓 + 装備（合計99キャップ、§0）。
   成長は小数配分（+1.2/Lv 等）のため切捨てて返す（§3.2：内部小数・表示切捨て） */
/* 成長タイプ（system-design.md §3.2、v1.1で実装）: 名前のハッシュで決定的に
   早熟／普通／晩成 を割り当てる（セーブへの保存は不要）。
   係数はレベル帯ごと: 早熟＝Lv2-10 ×1.4／Lv11-20 ×1.0／Lv21-30 ×0.5、
   晩成＝Lv2-10 ×0.6／Lv11-20 ×1.0／Lv21-30 ×1.5、普通は全帯 ×1.0。
   成長量は「到達レベルまでの係数の累積 × ポジション別配分」で、普通タイプは

function growthTypeOf(name){let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return ['早熟','普通','晩成'][h%3];}
function growthFactor(type,lv){if(type==='早熟')return lv<=10?1.4:lv<=20?1.0:0.5;if(type==='晩成')return lv<=10?0.6:lv<=20?1.0:1.5;return 1.0;}

/* 伝統技（unlock=-1）の解放判定（フェーズ4-B）。

  const lv=progOf(base.name).lv;

/* 育成を反映した実効選手データ（試合・表示用）。基礎データ自体は書き換えない */
function effPlayer(base){

  o.maxFP=Math.round(40+st[6]*0.4)+equipFPBonus(base.name); /* §2.1 FP最大値 = 40＋スタミナ×0.4（2026-11-27 改定）＋ユニフォーム装備分（§8.2） */
  o.maxTP=30+pr.lv*2+Math.floor((st[7]-50)*0.2); /* §2.1 TP最大値 = 30＋Lv×2＋（運−50）×0.2（2026-11-27 改定） */
  o.techs=learnedTechs(base).map(t=>({name:t.name,cat:t.cat,rank:t.rank,pow:t.pow,tp:t.tp}));
  /* 合体技（v0.13）: 習得済みのものを発動者の技リストへ別枠で足す。

  if(G.combo)for(const c of COMBO_TECHS){

/* 経験値を加算し、レベルアップ一覧 [{name,lv,techs:[新規習得技]}] を返す */
function gainExp(name,amount){

  if(amount>0)pr.exp+=amount;

    pr.exp-=expNeed(pr.lv);pr.lv++;

    ups.push({name,lv:pr.lv,techs:nt});

  return ups;

/* ---------- 特訓（§6） ----------
   上級スポットの数値は §6 に段階別規定が無いため、maps.md の相対定義
   （上級＝高コスト・大上昇）に基づく採用値：上昇量 +3／コスト ×2 とする */
function trainCost(base,spot){
  const si=spot.stat;
  let cost=10+Math.floor(effSt(base,si)/10)*5; /* §4.2 */
  if(spot.tier==='adv')cost*=2;
  const rep=((progOf(base.name).chapStat[si]||{}).s||0);
  if(rep===1)cost=Math.ceil(cost*1.5);else if(rep>=2)cost=Math.ceil(cost*2.0); /* §6 コスト逓増 */
  /* フェーズ5-A: 上級特訓（ルート1全制覇で解放。通常キャップ +12 を超えた分はコスト1.5倍） */
  if(G.flags&&G.flags.advTrain&&((progOf(base.name).train[si]||0)>=12))cost=Math.ceil(cost*1.5);

function trainCheck(base,spot){
  const si=spot.stat,pr=progOf(base.name);

  const trainCap=(G.flags&&G.flags.advTrain)?30:12; /* フェーズ5-A: 上級特訓の解放で累計上限が +30 に拡張 */
  if(pr.train[si]>=trainCap)return {ok:false,reason:'特訓の累計上限（+'+trainCap+'）に達している'};
  if(effSt(base,si)>=99)return {ok:false,reason:'能力が上限（99）に達している'};
  const cs=pr.chapStat[si]||{s:0,g:0};
  if(cs.g+gain>4)return {ok:false,reason:'この章ではもう伸ばせない（章キャップ +4）'};
  if(pr.chapSess>=3)return {ok:false,reason:'この章の特訓回数の上限（1人3回）だ'};

  if(G.trainTeam.n>=10)return {ok:false,reason:'チーム全体の今章の特訓上限（10回）だ'};
  const cost=trainCost(base,spot);

function doTrain(base,spot){

  pr.chapStat[si].s++;pr.chapStat[si].g+=chk.gain;

/* 旧形式セーブ（育成データなし）を読み込んだ際に、不足フィールドを初期値で補完する */
function ensureSave(){
  if(G.story===undefined)G.story=false; /* 物語モードは新規開始のセーブだけが true。旧セーブは常に false */
  if(!G.prog)G.prog={};
  if(G.tutDone===undefined)G.tutDone=G.wins>0; /* 旧セーブで初試合済みならチュートリアル済み扱い */
  if(!G.trainTeam)G.trainTeam={chap:G.wins,n:0};
  /* フェーズ4-A: 本編進行フラグ。stage=次の公式戦の試合番号（1〜8、9=全試合終了）。
     章イベント（フェーズ4-B）は G.flags に差し込めるようにしておく。
     旧セーブでは公式戦の勝利数から復元する（wins は公式戦勝利のみを数える） */
  if(G.buhi===undefined)G.buhi=0;
  /* stage は公式戦勝利数と常に対応する（stage = min(9, wins+1)）。初期値つきの素の G に
     旧セーブをマージした場合でも、勝利数より前の stage には戻らないよう下限を合わせる */
  if(G.stage===undefined||G.stage<Math.min(9,(G.wins||0)+1))G.stage=Math.min(9,(G.wins||0)+1);
  if(G.cleared===undefined)G.cleared=false;
  if((G.wins||0)>=8||G.stage>8)G.cleared=true;
  if(G.practice===undefined)G.practice=false;
  if(!G.flags)G.flags={};
  /* フェーズ3-B: ライブラリ／エントリー／スタメン／リベロと、スカウト進捗。
     フェーズ3-A形式の旧セーブでは、朝凪12人の初期ライブラリで補完する。
     フェーズ4-B: 物語モード（G.story=true、新規開始のセーブ）では序章の開始状態として
     部員3人（陽翔・凪・健吾）だけを初期ライブラリにする。加入イベントで増えていく */
  const INITIAL_LIBRARY=ASANAGI.concat(ASANAGI_EXTRA).map(p=>p.name);
  const START_LIBRARY=['高嶺 陽翔','早瀬 凪','石動 健吾']; /* 序章の開始メンバー（prologue.txt） */
  if(!Array.isArray(G.library)||!G.library.length)G.library=(G.story?START_LIBRARY:INITIAL_LIBRARY).slice();
  if(!Array.isArray(G.entry)||!G.entry.length)G.entry=G.library.slice(0,ENTRY_MAX);
  if(!G.story){
    if(!Array.isArray(G.starters)||G.starters.length!==6||G.starters.some(n=>!PLAYER_DB[n]))
      G.starters=['若林 湊','高嶺 陽翔','大磯 紗良','石動 健吾','早瀬 凪','赤城 剛太'];
    if(G.libero===undefined)G.libero='速川 蓮';
  }else{
    /* 物語モード: 編成は加入状況に連動する。未知の名前だけを除き、長さは問わない。
       コア8人が揃うまではスタメン未確定（試合開始は teamProblem で止まる） */
    if(!Array.isArray(G.starters)||G.starters.some(n=>!PLAYER_DB[n]))G.starters=[];
    if(G.libero===undefined||(G.libero&&!G.library.includes(G.libero)))G.libero=null;
  }
  if(!G.scouted)G.scouted={};
  if(!G.talkN)G.talkN={};
  if(!G.miniWinN)G.miniWinN={};
  if(!G.trainStatN)G.trainStatN=[0,0,0,0,0,0,0,0];
  if(!G.evtDone)G.evtDone={};
  /* v0.7: 敗北報酬の「初回のみ」管理（§3.3）と、ミニバトルの章ごと獲得上限の累計（§7.3）。
     miniChap は章（公式戦勝利数）が変わったら使う側でリセットする */
  if(!G.lossGiven)G.lossGiven={};
  if(!G.miniChap)G.miniChap={chap:G.wins||0,nk:0,yj:0};
  /* フェーズ5-A: クリア後ルートの進行（G.routes.r1/r2/r3 の win は試合番号→勝利済み）と、
     夢チームのゲスト登録（G.guests は名前→true。ゲストはミニバトル専用でエントリー不可） */
  if(!G.routes)G.routes={r1:{win:{}},r2:{win:{}},r3:{win:{}}};
  for(const k of ['r1','r2','r3']){if(!G.routes[k])G.routes[k]={win:{}};if(!G.routes[k].win)G.routes[k].win={};}
  if(!G.guests)G.guests={};
  if(!G.combo)G.combo={}; /* v0.13: 合体技の習得状態（技名→true） */
  if(!G.comboEv)G.comboEv={}; /* v0.13: 合体技のミニイベント視聴状態（技名→true） */
  if(!G.junior)G.junior={}; /* v0.12: 中学生の有望株の仮登録（入学＝クリア後に解禁） */
  if(!G.equip)G.equip={}; /* v0.10: 装備の所持・装備状態（§8.2） */
  if(!G.career)G.career={}; /* v1.1: 選手の通算成績（名前→{matches,pts,spike,block,ace,dig,wins}） */
  if(!G.titles)G.titles=[]; /* v1.1: 名鑑コレクションの節目で得た称号 */
  if(!G.msGiven)G.msGiven={}; /* v1.1: 節目ボーナスの付与済み記録（人数→true） */
  for(const p of ASANAGI)progOf(p.name);
  for(const n of G.library)progOf(n);
}

let menu=null; // {x,y,w,items:[{label,sub,disabled}],sel,onPick}
function openMenu(x,y,items,onPick){menu={x,y,w:300,items,sel:0,onPick};
  /* v1.1: 会話の選択肢メニューは、会話送りのZ連打で先頭項目が誤爆しないよう
     開いてから約9フレームはキー確定を受け付けない（カーソル移動とクリックは可） */
  if(typeof dlg!=='undefined'&&dlg&&dlg.choices)menu.grace=9;}
function menuUpdate(){
  if(!menu)return;
  /* v1.1: _cancel 項目を持つメニューは X でもキャンセルできる */
  if(hit('x','X')){
    const ci=menu.items.findIndex(it=>it._cancel);
    if(ci>=0){const cb=menu.onPick;menu=null;cb(ci);return;}
  }
  if(hit('ArrowUp','w','W'))menu.sel=(menu.sel+menu.items.length-1)%menu.items.length;
  if(hit('ArrowDown','s','S'))menu.sel=(menu.sel+1)%menu.items.length;
  if(mouseClick){
    for(let i=0;i<menu.items.length;i++){
      const iy=menu.y+i*34;
      if(mouseClick.x>=menu.x&&mouseClick.x<=menu.x+menu.w&&mouseClick.y>=iy&&mouseClick.y<iy+34){
        if(!menu.items[i].disabled){const cb=menu.onPick,idx=i;menu=null;cb(idx);} mouseClick=null;return;
      }
    }
    mouseClick=null;
  }
  /* v1.1: 入力猶予中はキー確定だけを飲み込む（クリック確定は通常通り） */
  if(menu.grace>0){menu.grace--;hit('z','Z','Enter',' ');return;}
  if(hit('z','Z','Enter',' ')){
    if(!menu.items[menu.sel].disabled){const cb=menu.onPick,idx=menu.sel;menu=null;cb(idx);}
  }
}
function drawMenu(){
  if(!menu)return;
  const h=menu.items.length*34+10;
  ctx.fillStyle='rgba(10,16,34,.92)';ctx.strokeStyle='#8fb7ff';ctx.lineWidth=2;
  ctx.fillRect(menu.x,menu.y,menu.w,h);ctx.strokeRect(menu.x,menu.y,menu.w,h);
  ctx.textBaseline='middle';
  menu.items.forEach((it,i)=>{
    const iy=menu.y+5+i*34;
    if(i===menu.sel){ctx.fillStyle='#33507e';ctx.fillRect(menu.x+4,iy,menu.w-8,30);}
    const label=(i===menu.sel?'▶ ':'　')+it.label;
    let subW=0;
    if(it.sub){ctx.font='12px sans-serif';subW=ctx.measureText(it.sub).width;}
    /* v1.1: ラベルが sub（TPコスト等）に重ならないよう、残り幅に合わせて
       フォントを段階縮小し、それでも収まらなければ末尾を省略する */
    let fs=17;ctx.font=fs+'px sans-serif';
    const avail=menu.w-20-(subW?subW+8:0);
    while(fs>11&&ctx.measureText(label).width>avail){fs-=2;ctx.font=fs+'px sans-serif';}
    let txt=label;
    if(ctx.measureText(txt).width>avail){while(txt.length>1&&ctx.measureText(txt+'…').width>avail)txt=txt.slice(0,-1);txt+='…';}
    ctx.fillStyle=it.disabled?'#667':'#fff';
    ctx.fillText(txt,menu.x+10,iy+15);
    if(it.sub){ctx.fillStyle='#9ab';ctx.font='12px sans-serif';ctx.fillText(it.sub,menu.x+menu.w-subW-10,iy+15);}
  });
  ctx.textBaseline='alphabetic';
}

  let line='',yy=y;

  ctx.fillText(line,x,yy);
}

/* ============================================================
   フェーズ4-B: 加入イベント＋章イベント
   台本の正: story/ 配下の章別テキスト（prologue.txt〜epilogue.txt）。
   台詞は台本の要点を保ち、会話ウィンドウに収まる長さに抜粋した。
   決め台詞は voice-bible.md の運用ルール（1シーンに1人1回まで／決勝専用の
   台詞は最終章まで温存）に従い、このセクションでは決勝専用台詞を使わない。
   既読管理はすべて G.flags（'ev_'+イベントid／'joined_'+名前／'tradition'）。
   物語モード（G.story）のセーブでのみ発火する。旧セーブは対象外
   ============================================================ */
const CORE8=ASANAGI.map(p=>p.name);
function coreCount(){return CORE8.filter(n=>G.library&&G.library.includes(n)).length;}
/* 第1章で次に加入するコアメンバー（加入順は chapter1.txt の流れで固定） */
function joinStep(){
  if(!G.library.includes('赤城 剛太'))return 'gota';
  if(!G.library.includes('若林 湊'))return 'minato';
  if(!G.library.includes('大磯 紗良'))return 'sara';
  if(!G.library.includes('速川 蓮'))return 'ren';
  if(!G.library.includes('日向 美月'))return 'mizuki';
  return null;
}
/* 重要NPCマーカー（Phaser版の頭上「！」表示）の判定。
   「今そのNPCに話しかけると物語イベントが起きる」NPCの id 一覧を返す:
   序章が未了なら凪（序章の入口）、物語モードでは現在の加入イベント対象
   （joinStep。剛太／湊／紗良／蓮／美月）、コア8人が揃った後は公式戦・
   練習試合・クリア後ルートの入口である凪。章イベントは探索中に自動で
   差し込まれるためNPCには紐付けない。表示専用の判定で、進行には影響しない */
function eventNpcIds(){
  const ids=[];
  if(!G.introDone){ids.push('nagi');return ids;}
  if(G.story){
    const step=joinStep();
    if(step)ids.push(step);
    else ids.push('nagi');
  }
  return ids;
}
/* 選手をライブラリ（と、空きがあればエントリー）へ追加する。スカウトとは別経路の物語加入 */
function addMember(name){
  if(!G.library.includes(name)){G.library.push(name);progOf(name);}
  if(G.entry.length<ENTRY_MAX&&!G.entry.includes(name))G.entry.push(name);
  if(MILESTONES.some(m=>G.library.length>=m.n&&!(G.msGiven&&G.msGiven[m.n])))pendingMilestone=true;
  saveGame();
}
/* 名鑑コレクションの節目（v1.1）: 所持人数が節目に届いたら称号と
   ゆうじょうPボーナスを付与し、会話で通知する。通知は加入会話と重ならない
   よう、exploreUpdate が空いたタイミングで pendingMilestone 経由で呼ぶ */
const MILESTONES=[{n:50,title:'街の顔',yj:50},{n:100,title:'名スカウト',yj:100},{n:150,title:'人脈の達人',yj:150},{n:200,title:'伝説の伯楽',yj:200},{n:250,title:'完全名鑑',yj:300}];
function checkMilestones(){
  if(!G.msGiven)G.msGiven={};if(!G.titles)G.titles=[];
  const lines=[];
  for(const m of MILESTONES){
    if(G.library.length>=m.n&&!G.msGiven[m.n]){
      G.msGiven[m.n]=true;G.titles.push(m.title);G.yuujou+=m.yj;
      lines.push({name:'',text:'選手名鑑が '+m.n+' 人に到達！　称号「'+m.title+'」を獲得し、ゆうじょうP +'+m.yj+' を得た！'});
    }
  }
  if(lines.length){saveGame();startDialog(lines);}
}
/* 加入シーンの再生（末尾に加入通知を付け、終わったらライブラリへ追加する） */
const JOIN_GUARD={'赤城 剛太':'gota','若林 湊':'minato','大磯 紗良':'sara','速川 蓮':'ren','日向 美月':'mizuki'};
function joinScene(name,lines,after){
  if(JOIN_GUARD[name])pendingGuardId=JOIN_GUARD[name];
  startDialog(lines.concat([{name:'',text:'―― '+name+' が仲間になった！（選手ライブラリに追加）'}]),
    ()=>{addMember(name);if(after)after();});
}

/* 加入イベント対象NPCへの話しかけ振り分け。処理したら true を返す。
   物語モード以外・序章未了・加入済みの場合は false（通常会話にフォールバック） */
function storyNpcEvent(id){
  if(!G.story||!G.introDone)return false;
  const step=joinStep();
  switch(id){
    case 'gota':
      if(G.library.includes('赤城 剛太')||(G.miniWin&&G.miniWin['gota']))return false;
      gotaEvent();return true;
    case 'minato':
      if(G.library.includes('若林 湊'))return false;
      if(step==='minato'){minatoEvent();return true;}
      pendingGuardId='minato';startDialog([{name:'',text:'（壁に向かって、一人でトスを繰り返している。何本上げても、軌道がぶれない）'}]);return true;
    case 'sara':
      if(G.library.includes('大磯 紗良'))return false;
      if(step==='sara'){saraEvent();return true;}
      pendingGuardId='sara';startDialog([{name:'',text:'（大磯紗良。帰宅部だが、体育の授業では妙に目立つ選手だ）'}]);return true;
    case 'ren':
      if(G.library.includes('速川 蓮'))return false;
      if(step==='ren'){renEvent();return true;}
      pendingGuardId='ren';startDialog([{name:'速川 蓮',text:'凪先輩のレシーブ練習、今日も付き合うんです！　……あ、部員じゃないけど、混ざってます！'}]);return true;
    case 'mizuki':
      if(G.library.includes('日向 美月'))return false;
      if(step==='mizuki'){mizukiEvent();return true;}
      pendingGuardId='mizuki';startDialog([{name:'日向 美月',text:'サーブ対決の的当て、練習中です！　……バレー部の勧誘ですか？'}]);return true;
  }
  return false;
}

/* 章イベントの発火チェック（探索中、他のUIが開いていないときに最古の未読を1つ再生）。
   再生したら true。既読は G.flags['ev_'+id] で管理し、二度と再生しない。
   ただし加入系イベントは done（加入済みか）も見る：会話の途中で閉じて加入が
   完了していない場合は、既読でも再演して取りこぼしを防ぐ */
function maybeChapterEvent(){
  if(!G.story||!G.introDone||scene!=='explore')return false;
  if(!G.flags)G.flags={};
  for(const ev of CHAPTER_EVENTS){
    if(G.flags['ev_'+ev.id]&&(!ev.done||ev.done()))continue;
    if(!ev.when())continue;
    G.flags['ev_'+ev.id]=true;saveGame();
    ev.play();
    return true;
  }
  return false;
}

function spotEncounter(spot){
  if(spot.id==='SHOP'){openShop();return;} /* v0.10: サクマスポーツ（装備ショップ） */

    /* 整体院＝TP回復拠点（maps-evaluation 必須修正対応）。
       探索中のTPは §2.4 で常時フル状態として扱うため、このスポットがその回復拠点として機能する */

/* 特訓できない理由の短縮表示（v1.1）。理由と必要コストを sub に出す */
function trainNgShort(reason,cost){
  if(reason.indexOf('累計上限')>=0)return '累計上限（必要'+cost+'P）';
  if(reason.indexOf('上限（99）')>=0)return '能力上限99';
  if(reason.indexOf('章ではもう伸ばせない')>=0)return '今章は上限（必要'+cost+'P）';
  if(reason.indexOf('特訓回数の上限')>=0)return '今章の回数上限';
  if(reason.indexOf('チーム全体')>=0)return 'チーム全体の上限';
  if(reason.indexOf('足りない')>=0)return 'P不足（必要'+cost+'P）';
  return reason;
}
function openTrainPlayers(spot){
  const items=libPlayers().map(p=>{
    const chk=trainCheck(p,spot);
    return {label:p.short+'（'+STAT_NAMES[spot.stat]+' '+effSt(p,spot.stat)+'）',
      sub:chk.ok?('ねっけつP '+chk.cost):trainNgShort(chk.reason,trainCost(p,spot)),disabled:!chk.ok,_p:p};
  });
  items.push({label:'やめる',_cancel:true});
  dlg={lines:[],i:0,choices:true};
  openMenu(480,110,items,idx=>{
    dlg=null;const it=items[idx];if(!it||it._cancel)return;
    const base=it._p,chk=trainCheck(base,spot);
    if(!chk.ok){startDialog([{name:'',text:chk.reason}]);return;}
    dlg={lines:[],i:0,choices:true};
    openMenu(440,300,[
      {label:base.short+'の'+STAT_NAMES[spot.stat]+'を特訓（ねっけつP '+chk.cost+'）'},
      {label:'やめる',_cancel:true},
    ],j=>{
      dlg=null;if(j!==0)return;
      const r=doTrain(base,spot);
      if(!r.ok){startDialog([{name:'',text:r.reason}]);return;}
      const lines=[{name:'',text:base.short+'の'+STAT_NAMES[spot.stat]+'が +'+r.gain+' 上がった！（現在 '+effSt(base,spot.stat)+'）　ねっけつP -'+r.cost}];
      if(r.bonus)lines.push({name:'',text:'練習の合間、仲間と声を掛け合った。ゆうじょうP +3'});
      startDialog(lines);
    });
  });
}

   装備の購入・装備はここで行う。買った装備は選んだ選手に即装備され、
   買い替え時は旧装備が購入価格の50％で下取りされる（buyEquip）。
   消耗品（§8.3）は、スポーツドリンクと差し入れがタイムアウト中の

function shopMenu(items,onPick){dlg={lines:[],i:0,choices:true};openMenu(480,110,items,onPick);}
function equipSlotShort(name,slot){
  const e=equipOf(name);
  if(slot==='shoes')return e.shoes<0?'なし':EQUIP_TIERS[e.shoes];
  if(slot==='uniform')return e.uniform<0?'なし':EQUIP_TIERS[e.uniform];
  if(!e.sup)return 'なし';
  const part=EQ_SUP_PARTS.find(p=>p.stat===e.sup.part);
  return (part?part.name:'?')+'・'+EQUIP_TIERS[e.sup.tier];
}

function shopPartMenu(){

function shopTierMenu(slot,part){
  const table=slot==='shoes'?EQ_SHOES:slot==='uniform'?EQ_UNIFORM:EQ_SUP;
  const baseLabel=slot==='shoes'?'シューズ':slot==='uniform'?'ユニフォーム':'サポーター';
  const items=table.map((d,tier)=>{
    let eff;
    if(slot==='shoes')eff='速+'+d.sp+' 攻+'+d.sk;
    else if(slot==='uniform')eff='FP+'+d.fp+' レ+'+d.rc;
    else eff=STAT_NAMES[part]+'+'+d.v;
    return {label:baseLabel+'（'+EQUIP_TIERS[tier]+'）',sub:eff+'／'+d.price+'円',disabled:(G.buhi||0)<d.price,
      _item:{slot,tier,part,price:d.price,label:baseLabel+'（'+EQUIP_TIERS[tier]+'）'}};
  });
  items.push({label:'やめる',_cancel:true});
  shopMenu(items,idx=>{const it=items[idx];if(!it||it._cancel){dlg=null;return;}shopPlayerMenu(it._item);});
}
function shopPlayerMenu(item){

/* 目標HUDの文言（本編の進行フラグ G.stage / G.practice / G.cleared から出す） */
function goalText(){
  if(!G.introDone)return '部員を集めよう ― 凪に話しかけよう';
  if(G.story&&coreCount()<8){
    const hint={gota:'赤城 剛太を誘おう（体育館）',minato:'若林 湊を誘おう（公園・壁トスの壁の近く）',sara:'大磯 紗良を誘おう（体育館）',ren:'速川 蓮を誘おう（体育館）',mizuki:'日向 美月を誘おう（体育館）'}[joinStep()];
    return '次の目標：部員集め（コア '+coreCount()+'/8人）― '+hint;
  }
  if(G.cleared){
    if(routeUnlocked('r3').ok&&!routeDone('r3'))return '県優勝達成！ 県選抜への招待状が届いている ― 凪に話しかけて対戦ルートへ';
    return '県優勝達成！ 凪に話しかけると対戦ルート（クリア後）に挑める';
  }
  if(G.stage===4&&!G.practice)return '次の目標：柏葉との練習試合（イベント戦） ― 凪に話しかけて試合開始';
  const def=currentMatchDef();
  if(def)return '次の目標：'+def.label+' vs '+def.name+' ― 凪に話しかけて試合開始';

let profileOpen=false,profileSel=0;
function exploreUpdate(dt){
  if(form){formUpdate();mouseClick=null;return;}
  if(lib){libUpdate();mouseClick=null;return;}
  if(profileOpen){
    const pn=Math.max(1,libPlayers().length);
    if(profileSel>=pn)profileSel=0;
    if(hit('ArrowUp','w','W'))profileSel=(profileSel+pn-1)%pn;
    if(hit('ArrowDown','s','S'))profileSel=(profileSel+1)%pn;
    if(hit('x','X','Escape'))profileOpen=false;
    mouseClick=null;return;
  }
  if(dlg){dialogUpdate();return;}
  if(menu){menuUpdate();return;}
  /* v1.1: 名鑑の節目通知は、加入会話などが終わったタイミングで差し込む */
  if(pendingMilestone){pendingMilestone=false;checkMilestones();if(dlg)return;}
  /* v1.1: 再話しかけガードの減衰（時間経過か、16px以上動いたら解除） */
  if(talkGuard.id){talkGuard.t-=dt;if(talkGuard.t<=0||Math.abs(player.x-talkGuard.x)>=16||Math.abs(player.y-talkGuard.y)>=16)talkGuard.id=null;}
  if(maybeChapterEvent())return; /* フェーズ4-B: 章イベントの差し込み（物語モードのみ） */
  if(checkRouteInvite())return; /* フェーズ5-A: ルート3の招待状（クリア後、全モード共通） */
  if(hit('x','X')){profileOpen=true;return;}
  if(hit('l','L')){lib={mode:'own',sel:0,msg:'',only:false};return;}
  const v=moveVec();
  if(v.x||v.y){
    player.anim+=dt*10;
    player.dir=v.y<0?'up':v.y>0?'down':v.x<0?'left':'right';
    const sp=130*dt;
    const nx=player.x+v.x*sp, ny=player.y+v.y*sp;
    const box=(x,y)=>solid(Math.floor((x+8)/TILE),Math.floor((y+10)/TILE))||solid(Math.floor((x+24)/TILE),Math.floor((y+10)/TILE))||solid(Math.floor((x+8)/TILE),Math.floor((y+30)/TILE))||solid(Math.floor((x+24)/TILE),Math.floor((y+30)/TILE));
    /* NPCとの衝突（v1.1: 軸分離＋脱出許可）。候補位置がNPCの24px圏内へ新たに
       入る移動だけを軸ごとに止める。すでに重なっている場合は、重なりが深く
       ならない移動（脱出方向）を許可するので、ワープ到着地点などで
       「押しても1ピクセルも動かない」状態にならない */
    const npcBlock=(x,y)=>{
      for(const n of curMap().npcs){
        const inCand=Math.abs(x-n.x)<24&&Math.abs(y-n.y)<24;
        if(!inCand)continue;
        const inNow=Math.abs(player.x-n.x)<24&&Math.abs(player.y-n.y)<24;
        if(!inNow)return true;
        const dNow=Math.max(Math.abs(player.x-n.x),Math.abs(player.y-n.y));
        const dCand=Math.max(Math.abs(x-n.x),Math.abs(y-n.y));
        if(dCand<dNow)return true;
      }
      return false;
    };
    if(!box(nx,player.y)&&!npcBlock(nx,player.y))player.x=nx;
    if(!box(player.x,ny)&&!npcBlock(player.x,ny))player.y=ny;
    // マップ移動ゲート（v1.1: ゲートは3タイル幅。warps の同 to 宛が3件並ぶ）
    const ptx=Math.floor((player.x+16)/TILE),pty=Math.floor((player.y+16)/TILE);
    for(const w of curMap().warps){
      if(w.x===ptx&&w.y===pty){curMapId=w.to;player.x=w.sx*TILE;player.y=w.sy*TILE;contactArm=false;declinedMobs.clear();break;}
    }
    // モブとのシンボル接触 → ミニバトル挑発（断った相手はこのマップでは再発火しない）
    let nearMob=false;
    for(const n of curMap().npcs){
      if(!n.mob)continue;
      if(Math.hypot(player.x-n.x,player.y-n.y)<44)nearMob=true;
      if(contactArm&&!declinedMobs.has(n.mob)&&Math.abs(player.x-n.x)<26&&Math.abs(player.y-n.y)<26){mobEncounter(n.mob);break;}
    }
    if(!nearMob)contactArm=true;
    /* 特訓スポット（踏むと発火。同じマスに居続ける間は再発火しない） */
    const spot=spotAt(ptx,pty);

  }
  if(hit('z','Z','Enter',' ')){
    // 近くのNPCを探す

        /* フェーズ4-B: 加入イベント対象NPC（剛太／湊／紗良／蓮／美月）はイベント側で処理した */
      }else if(best.id==='nagi'&&G.introDone){
        if(G.story&&coreCount()<8){
          /* 物語モードの第1章: コア8人が揃うまで公式戦は始められない */
          const hint={gota:'次は剛太。中学時代からのライバル、体育館にいるよ',minato:'次は湊。公園の壁トスの壁の近くで、一人でトスを上げてる',sara:'次は紗良。体育館で声をかけてみて',ren:'次は蓮。体育館で、居残り練習に混ざってる',mizuki:'あと一人、美月。新入生のサーブ対決が評判だよ'}[joinStep()];
          startDialog([
            {name:'早瀬 凪',text:'公式戦は6人＋リベロがそろわないと出られない。まずは部員集めだね'},
            {name:'早瀬 凪',text:'今はコア'+coreCount()+'人。'+hint},
          ]);
        }else if(G.cleared){
          /* フェーズ5-A: クリア後は凪から対戦ルート（クリア後コンテンツ）へ進める */
          startDialog([{name:'早瀬 凪',text:'県優勝。……本当に、頂点まで来たね。対戦ルートの話、聞く？'}],()=>{
            dlg={lines:[],i:0,choices:true};
            openMenu(520,300,[
              {label:'対戦ルートに挑む',sub:'クリア後コンテンツ'},
              {label:'夢チームをゲスト登録する',sub:'ルート2制覇報酬',disabled:!canGuestRegister()},
              {label:'雑談する'},
            ],idx=>{
              dlg=null;
              if(idx===0)openRouteMenu();
              else if(idx===1)registerGuests();
              else startDialog([{name:'早瀬 凪',text:'あとは好きに力を使おう。特訓もスカウトも、まだ先があるよ'}]);
            });
          });
        }else if(G.stage===4&&!G.practice){
          /* 地区決勝の前に、柏葉との練習試合（イベント戦）を1回挟む */
          startDialog([
            {name:'早瀬 凪',text:'次は地区決勝、相手は柏葉。その前に、柏葉と練習試合ができるって'},
            {name:'早瀬 凪',text:'勝っても負けても本番は進む。相手のデータを取るつもりで、やってみる？'},
          ],()=>{
            dlg={lines:[],i:0,choices:true};
            openMenu(560,330,[
              {label:'練習試合を始める（vs 柏葉進学学院）'},
              {label:'まだ準備中'},
            ],idx=>{dlg=null;if(idx===0)startPractice();});
          });
        }else{
          const def=currentMatchDef();
          startDialog([{name:'早瀬 凪',text:def.flavor+'。'+def.label+'、始める？'}],()=>{
            dlg={lines:[],i:0,choices:true};
            openMenu(560,330,[
              {label:'試合を始める（'+def.label+' vs '+def.name+'）'},
              {label:'まだ準備中'},
            ],idx=>{dlg=null;if(idx===0)startMatch();});
          });
        }
      }else if(best.town){
        /* v0.12: 街NPC。会話回数を G.talkN[表示名] で数え、スカウト条件
           'npc'（応援団長バンジョー等）と接続する。初回はゆうじょうPボーナス */
        if(!G.talkN)G.talkN={};
        G.talkN[best.name]=(G.talkN[best.name]||0)+1;
        const tlines=npcLines(best.id).slice();
        if(best.yj&&!(G.flags&&G.flags['npcYj_'+best.id])){
          if(!G.flags)G.flags={};

        }
        saveGame();
        startDialog(tlines);
      }else{

  }
  mouseClick=null;
}
function drawChara(x,y,hair,uni,dir,anim,scale){
  const s=scale||1,bob=Math.sin(anim)*1.5;

  ctx.restore(); /* ここから先（HUD・各画面・会話）は画面座標 */

  ctx.fillText('ねっけつP '+G.nekketsu+'　ゆうじょうP '+G.yuujou+'　部費 '+(G.buhi||0)+'円',20,32);

  if(profileOpen)drawProfile();
  if(lib)drawLibrary();

  drawDialog();drawMenu();
}

/* ---------- 選手ライブラリ画面（Lキー：所持一覧＋プロフィール／編成／スカウト候補） ---------- */
let lib=null; // {mode:'own'|'combo'|'scout', sel, msg, only}
const LIB_ROWS=13;
function libScrollTop(n){return Math.min(Math.floor(lib.sel/LIB_ROWS)*LIB_ROWS,Math.max(0,n-LIB_ROWS));}
/* スカウト候補の表示対象（v1.0）: lib.only が ON の時は「今スカウトできる
   候補だけ」に絞り込む。選択インデックス lib.sel はこのリスト基準で扱う */
function scoutList(){
  const all=buildCandidates();
  return (lib&&lib.only)?all.filter(c=>c.canScout):all;
}
/* 候補リストへ学校・区分ごとの見出し行を挟んだ表示行を作る（v1.0）。
   戻り値: [{head:区分名} | {ci:候補リスト内のインデックス}] */
function scoutRows(list){
  const rows=[];let last=null;
  list.forEach((c,i)=>{
    if(c.from!==last){rows.push({head:c.from});last=c.from;}
    rows.push({ci:i});
  });
  return rows;
}
/* 見出し行込みの表示で、選択中の候補がページ内に収まる先頭行を返す（v1.0） */
function scoutScrollTop(list){
  const rows=scoutRows(list);
  const pos=rows.findIndex(r=>r.ci===lib.sel);
  const p=pos<0?0:pos;
  return Math.min(Math.floor(p/LIB_ROWS)*LIB_ROWS,Math.max(0,rows.length-LIB_ROWS));
}
function libUpdate(){
  const MODES=['own','combo','scout'];
  if(hit('ArrowRight','d','D')){lib.mode=MODES[(MODES.indexOf(lib.mode)+1)%3];lib.sel=0;lib.msg='';mouseClick=null;return;}
  if(hit('ArrowLeft','a','A')){lib.mode=MODES[(MODES.indexOf(lib.mode)+2)%3];lib.sel=0;lib.msg='';mouseClick=null;return;}
  if(hit('x','X','Escape')){lib=null;mouseClick=null;return;}
  const n=lib.mode==='own'?G.library.length:lib.mode==='combo'?COMBO_TECHS.length:scoutList().length;
  if(lib.sel>=n)lib.sel=Math.max(0,n-1);
  if(n){
    if(hit('ArrowUp','w','W'))lib.sel=(lib.sel+n-1)%n;
    if(hit('ArrowDown','s','S'))lib.sel=(lib.sel+1)%n;
    /* ページ送り（v1.0）: PageUp/PageDown で約1ページ分まとめて移動する */
    if(hit('PageDown'))lib.sel=Math.min(n-1,lib.sel+LIB_ROWS);
    if(hit('PageUp'))lib.sel=Math.max(0,lib.sel-LIB_ROWS);
  }
  /* スカウト候補の絞り込み切り替え（v1.0）: Fキーで「スカウト可のみ」ON/OFF */
  if(lib.mode==='scout'&&hit('f','F')){lib.only=!lib.only;lib.sel=0;lib.msg='';mouseClick=null;return;}
  const act=()=>{
    if(lib.mode==='combo'){
      const c=COMBO_TECHS[lib.sel];if(!c)return;
      const st=comboState(c);
      if(st.learned){lib.msg='すでに習得している';return;}
      if(st.canEvent){
        /* ミニイベント再生（§5.2 の前提）。視聴完了で G.comboEv に記録する */
        lib=null;mouseClick=null;
        startDialog(c.lines,()=>{if(!G.comboEv)G.comboEv={};G.comboEv[c.name]=true;saveGame();});
        return;
      }
      if(st.canLearn){lib.msg=learnCombo(c).msg;return;}
      if(!st.owned)lib.msg='条件未達：ペア全員がライブラリにいない';
      else if(!st.retsuOk)lib.msg='条件未達：ルート1全制覇で解放される（合同練習イベント）';
      else if(!st.lvOk)lib.msg='条件未達：ペア全員 Lv'+c.lv+' 以上が必要';
      else if(!st.eventSeen&&!st.eventWaived)lib.msg='条件未達：先にミニイベントを見よう';
      else lib.msg='ゆうじょうPが足りない（必要 '+st.cost+'P／所持 '+G.yuujou+'P）';
      return;
    }
    if(lib.mode==='own'){
      const name=G.library[lib.sel];if(!name)return;
      const err=cycleRole(name);
      lib.msg=err||(name+' → '+ROLE_LABEL[roleOf(name)]+' にした');
    }else{
      const cand=scoutList()[lib.sel];if(!cand)return;
      if(cand.owned){lib.msg='すでに仲間になっている';return;}
      if(cand.locked){lib.msg=cand.from+'はまだ解放されていない';return;}
      const unmet=cand.conds.filter(c=>!c.ok);
      const evt=unmet.find(c=>c.def.t==='event');
      if(unmet.length===1&&evt){
        /* 声かけイベント（v1.1: 内部向けの「仮置き」文言を廃し、イベント名を
           使ったプレイヤー向けの自然な文言・進行に差し替え） */
        if(!G.evtDone)G.evtDone={};
        G.evtDone[cand.name]=true;saveGame();
        const evTitle=((evt.def&&evt.def.label)||evt.label||'').replace(/^好感イベント/,'');

/* ============================================================
   試合パート
   対決計算の根拠（system-design.md + system-evaluation.md 修正案）:
   ・対決値 = round(能力値 × 属性倍率) + 技威力 + 状況補正 + 乱数(-5〜+5) + ラッキー
     属性倍率は能力値のみに掛ける（1.10/0.92）。ラッキーは 運×0.2% で +10。
   ・2枚ブロックは圧縮版: 主ブロッカー全額 + 副×0.4 + 連携+3 + タイミング(+8/-4)
     （旧案 副0.6/連携+6/タイミング+12 はチュートリアル戦でも主人公の看板技が
       通らなくなる構造的インフレのため、評価で却下された）
   ・ディグのスピード補正は +10 でキャップ（無キャップだとリベロが封殺級になる）
   ・FP補正: 残量 50%以上 ×1.00 / 30% ×0.95 / 15% ×0.90 / それ以下 ×0.80
   ・パスグレード: A(+8トス補正,全攻撃可) / B(0,クイック不可) / C(-10,ハイのみ,スパイク-8,2枚ブロック確定)
   ============================================================ */
function fpFactor(p){const r=p.fp/p.maxFP;return r>=0.5?1.0:r>=0.3?0.95:r>=0.15?0.90:0.80;}
function lucky(p){return Math.random()*100<p.st[7]*0.2?10:0;}
function duelVal(p,statIdx,techPow,oppElem){
  return awakeAdj(p,Math.round(p.st[statIdx]*elemMult(p.elem,oppElem)*fpFactor(p))+techPow+irnd(-5,5)+lucky(p));
}
/* サーブ技の威力は ×0.6 として扱う（§1.2、2026-11-27 Copilot評価で改定）: 弱+7／中+14／強+23／最強+33 */
function servePowOf(t){return Math.round(t.pow*0.6);}
/* 対決値の添記（v0.9）: 結果メッセージに「攻撃値 vs 守備値／差分」を1行添え、
   プレイヤーが「なぜ勝った／負けた」を追えるようにする。
   v1.0: aP（攻撃側）／dP（守備側）の選手が覚醒中で、その対決値に覚醒補正
   （+10％）が含まれている場合は「［覚醒+10％：攻／守］」の印を付け、
   値の伸びが覚醒によるものだと分かるようにする */
function duelNote(aLabel,aVal,dLabel,dVal,aP,dP){
  const d=aVal-dVal;
  let s='（'+aLabel+' '+aVal+' vs '+dLabel+' '+dVal+'／'+(d>=0?'+':'')+d+'）';
  const mk=[];
  if(aP&&isAwake(aP))mk.push('攻');
  if(dP&&isAwake(dP))mk.push('守');
  if(mk.length)s+='［覚醒+10％：'+mk.join('・')+'］';
  return s;
}
/* ---------- 覚醒（§9.4、v0.13） ----------
   発動条件: 相手に「3連続得点」されるか、相手に8点目を取られた時点。1試合1回のみ。
   効果: エース（コート内のスパイク最大）の全対決値 +10％、3ラリー持続。
   カットイン演出あり。打ち消し: タイムアウトで相手の覚醒の残りが1ラリー短縮（§2.5）。
   §9.4 は「相手エースの覚醒」だが、本実装ではプレイヤー側も同条件で発動させる。
   ルート1の強化版では相手が「エース＋もう1人」覚醒する（post-clear-routes §1.2）。
   補正は対決値の算出出口に awakeAdj として乗せ、計算式の形自体は変えていない */
function isAwake(p){
  if(!M||!M.awake||!p)return false;
  return M.awake.A.concat(M.awake.H).some(e=>e.p===p&&e.left>0);
}
/* 覚醒の残りラリー数（v1.0、見える化用）。覚醒中でなければ 0 を返す */
function awakeLeft(p){
  if(!M||!M.awake||!p)return 0;
  const e=M.awake.A.concat(M.awake.H).find(e=>e.p===p&&e.left>0);
  return e?e.left:0;
}
function awakeAdj(p,v){return isAwake(p)?Math.round(v*1.1):v;}
function tryAwaken(side){
  if(!M||M.mini||!M.awakeUsed||M.awakeUsed[side])return;
  const foeScore=side==='A'?M.scoreH:M.scoreA;
  const foeConsec=side==='A'?M.consec.H:M.consec.A;
  if(!(foeConsec>=3||foeScore>=8))return;
  M.awakeUsed[side]=true;
  const cands=teamOf(side).court.slice().sort((a,b)=>b.st[0]-a.st[0]);
  const targets=[cands[0]];
  if(side==='H'&&M.routeDef&&M.routeDef.routeId==='r1'&&cands[1])targets.push(cands[1]);
  for(const p of targets)if(p)M.awake[side].push({p,left:3,fresh:true});
  const ace=targets[0];
  if(ace){
    M.msg+=' ― '+ace.short+' が覚醒した！（全対決値+10％、3ラリー）';
    M.pendingAwakeCutins.push({p:ace});
  }
}
/* ラリー開始時の持続管理: 発動直後のラリーは減らさず、以降はラリーごとに -1 し、
   0 になったら解除する（発動ラリーを含めて3ラリー持続） */
function tickAwakening(){
  if(!M||!M.awake)return;
  for(const side of ['A','H']){
    for(const e of M.awake[side]){
      if(e.fresh)e.fresh=false;else e.left--;
    }
    M.awake[side]=M.awake[side].filter(e=>e.left>0);
  }
}
/* タイムアウトによる覚醒短縮（§2.5）: 指定チームの覚醒の残りを1ラリー減らす。
   短縮した人数を返す */
function shortenAwakening(side){
  if(!M||!M.awake)return 0;
  let n=0;
  for(const e of M.awake[side])if(e.left>0){e.left--;n++;}
  M.awake[side]=M.awake[side].filter(e=>e.left>0);
  return n;
}
/* ---------- 合体技の試合中サポート（v0.13） ----------
   使用条件（§9.3）: 全員がコート内＋全員のTPがコスト以上＋全員のFP割合30％以上 */
function comboAvail(team,owner,t){
  if(!t||!t.combo)return {ok:true,members:[owner]};
  const members=[owner];
  for(const n of t.partners){
    const p=team.court.find(q=>q.name===n);
    if(!p)return {ok:false,reason:'相方がコートにいない'};
    members.push(p);
  }
  if(members.some(p=>p.tp<t.tp))return {ok:false,reason:'TP不足（全員分）'};
  if(members.some(p=>p.fp/p.maxFP<0.3))return {ok:false,reason:'FP30％未満のメンバーがいる'};
  return {ok:true,members};
}
/* 合体技の消費: 発動者がTP全額（useTech でFP+2も通常どおり）、相方はFP2のみ。
   得点時の ゆうじょうP+2（§5.1）は point() が pendingCombo を見て付ける */
function useCombo(team,owner,t){
  const av=comboAvail(team,owner,t);
  useTech(owner,t);
  if(av.ok)for(const p of av.members)if(p!==owner)spendFP(p,2);
  if(team.isP)M.pendingCombo={side:'A'};
}
/* AIサーバーの傾向（v0.9）: 選手ごとに「強打寄り／コース寄り／五分」を持たせ、
   サーブの読み合いに偏りを作る。割り当ては名前ハッシュで決定的に決める
   （セーブや乱数に依存せず、その選手はいつも同じ傾向になる） */
function serveTendency(p){
  let h=0;const nm=p.name||'';
  for(let i=0;i<nm.length;i++)h=(h*31+nm.charCodeAt(i))>>>0;
  const r=h%10;return r<4?'power':r<7?'course':'even';
}
function aiServeStyle(p){
  const t=serveTendency(p),r=Math.random();
  if(t==='power')return r<0.7?'power':'course';
  if(t==='course')return r<0.7?'course':'power';
  return r<0.5?'power':'course';
}

   効果はコート内全員 TP+5／FP+8。タイムアウト中は消耗品も使える：
   ・スポーツドリンク（§8.3）: 部費300円でその場購入し FP+30。1人につき1本まで（試合通算）
   ・差し入れ（§5）: ゆうじょうP専用、FP+40、1試合に1個まで
     ※消費量は設計書で未確定（旧交換レート10Pが目安とだけ記載）のため仮置き20P */
const DRINK_COST=300,DRINK_FP=30,SASHIIRE_COST=20,SASHIIRE_FP=40;
function canTimeout(){return !!(M&&!M.mini&&!M.over&&M.timeouts&&M.timeouts.A>0);}
function timeoutEntry(reopen){
  if(!canTimeout())return null;
  return {label:'タイムアウトを取る',sub:'残り'+M.timeouts.A+'回／全員TP+5・FP+8',_timeout:true,_reopen:reopen};
}
function applyTimeoutFx(t){for(const p of t.court){p.tp=Math.min(p.maxTP,p.tp+5);p.fp=Math.min(p.maxFP,p.fp+8);}}
function openTimeout(reopen){
  M.timeouts.A--;
  applyTimeoutFx(M.A);
  /* 覚醒の打ち消し（§2.5）: 相手エースの覚醒の残りを1ラリー短縮する */
  const shortened=shortenAwakening('H');
  M.msg='タイムアウト！ ベンチで立て直す（コート内全員 TP+5／FP+8、残り'+M.timeouts.A+'回）'
    +(shortened?' ― 相手の覚醒が弱まった（残り-1ラリー）':'');
  openTimeoutMenu(reopen);
}
function openTimeoutMenu(reopen){
  /* v1.1: 買えない項目も選べるようにし、押した時に理由をメッセージで伝える
     （disabled のままだと「押しても無反応」で理由が分からなかった） */
  const items=[
    {label:'スポーツドリンクを使う',sub:'部費'+DRINK_COST+'円／FP+'+DRINK_FP+'／1人1本まで'},
    {label:'差し入れを使う',sub:'ゆうじょうP '+SASHIIRE_COST+'／FP+'+SASHIIRE_FP+'／1試合1個'},
    {label:'戻る（タイムアウト終了）'},
  ];
  openMenu(600,140,items,idx=>{
    if(idx===2){reopen();return;}
    if(idx===0&&(G.buhi||0)<DRINK_COST){
      M.msg='部費が足りない（必要 '+DRINK_COST+'円／所持 '+(G.buhi||0)+'円）。ドリンクは買えなかった';
      openTimeoutMenu(reopen);return;
    }
    if(idx===1&&(M.sashiireUsed||G.yuujou<SASHIIRE_COST)){
      M.msg=M.sashiireUsed?'差し入れは1試合に1個まで。もう使った':'ゆうじょうPが足りない（必要 '+SASHIIRE_COST+'P／所持 '+G.yuujou+'P）';
      openTimeoutMenu(reopen);return;
    }
    openTimeoutTarget(idx===0?'drink':'sashiire',reopen);
  });
  M.phase='timeoutMenu';
}
function openTimeoutTarget(kind,reopen){
  const items=M.A.court.map(p=>({
    label:p.short+'（FP '+Math.round(p.fp)+'/'+p.maxFP+'）',
    sub:kind==='drink'?(M.drinkUsed[p.name]?'この試合は使用済み':'FP+'+DRINK_FP):'FP+'+SASHIIRE_FP,
    disabled:kind==='drink'?(!!M.drinkUsed[p.name]||(G.buhi||0)<DRINK_COST||p.fp>=p.maxFP):p.fp>=p.maxFP,
    _p:p}));
  items.push({label:'やめる'});
  openMenu(600,140,items,idx=>{
    const it=items[idx];
    if(!it||!it._p){openTimeoutMenu(reopen);return;}
    if(kind==='drink'){
      G.buhi=(G.buhi||0)-DRINK_COST;M.drinkUsed[it._p.name]=true;
      it._p.fp=Math.min(it._p.maxFP,it._p.fp+DRINK_FP);
      M.msg=it._p.short+' がスポーツドリンクで回復（FP+'+DRINK_FP+'）';
    }else{
      G.yuujou-=SASHIIRE_COST;M.sashiireUsed=true;
      it._p.fp=Math.min(it._p.maxFP,it._p.fp+SASHIIRE_FP);
      M.msg=it._p.short+' が差し入れで回復（FP+'+SASHIIRE_FP+'）';
    }
    saveGame();
    openTimeoutMenu(reopen);
  });
  M.phase='timeoutMenu';
}
/* ---------- 選手交代（REQUIREMENTS の確定仕様「ピンチサーバー交代あり」、v1.1） ----------
   ゲーム用に簡略化したルール（報告明記分）:
   ・交代できるのは得点間だけ（自チームのサーブ／レシーブの選択メニューから）
   ・エントリー12人の中から選ぶ。下げた選手はその試合に再出場できない
   ・交代回数の上限はなし。リベロは自動交代の仕組みのまま手動交代の対象外
   ・ミニバトルでは不可。相手チームは交代しない
   サーバーその人と交代すれば、新しい選手がそのままサーブを打つ（ピンチサーバー） */
function canSub(){
  if(!M||M.mini||M.over)return false;
  const hasOut=M.A.court.some(p=>p.pos!=='L');
  const hasIn=M.A.bench.some(bp=>!M.subOut[bp.name]&&bp.name!==M.liberoName);
  return hasOut&&hasIn;
}
function subEntry(reopen){
  if(!canSub())return null;
  return {label:'選手交代',sub:'控えと交代（再出場不可）',_sub:true,_reopen:reopen};
}
function openSubMenu(reopen){
  const outItems=M.A.court.filter(p=>p.pos!=='L').map(p=>({
    label:'下げる：'+p.short+'（'+p.pos+'）',sub:'FP '+Math.round(p.fp)+'/'+p.maxFP,_p:p}));
  outItems.push({label:'やめる',_cancel:true});
  openMenu(600,140,outItems,idx=>{
    const it=outItems[idx];
    if(!it||it._cancel||!it._p){reopen();return;}
    const out=it._p;
    const inItems=M.A.bench.filter(bp=>!M.subOut[bp.name]&&bp.name!==M.liberoName).map(bp=>({
      label:'入れる：'+bp.short+'（'+bp.pos+'）',sub:'FP '+Math.round(bp.fp)+'/'+bp.maxFP,_p:bp}));
    inItems.push({label:'やめる',_cancel:true});
    openMenu(600,140,inItems,jdx=>{
      const jt=inItems[jdx];
      if(!jt||jt._cancel||!jt._p){reopen();return;}
      doSubstitute(out,jt._p,reopen);
    });
  });
}
function doSubstitute(out,inP,reopen){
  const ci=M.A.court.indexOf(out),bi=M.A.bench.indexOf(inP);
  if(ci<0||bi<0){reopen();return;}
  M.A.court[ci]=inP;M.A.bench[bi]=out;
  M.subOut[out.name]=true;
  if(M.liberoPartner&&(M.liberoPartner.name===out.name||M.liberoPartner.name===inP.name))M.liberoPartner=null;
  inP.x=out.x;inP.y=out.y;inP.tx=out.tx;inP.ty=out.ty;
  assignPositions(M.A);
  M.msg=out.short+' に代わって '+inP.short+' がコートへ！（'+out.short+' はこの試合に戻れない）';
  if(inP.name==='日向 美月')M.msg+='　美月「私のサーブで流れ変えます！」';
  reopen();
}
/* 自チームのサーブメニュー（タイムアウトから戻れるよう、startRally から分離） */
function openServeMenu(sv,server){
  M.actor=server;
  // サーブの2択（§1.8）: 強打＝サーブ値で勝負／コース狙い＝運＋精度で「反応する」相手に強い
  const items=[
    {label:'強打サーブ',sub:'サーブ勝負',_style:'power'},
    {label:'コース狙いサーブ',sub:'サーブ×0.9＋運',_style:'course'},
  ];
  // ミニバトルでは必殺サーブ禁止（1点先取で一発終了になるため）
  if(!M.mini)server.techs.filter(t=>t.cat==='serve').forEach(t=>items.push({label:'必殺技：'+t.name,sub:'TP'+t.tp,disabled:server.tp<t.tp,_tech:t}));
  const sb=subEntry(()=>openServeMenu(sv,M.A.court[0]));if(sb)items.push(sb);
  const to=timeoutEntry(()=>openServeMenu(sv,server));if(to)items.push(to);
  openMenu(600,300,items,idx=>{
    if(items[idx]._sub){openSubMenu(items[idx]._reopen);return;}
    if(items[idx]._timeout){openTimeout(items[idx]._reopen);return;}
    const it=items[idx];
    M._serveStyle=it._style||'power';
    /* 必殺サーブは AI と同様にカットインを通してから解決する（TP消費は resolveServe 側で1回だけ） */
    if(it._tech)showCutin(server,it._tech,()=>resolveServe(sv,it._tech));
    else resolveServe(sv,null);
  });
  M.phase='serveMenu';
}
function startRally(){
  if(M.over)return;
  /* 覚醒カットイン（§9.4）: 発動が保留されていたら、ラリー開始前に差し込む */
  if(M.pendingAwakeCutins&&M.pendingAwakeCutins.length){
    const pc=M.pendingAwakeCutins.shift();
    M.cutin={p:pc.p,t:{name:'覚醒',awake:true},timer:1.15};
    M.cutinCb=()=>startRally();
    M.phase='cutin';
    return;
  }
  tickAwakening(); /* 覚醒の持続管理（§9.4: 3ラリー） */
  M.rally=0;M.lastTechRank=null;
  /* EXP配分（§3.3）のための出場ラリー集計：ラリー開始時にコートにいた選手を数える近似
     （触球ベースではない）。公式戦のみ対象 */
  if(!M.mini){M.totalRallies++;for(const p of M.A.court)M.rallySeen[p.name]=(M.rallySeen[p.name]||0)+1;}
  assignPositions(M.A);assignPositions(M.H);
  const sv=teamOf(M.serve), server=sv.court[0];
  M.ball.x=server.x;M.ball.y=server.y;
  M.msg=(M.serve==='A'?M.myName:M.oppName)+'のサーブ ― '+server.short;
  /* AIサーバーの傾向はメッセージで伝える（読み合いの材料、v0.9） */
  if(!sv.isP){const td=serveTendency(server);if(td==='power')M.msg+='（強打寄り）';else if(td==='course')M.msg+='（コース狙い多め）';}
  if(sv.isP){
    openServeMenu(sv,server);
  }else{
    M.phase='aiWait';M.wait=0.9;
    M.afterWait=()=>{
      const t=server.techs.find(t=>t.cat==='serve');
      // TP消費は resolveServe 側で1回だけ行う（ここで消費すると二重消費になる）
      if(t&&server.tp>=t.tp&&Math.random()<aiTechP('serveTech')&&!M.mini){showCutin(server,t,()=>resolveServe(sv,t));}
      else resolveServe(sv,null);
    };
  }
}
/* ディグ値（§1.8、2026-11-27 改定）: 「読む」＝レシーブ中心の従来式（フェイントに強い）
   「反応する」＝スピード×0.6＋レシーブ×0.4（係数合計を「読む」と揃えた改定値）。
   強打への +6 は式ではなく明示補正として、スパイクを受ける doDig 側で加える */
function digValue(digger,att,style,techPow){
  const em=elemMult(digger.elem,att.elem), ff=fpFactor(digger);
  if(style==='react'){
    return awakeAdj(digger,Math.round(digger.st[5]*0.6*em*ff)+Math.round(digger.st[2]*0.4)+(techPow||0)+irnd(-5,5)+lucky(digger));
  }
  return awakeAdj(digger,Math.round(digger.st[2]*em*ff)+(techPow||0)+Math.min(10,Math.round(digger.st[5]*0.3))+irnd(-5,5)+lucky(digger));
}
/* ブロックを抜けたスパイクのディグ判定（共通処理）。
   need＝拾える敷居、aVal＝Aパスになる敷居（どちらも呼び出し側が実効威力から決める）
   effVal＝相手スパイクの実効威力（対決値の添記用、v0.9） */
function doDig(attTeam,att,need,aVal,digStyle,digPow,effVal,pre){
  const df=attTeam.foe;
  const digger=bestBy(df,backIdx(),2);
  flyBall(digger.x,digger.y,0.35,()=>{
    let digVal=digValue(digger,att,digStyle,digPow||0);
    /* 「反応する」は強打のスパイクに対して +6（§1.8 の明示補正。doDig はスパイク専用経路） */
    if(digStyle==='react')digVal+=6;
    spendFP(digger,2);
    const note=(effVal!==undefined&&effVal!==null)?duelNote('スパイク値',effVal,'レシーブ値',digVal,att,digger):'';
    /* v1.1: pre は呼び出し側の文脈文（ワンタッチの成否など）。結果文の前に
       連結して、「選んだ行動の結果がどうなったか」を消さないようにする */
    const preS=pre||'';
    if(digVal>=need){
      // 「反応する」は拾えても体勢が崩れやすいので Aパス の敷居を +6 高くする
      const grade=digVal>=aVal+(digStyle==='react'?6:0)?'A':'B';
      M.msg=preS+digger.short+(digStyle==='react'?' が反応して拾った！':' が拾った！')+' カウンターへ'+note;
      statAdd(df,digger,'dig');
      attackPhase(df,grade);
    }else{
      M.msg=preS+att.short+' のスパイクが決まった！'+note;
      statAdd(attTeam,att,'spike');
      point(attTeam.isP?'A':'H');
    }
  });
}

function resolveServe(sv,tech){
  const df=sv.foe, server=sv.court[0];
  const receiver=bestBy(df,backIdx(),2);
  // 相手サーブ時は自チームのレシーバーに指令を出す（セミリアルタイム指令）
  // ※メニューはタイムアウトから戻れるよう関数に切り出す
  const showRecvMenu=()=>{
    M.actor=receiver;
    // サーブレシーブの2択（§1.8）: 読む＝レシーブ勝負／反応する＝スピード勝負
    const items=[
      {label:'読んで受ける（'+receiver.short+'）',sub:'レシーブ勝負',_style:'read'},
      {label:'反応して受ける（'+receiver.short+'）',sub:'スピード勝負',_style:'react'},
    ];
    receiver.techs.filter(t=>t.cat==='receive').forEach(t=>{
      if(t.combo){
        const av=comboAvail(df,receiver,t);
        items.push({label:'合体レシーブ：'+t.name,sub:av.ok?'TP'+t.tp+'（合体技）':av.reason,disabled:!av.ok,_tech:t,_combo:true});
      }else{
        items.push({label:'必殺レシーブ：'+t.name,sub:'TP'+t.tp,disabled:receiver.tp<t.tp,_tech:t});
      }
    });
    const sb=subEntry(()=>resolveServe(sv,tech));if(sb)items.push(sb);
    const to=timeoutEntry(showRecvMenu);if(to)items.push(to);
    openMenu(600,300,items,idx=>{
      if(items[idx]._sub){openSubMenu(items[idx]._reopen);return;}
      if(items[idx]._timeout){openTimeout(showRecvMenu);return;}
      const it=items[idx];M.serveRecvChosen=true;M._recvPow=it._tech?it._tech.pow:0;M._recvStyle=it._style||'read';
      if(it._tech){if(it._combo)useCombo(df,receiver,it._tech);else useTech(receiver,it._tech);showCutin(receiver,it._tech,()=>resolveServe(sv,tech));}
      else resolveServe(sv,tech);
    });
    M.phase='receiveMenu';
  };
  if(df.isP&&!M.serveRecvChosen){showRecvMenu();return;}
  spendFP(server,2);if(tech)useTech(server,tech);
  /* AIサーバーの打ち分け（v0.9）: 選手ごとの傾向（serveTendency）で偏らせる */
  const sStyle=sv.isP?(M._serveStyle||'power'):aiServeStyle(server);
  /* AIレシーブの読み合い（v0.9）: 難易度別の確率（AI_LEVELS.react）で「反応する」を混ぜ、
     §1.8 の読み合い表（強打＼読む−4・反応+4／コース＼読む+4・反応−8）が対AIでも成立するようにする */
  const rStyle=df.isP?(M._recvStyle||'read'):(Math.random()<(M.ai?M.ai.react:0.10)?'react':'read');
  if(!df.isP)M.lastAiRecvStyle=rStyle;
  const recvPow=df.isP?(M._recvPow||0):0;
  M.serveRecvChosen=false;M._recvPow=0;M._recvStyle=null;M._serveStyle=null;
  spendFP(receiver,2);
  /* サーブミス判定（§1.2）: ミス率 ＝ 基礎ミス率 −（運−50）×0.05％。
     基礎は通常4％／弱7％／中9％／強12％／最強16％。コース狙いはライン際を狙う分 +2％（§1.8）。
     FP低下帯では §2.3 のサーブミス率加算（30％未満 +3％／15％未満 +6％）も受ける */
  const missBase=tech?{弱:7,中:9,強:12,最強:16}[tech.rank]:4;
  let missP=missBase-(server.st[7]-50)*0.05+(!tech&&sStyle==='course'?2:0);
  const sfr=server.fp/server.maxFP;
  if(sfr<0.15)missP+=6;else if(sfr<0.30)missP+=3;
  if(Math.random()*100<missP){
    flyBall(480,270,0.4,()=>{M.msg='サービスエラー！ '+server.short+' のサーブが外れた';point(df.isP?'A':'H');});
    return;
  }
  /* サーブ値（§1.8、2026-11-27 改定）: 強打＝サーブ能力そのまま／コース狙い＝能力×0.90＋運×0.1、乱数幅も小さい（精度型）。
     サーブ技の威力は servePowOf で ×0.6 にする（§1.2） */
  const sVal=tech?duelVal(server,3,servePowOf(tech),receiver.elem)
    :sStyle==='power'?duelVal(server,3,0,receiver.elem)
    :awakeAdj(server,Math.round(server.st[3]*0.90*elemMult(server.elem,receiver.elem)*fpFactor(server))+Math.round(server.st[7]*0.1)+irnd(-3,3)+lucky(server));
  /* レシーブ値（§1.8）: 読み合い補正は §1.8 の表どおり（受け手のレシーブ値への補正）
       強打サーブ ＼ 読む −4（強打が有利）／ 反応する +4（強打が不利）
       コース狙い ＼ 読む +4（コースが不利）／ 反応する −8（コースが有利）
     必殺レシーブ使用時は「読む」式で計算し、表の補正を受ける */
  let rVal;
  if(rStyle==='react'&&!recvPow){
    rVal=digValue(receiver,server,'react',0)+(sStyle==='power'?4:-8);
  }else{
    rVal=duelVal(receiver,2,recvPow,server.elem)+Math.min(10,Math.round(receiver.st[5]*0.3))+(sStyle==='power'?-4:4);
  }
  /* ミニバトルの後攻補正（§7.2、2026-11-27 改定で +8→+4）: プレイヤー側の初回レセプションのみ */
  if(M.mini&&df.isP&&!M.miniRecvDone){rVal+=4;M.miniRecvDone=true;}
  const diff=rVal-sVal;
  flyBall(receiver.x,receiver.y,0.55,()=>{
    if(diff<=-20){M.msg='サービスエース！ '+server.short+' のサーブが決まった'+duelNote('サーブ値',sVal,'レシーブ値',rVal,server,receiver);M.pointActors=[server];statAdd(sv,server,'ace');point(sv.isP?'A':'H');return;}
    M.grade=diff>=10?'A':diff>=-9?'B':'C';
    M.msg=(df.isP?M.myName:M.oppName)+'のレシーブ ― '+M.grade+'パス（'+receiver.short+'）'
      +(rStyle==='react'&&diff>=0?' 反応で拾った！':sStyle==='course'&&diff>=0&&diff<10?' コースを読み切った！':'')
      +duelNote('サーブ値',sVal,'レシーブ値',rVal,server,receiver);
    attackPhase(df,M.grade);
  });
}
function attackPhase(t,grade){
  M.grade=grade;
  const setter=setterOf(t);
  if(t.isP){
    M.tossTech=null;
    const askAttacker=()=>{
      const items=[];
      t.court.forEach((p,s)=>{
        if(p===setter||p.pos==='L')return;
        const back=isBackSlot(s);
        if(grade==='B'&&p.pos==='MB')return; // Bパスはクイック不可
        if(grade==='C'&&!M.mini&&!(s===3||s===0))return; // Cパスはレフト/ライトのハイのみ（ミニは全員可）
        items.push({label:p.short+'（'+p.pos+'）'+(back?' バックアタック':p.pos==='MB'?' クイック':''),
          sub:'スパイク'+p.st[0],_p:p,_slot:s});
      });
      if(!items.length)items.push({label:'チャンスボールで返す',_p:null});
      const toA=timeoutEntry(askAttacker);if(toA)items.push(toA);
      M.actor=setter;
      openMenu(600,180,items,idx=>{
        if(items[idx]._timeout){openTimeout(askAttacker);return;}
        const it=items[idx];
        if(!it._p){M.msg='チャンスボールを返した';attackPhase(t.foe,'A');return;}
        askSpike(it._p,it._slot);
      });
      M.phase='tossMenu';
    };
    const askSpike=(att,slot)=>{
      // 攻撃の2択（§1.8）: スパイク＝スパイク値で勝負／フェイント＝（トス＋スパイク）÷2 の技術勝負（高いブロックには止まりやすい）
      const items=[
        {label:'スパイク',sub:'スパイク'+att.st[0]+' で勝負',_style:'spike'},
        {label:'フェイント',sub:'テクニック勝負',_style:'feint'},
      ];
      if(setter.techs.some(t2=>t2.cat==='toss'&&!t2.combo&&setter.tp>=t2.tp)){
        const tt=setter.techs.find(t2=>t2.cat==='toss'&&!t2.combo&&setter.tp>=t2.tp);
        items.push({label:'必殺トス：'+tt.name,sub:'TP'+tt.tp,_toss:tt});
      }
      /* 合体トス（v0.13）: セッターの合体技は使用条件（§9.3）を満たす時だけ選べる */
      setter.techs.filter(t2=>t2.cat==='toss'&&t2.combo).forEach(t2=>{
        const av=comboAvail(t,setter,t2);
        items.push({label:'合体トス：'+t2.name,sub:av.ok?'TP'+t2.tp+'（合体技）':av.reason,disabled:!av.ok,_toss:t2,_combo:true});
      });
      att.techs.filter(t2=>t2.cat==='spike').forEach(t2=>{
        if(t2.combo){
          const av=comboAvail(t,att,t2);
          items.push({label:'合体技：'+t2.name,sub:av.ok?'TP'+t2.tp+'（合体技）':av.reason,disabled:!av.ok,_tech:t2,_combo:true});
        }else{
          items.push({label:'必殺技：'+t2.name,sub:'TP'+t2.tp,disabled:att.tp<t2.tp,_tech:t2});
        }
      });
      const toS=timeoutEntry(()=>askSpike(att,slot));if(toS)items.push(toS);
      M.actor=att;
      openMenu(600,180,items,idx=>{
        if(items[idx]._timeout){openTimeout(()=>askSpike(att,slot));return;}
        const it=items[idx];
        const go=()=>resolveSpike(t,att,slot,it._tech||null,it._toss||null,grade,it._style||'spike');
        if(it._tech){if(it._combo)useCombo(t,att,it._tech);else useTech(att,it._tech);showCutin(att,it._tech,go);}
        else if(it._toss){if(it._combo)useCombo(t,setter,it._toss);else useTech(setter,it._toss);M.tossTech=it._toss;showCutin(setter,it._toss,go);}
        else go();
      });
      M.phase='spikeMenu';
    };
    // 必殺トスは askSpike 内で選択。まず攻撃者選択へ
    askAttacker();
  }else{
    M.phase='aiWait';M.wait=0.7;
    M.afterWait=()=>{
      const setter2=setterOf(t);
      const cand=t.court.filter((p,s)=>p!==setter2&&p.pos!=='L'&&!(grade==='B'&&p.pos==='MB'));
      cand.sort((a,b)=>b.st[0]-a.st[0]);
      /* AIの配球（§9.1）: エース集中率は難易度で変わる（やさしい＝エース60％で読みやすい）。
         Aパス時は難易度に応じてクイック（MB）を混ぜる（使用率 10％／25％／45％） */
      let att=null;
      if(grade==='A'&&M.ai&&Math.random()<M.ai.quick){
        const mbs=cand.filter(p=>p.pos==='MB');
        if(mbs.length)att=mbs[0];
      }
      if(!att)att=Math.random()<(M.ai?M.ai.best:0.45)?cand[0]:choice(cand);
      const slot=t.court.indexOf(att);
      const st=att.techs.find(t2=>t2.cat==='spike');
      // AIの攻撃スタイル（§1.8）: 改定後のフェイント値の能力部分（トス×0.5＋スパイク×0.5＋運×0.2）がスパイクに近い選手は時々フェイントを混ぜる
      const feintApt=att.st[4]*0.5+att.st[0]*0.5+att.st[7]*0.2;
      const aiStyle=(!st&&feintApt>=att.st[0]-8&&Math.random()<(M.ai?M.ai.feint:0.35))?'feint':'spike';
      if(st&&att.tp>=st.tp&&Math.random()<aiTechP('spikeTech')){useTech(att,st);showCutin(att,st,()=>defendChoice(att,slot,st,'spike'));}
      else defendChoice(att,slot,null,aiStyle);
    };
  }
}
/* 相手スパイクに対する自チームの守備選択（§1.8の2択×2＋必殺技）
   ブロック系: ワンタッチ狙い（当たりやすく威力を殺す／即得点なし） or シャット狙い（即得点／外すと決められやすい）
   ディグ系:   読んで受ける（レシーブ勝負、フェイントに強い） or 反応して受ける（スピード勝負、強打に強い） */
function defendChoice(att,slot,attTech,attStyle){
  const df=M.A;
  const digger=bestBy(df,backIdx(),2);
  const blocker=bestBy(df,frontIdx(),1);
  M.actor=digger;
  // ※メニューはタイムアウトから戻れるよう関数に切り出す
  const showDefMenu=()=>{
    const items=[
      {label:'ワンタッチ狙い（'+blocker.short+'）',sub:'ブロック＋レシーブ',_kind:'touch'},
      {label:'シャット狙い（'+blocker.short+'）',sub:'ブロック勝負',_kind:'shut'},
      {label:'読んで受ける（'+digger.short+'）',sub:'レシーブ勝負',_kind:'dig',_style:'read'},
      {label:'反応して受ける（'+digger.short+'）',sub:'スピード勝負',_kind:'dig',_style:'react'},
    ];
    digger.techs.filter(t=>t.cat==='receive').forEach(t=>{
      if(t.combo){
        const av=comboAvail(df,digger,t);
        items.push({label:'合体レシーブ：'+t.name,sub:av.ok?'TP'+t.tp+'（合体技）':av.reason,disabled:!av.ok,_kind:'receive',_tech:t,_user:digger,_combo:true});
      }else{
        items.push({label:'必殺レシーブ：'+t.name,sub:'TP'+t.tp,disabled:digger.tp<t.tp,_kind:'receive',_tech:t,_user:digger});
      }
    });
    blocker.techs.filter(t=>t.cat==='block').forEach(t=>{
      if(t.combo){
        const av=comboAvail(df,blocker,t);
        items.push({label:'合体ブロック：'+t.name+'（'+blocker.short+'）',sub:av.ok?'TP'+t.tp+'（合体技）':av.reason,disabled:!av.ok,_kind:'block',_tech:t,_user:blocker,_combo:true});
      }else{
        items.push({label:'必殺ブロック：'+t.name+'（'+blocker.short+'）',sub:'TP'+t.tp,disabled:blocker.tp<t.tp,_kind:'block',_tech:t,_user:blocker});
      }
    });
    const to=timeoutEntry(showDefMenu);if(to)items.push(to);
    openMenu(600,180,items,idx=>{
      if(items[idx]._timeout){openTimeout(showDefMenu);return;}
      const it=items[idx];
      if(it._kind==='touch'||it._kind==='shut')M.defSel={kind:it._kind};
      else if(it._kind==='dig')M.defSel={kind:'dig',style:it._style};
      else M.defSel={kind:it._kind,tech:it._tech,user:it._user};
      if(it._tech){if(it._combo)useCombo(df,it._user,it._tech);else useTech(it._user,it._tech);showCutin(it._user,it._tech,()=>resolveSpike(M.H,att,slot,attTech,null,M.grade,attStyle||'spike'));}
      else resolveSpike(M.H,att,slot,attTech,null,M.grade,attStyle||'spike');
    });
    M.phase='defendMenu';
  };
  showDefMenu();
}
function resolveSpike(attTeam,att,slot,tech,tossTech,grade,style){
  style=style||'spike';
  const df=attTeam.foe, setter=setterOf(attTeam);
  M.rally++;
  /* トス判定（§1.4）: 閾値 クイック70 / バック65 / 通常60。パス補正 A+8 B0 C-10
     差分で補正を決める: +15以上＝ドンピシャ（+10＋超過分×0.3、小数切捨て、上限+14。
     2026-11-27 Copilot評価で改定）／ 0〜+14＝成功 +5 ／ −14〜−1＝乱れ −5 ／
     −15以下＝大乱れ −10 かつスパイク技は不発（威力0） */
  const kind=att.pos==='MB'?'quick':isBackSlot(slot)?'back':'normal';
  const th=kind==='quick'?70:kind==='back'?65:60;
  const passB=grade==='A'?8:grade==='C'?-10:0;
  const tossVal=setter.st[4]+(tossTech?tossTech.pow:0)+passB+irnd(-5,5);
  const tDiff=tossVal-th;
  let tossBonus=tDiff>=15?Math.min(14,10+Math.floor((tDiff-15)*0.3)):tDiff>=0?5:tDiff>=-14?-5:-10;
  let techPow=tech?tech.pow:0;
  if(tDiff<=-15)techPow=0; // 大乱れ: 技不発
  spendFP(att,2);spendFP(setter,2);
  /* 得点時のTP追加回復（§2.4）の対象として、トスとスパイクの担当を記録する。
     ブロックで得点した場合は後段の分岐でブロッカーに差し替える */
  M.pointActors=[setter,att];
  // ブロック: 主+副(×0.4)+連携3+タイミング(+8/-4)。Cパス時は2枚確定
  const fronts=frontIdx().map(s=>df.court[s]).sort((a,b)=>b.st[1]-a.st[1]);
  const main=fronts[0];let sub=null;
  /* 2枚ブロック参加率とタイミング正解率は、守備側がAIの場合は難易度で決まる（§9.1）。
     プレイヤー側守備は従来値（参加率0.6／タイミング五分）のまま */
  const subRate=df.isP?0.6:(M.ai?M.ai.sub:0.6);
  if(grade==='C'||Math.random()<subRate)sub=fronts[1];
  // 守備側（プレイヤー）の選択を取り込む: touch=ワンタッチ狙い / shut=シャット狙い / block=必殺ブロック / dig=読む・反応する / receive=必殺レシーブ
  const sel=df.isP?M.defSel:null; M.defSel=null;
  let blockTechPow=0;
  if(!df.isP){const bt=main.techs.find(t=>t.cat==='block');if(bt&&main.tp>=bt.tp&&Math.random()<(M.ai?M.ai.blockTech:0.25)){blockTechPow=bt.pow;useTech(main,bt);}}
  if(sel&&sel.kind==='block')blockTechPow=sel.tech.pow;
  /* タイミング正解率: 守備側がAIの場合は難易度値（§9.1）。補助モード中は −10％（§3.3）。
     正解（+8）の跳びは、フェイントに対する「リード」としても扱う（§1.8 の +6） */
  let timingP=(!df.isP&&M.ai)?M.ai.timing-(M.assist?0.10:0):0.5;
  /* フェーズ5-A: ルート1・柏葉「完全解析」の初回デバフ（post-clear-routes §1.3）。
     序盤3ラリーは「読まれている」ため、相手のブロックタイミング正解率が上がる */
  if(M.routeDebuff&&!df.isP&&M.totalRallies<=3)timingP+=0.15;
  const timingHit=Math.random()<timingP;
  const timing=timingHit?8:-4;
  let blockVal=awakeAdj(main,Math.round(main.st[1]*elemMult(main.elem,att.elem)*fpFactor(main))+blockTechPow+(sub?Math.round(sub.st[1]*0.4)+3:0)+timing);
  spendFP(main,2);if(sub)spendFP(sub,2);
  const digPow=(sel&&sel.kind==='receive')?sel.tech.pow:0;
  const digStyle=(sel&&sel.kind==='dig')?sel.style:'read';
  const gradeB=grade==='A'?5:grade==='C'?-8:0;
  /* ---- フェイント（§1.8、2026-11-27 Copilot評価で改定）----
     能力部分は（トス×0.5＋スパイク×0.5）、センスとして運×0.2 を加える。
     抵抗値 ＝ 45 ＋ 主ブロッカーのブロック×0.35 ＋ 副参加 +5 ＋ リード時 +6 で、
     ブロック能力が高いほど抵抗値が上がり止まりやすくなる（旧式 78 − ブロック×0.35 は
     符号が逆で、強いブロックほど一方的に通り、対戦校の強さの階段が崩れていた）。
     通ってもフェイントの攻撃値は ×0.6 としてディグ判定する（威力の低さの明記） */
  if(style==='feint'){
    const feintVal=awakeAdj(att,Math.round((att.st[4]*0.5+att.st[0]*0.5)*elemMult(att.elem,main.elem)*fpFactor(att))+Math.round(att.st[7]*0.2)
      +tossBonus+gradeB+irnd(-5,5)+lucky(att));
    const feintResist=45+Math.round(main.st[1]*0.35)+(sub?5:0)+(timingHit?6:0)+irnd(-5,5);
    const fDiff=feintVal-feintResist;
    const fNote=duelNote('フェイント値',feintVal,'抵抗値',feintResist,att,null);
    flyBall(main.x,main.y,0.3,()=>{
      /* v1.1: 「受ける」選択（読む／反応／必殺レシーブ）の時は、読み切られても
         ブロックの直接得点にはせず、受け手のディグ判定に持ち込む（A2の整合） */
      const digSel=sel&&(sel.kind==='dig'||sel.kind==='receive');
      if(fDiff<=-11&&!digSel){M.msg='フェイントを読まれた！ '+main.short+' のブロック'+fNote;M.pointActors=sub?[main,sub]:[main];statAdd(df,main,'block');point(df.isP?'A':'H');return;}
      if(fDiff<0&&!digSel){
        /* ブロックに引っかかり → カバー判定（閾値 60＋|差分|、§1.5） */
        const cover=bestBy(attTeam,backIdx(),2);
        if(cover.st[2]+irnd(-5,5)>=60+Math.abs(fDiff)){M.msg='フェイントが引っかかった…でもカバー！ ラリー継続'+fNote;flyBall(cover.x,cover.y,0.3,()=>attackPhase(attTeam,'C'));return;}
        const dg2=bestBy(df,backIdx(),2);
        M.msg=dg2.short+' がフェイントを拾った！'+fNote;M.pointActors=[dg2];statAdd(df,dg2,'dig');point(df.isP?'A':'H');return;
      }
      // ブロック無効化 → ディグ勝負。攻撃値は feintVal×0.6。反応遅れ補正: 読む -6（読みはフェイントに強い）/ 反応する -18
      const fAtk=Math.round(feintVal*0.6);
      const delay=digStyle==='react'?-18:-6;
      const digger=bestBy(df,backIdx(),2);
      /* 読み切られた状態で「受ける」を選んでいたら、受け手は体勢を整えて受けられる（+8） */
      const readBonus=(fDiff<=-11&&digSel)?8:0;
      const readPre=(fDiff<=-11&&digSel)?'フェイントを読まれた！ でも':'';
      flyBall(digger.x,digger.y,0.35,()=>{
        const digVal=digValue(digger,att,digStyle,digPow)+delay+readBonus;
        spendFP(digger,2);
        const dNote=duelNote('フェイント攻撃値',fAtk,'レシーブ値',digVal,att,digger);
        if(digVal>=fAtk-5){M.msg=readPre+'フェイントがブロックの裏を抜いた！ でも'+digger.short+' が拾った！ カウンターへ'+dNote;statAdd(df,digger,'dig');attackPhase(df,digVal-fAtk>=10?'A':'B');}
        else{M.msg=readPre+'フェイントがブロックの裏を抜いて決まった！ '+att.short+dNote;statAdd(attTeam,att,'spike');point(attTeam.isP?'A':'H');}
      });
    });
    return;
  }
  let spikeVal=awakeAdj(att,Math.round(att.st[0]*elemMult(att.elem,main.elem)*fpFactor(att))+techPow+tossBonus+gradeB+irnd(-5,5)+lucky(att)+Math.min(20,M.rally*2));
  const diff=spikeVal-blockVal;
  const netX=480, netY=att.y;
  flyBall(netX,netY,0.3,()=>{
    /* ワンタッチ狙い（§1.8、2026-11-27 改定）: ワンタッチ値 ＝ ブロック値×0.7＋主ブロッカーのレシーブ×0.3 が
       スパイク値 −10 以上で成立し、相手スパイクの実効威力を ×0.85 に落としてディグ判定へ（即得点にはならない）。
       不成立の場合はスパイク側に +5 の補正（ブロックで手が割れた扱い）を与えて通常のディグ判定に移る */
    if(sel&&sel.kind==='touch'){
      const touchVal=Math.round(blockVal*0.7)+Math.round(main.st[2]*0.3)+irnd(-5,5);
      const tNote=duelNote('ワンタッチ値',touchVal,'スパイク値',spikeVal,main,att);
      if(touchVal>=spikeVal-10){
        const eff=Math.round(spikeVal*0.85);
        /* v1.1: 成否の文脈文は doDig の pre で結果文に連結する（上書きで消さない） */
        doDig(attTeam,att,eff-5,eff+10,digStyle,digPow,eff,'ワンタッチ！ '+main.short+' が当てて威力を殺した'+tNote+' ');
      }else{
        doDig(attTeam,att,(spikeVal+5)-5,(spikeVal+5)+10,digStyle,digPow,spikeVal+5,'ワンタッチ狙い…手が割れた！'+tNote+' ');
      }
      return;
    }
    /* シャット狙い（§1.8）: ブロック値そのもので勝負。際どい帯（-4〜+4）で外すと、そのまま決められる */
    if(sel&&sel.kind==='shut'){
      const sNote=duelNote('スパイク値',spikeVal,'ブロック値',blockVal,att,main);
      if(diff<=-5){M.msg='シャットアウト！ '+main.short+' のブロック'+sNote;M.pointActors=sub?[main,sub]:[main];statAdd(df,main,'block');point(df.isP?'A':'H');return;}
      if(diff<=4){M.msg='シャットを狙ったが抜かれた！'+sNote;statAdd(attTeam,att,'spike');point(attTeam.isP?'A':'H');return;}
      doDig(attTeam,att,spikeVal-5,spikeVal+10,digStyle,digPow,spikeVal);
      return;
    }
    /* 「受ける」選択（読んで受ける／反応して受ける／必殺レシーブ）の整合（v1.1）:
       ブロック値が上回っても直接のブロック得点にはせず、ブロックが当てて
       威力を落としたボールを、選んだ受け手が受ける判定に持ち込む。
       際どい帯ではワンタッチで受け手が拾う／抜ける、のどちらかになる */
    if(sel&&(sel.kind==='dig'||sel.kind==='receive')){
      const dNote=duelNote('スパイク値',spikeVal,'ブロック値',blockVal,att,main);
      if(diff<=-5){
        const eff=Math.round(spikeVal*0.85);
        doDig(attTeam,att,eff-5,eff+10,digStyle,digPow,eff,main.short+' のブロックが当てて威力を殺した！'+dNote+' ');
        return;
      }
      if(diff<=4){
        const digger=bestBy(df,backIdx(),2);
        if(Math.random()<0.5){M.msg='ワンタッチ！ '+digger.short+' が拾った！ カウンターへ'+dNote;statAdd(df,digger,'dig');attackPhase(df,'C');return;}
        M.msg='ワンタッチ！ …決まった！'+dNote;statAdd(attTeam,att,'spike');point(attTeam.isP?'A':'H');return;
      }
      doDig(attTeam,att,diff>=15?spikeVal-15:spikeVal-5,spikeVal+10,digStyle,digPow,spikeVal);
      return;
    }
    if(diff<=-5){
      /* ブロックに捕まる → カバー判定（§1.5、2026-11-27 改定）: 閾値 ＝ 60 ＋ |差分|。
         −20以下（完璧なシャットアウト）でも同じ式で判定し、その場合の閾値は 80 以上になる */
      const bNote=duelNote('スパイク値',spikeVal,'ブロック値',blockVal,att,main);
      const cover=bestBy(attTeam,backIdx(),2);
      if(cover.st[2]+irnd(-5,5)>=60+Math.abs(diff)){M.msg='ブロックカバー！ ラリー継続'+bNote;flyBall(cover.x,cover.y,0.3,()=>attackPhase(attTeam,'C'));return;}
      M.msg=(diff<=-20?'完璧なシャットアウト！ '+main.short+' のブロック':'ブロックに捕まった！')+bNote;
      M.pointActors=sub?[main,sub]:[main];
      statAdd(df,main,'block');
      point(df.isP?'A':'H');return;
    }
    if(diff<=4){
      const wNote=duelNote('スパイク値',spikeVal,'ブロック値',blockVal,att,main);
      if(Math.random()<0.5){M.msg='ワンタッチ！ …決まった！'+wNote;statAdd(attTeam,att,'spike');point(attTeam.isP?'A':'H');return;}
      /* v1.1: 拾った選手を名指しする（誰が拾ったか分からない表示をなくす） */
      const digger=bestBy(df,backIdx(),2);
      M.msg='ワンタッチ！ '+digger.short+' が拾った！'+wNote;statAdd(df,digger,'dig');attackPhase(df,'C');return;
    }
    // ブロックを抜けた → ディグ判定
    doDig(attTeam,att,diff>=15?spikeVal-15:spikeVal-5,spikeVal+10,digStyle,digPow,spikeVal);
  });
}
function point(winner){
  if(winner==='A')M.scoreA++;else M.scoreH++;
  const actorsAtPoint=M.pointActors; /* v1.1: 決め台詞の判定用に、TP処理で消える前に保持 */
  const wt=teamOf(winner);
  /* TP回復（§2.4、2026-11-27 改定）: 得点したチームのコート内全員 +1、
     さらにその得点に関わった選手（トス／スパイク／ブロックの担当＝M.pointActors）に追加で +1。
     旧仕様の「全員 +2」から絞り、終盤が技の撃ち合いにならない予算にした */
  wt.court.forEach(p=>p.tp=Math.min(p.maxTP,p.tp+1));
  for(const p of (M.pointActors||[]))if(wt.court.includes(p))p.tp=Math.min(p.maxTP,p.tp+1);
  M.pointActors=null;
  /* 合体技の成功報酬（§5.1）: 合体技を使ったラリーで自チームが得点すると
     ゆうじょうP +2（1試合最大 +10） */
  if(M.pendingCombo){
    if(winner===M.pendingCombo.side&&(M.comboYj||0)<10){
      G.yuujou+=2;M.comboYj=(M.comboYj||0)+2;
      M.msg+='（合体技成功！ ゆうじょうP +2）';
    }
    M.pendingCombo=null;
  }
  /* 決め台詞（voice-bible.md、v1.1）: 自チームの得点で、関与者に主要キャラが
     いる時だけ、ここぞの局面（終盤／強以上の必殺技／覚醒中）に限って言う。
     1試合に1人1回まで（多用しない） */
  if(winner==='A'&&!M.mini&&actorsAtPoint&&actorsAtPoint.length){
    const clutch=M.scoreA>=8||M.scoreH>=8||M.lastTechRank==='強'||M.lastTechRank==='最強'||(M.awake&&M.awake.A&&M.awake.A.length>0);
    if(clutch){
      for(const a0 of actorsAtPoint){
        const nm=typeof a0==='string'?a0:a0.name;

      }
    }
  }

  const winScore=winner==='A'?M.scoreA:M.scoreH, loseScore=winner==='A'?M.scoreH:M.scoreA;
  const target=M.mini?1:10;
  if(winScore>=target&&(M.mini||winScore-loseScore>=2)){endMatch(winner);return;}

     「相手（自チーム）が9点到達」で自動使用する（難易度ふつう以上）。
     ミニバトルは対象外。覚醒（§9.4）は v0.13 で実装し、この下で判定する */
  if(!M.mini&&M.timeouts){
    if(winner==='A'){M.consec.A++;M.consec.H=0;}else{M.consec.H++;M.consec.A=0;}
    /* 覚醒（§9.4、v0.13）: 「3連続失点」または「8点目を取られた」側のエースが発動する。
       AIタイムアウトによる連続リセットより先に判定する */
    tryAwaken('A');tryAwaken('H');
