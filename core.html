      M.timeouts.H--;M.consec.A=0;applyTimeoutFx(M.H);
      M.msg+=' ― '+M.oppName+' がタイムアウトを取った（全員 TP+5／FP+8、残り'+M.timeouts.H+'回）';
      /* AIのタイムアウトでも覚醒短縮（§2.5）は対称に効く */
      if(shortenAwakening('A')>0)M.msg+='（自チームの覚醒が弱まった）';
    }
  }
  M.afterWait=()=>startRally();
}
function endMatch(winner){
  M.over=true;M.phase='over';
  const win=winner==='A';
  /* 報酬の決定:
     公式戦＝ MATCHES の試合別単価。敗北報酬は 2026-11-27 Copilot評価で改定（§3.3）:
     各試合の初回敗北のみ、EXP ＝ 基礎 × 40％ ×（自チーム得点 ÷ 10）、P報酬は 0。
     2回目以降の敗北は報酬なし（代わりに再挑戦時にヒント／補助モードを選べる）
     練習試合＝ PRACTICE_KASHIWA の専用単価（本戦より小さい）。勝敗どちらでも本編は進む
     ミニバトル＝ チーム別報酬。再戦は 2回目の勝利 50％／3回目以降 0、章上限あり（§7.3） */
  let rw,expBase=0,note='';
  /* ミニバトルの再戦係数は通算勝利数で決める。miniWinN の更新前に判定すること */
  const miniWinsBefore=(M.mini&&M.teamId&&G.miniWinN)?(G.miniWinN[M.teamId]||0):0;
  const miniFactor=miniWinsBefore===0?1:miniWinsBefore===1?0.5:0;
  if(M.matchDef){
    const d=M.matchDef;
    if(win){rw={nk:d.nk,yj:d.yj,buhi:d.buhi};expBase=d.exp;}
    else if(!G.lossGiven[d.no]){
      G.lossGiven[d.no]=true;
      rw={nk:0,yj:0,buhi:0};
      expBase=Math.floor(d.exp*0.4*(M.scoreA/10));
      note='初回の敗北ボーナスで経験値だけ入った。再挑戦のときは凪に相談すると、作戦ヒントか補助モードが選べる';
    }else{
      rw={nk:0,yj:0,buhi:0};expBase=0;
      note='報酬なし。再挑戦のときは凪に相談すると、作戦ヒントか補助モード（相手ブロック正解率 −10%）が選べる';
    }
  }else if(M.practice){
    const src=PRACTICE_KASHIWA[win?'win':'lose'];
    rw={nk:src.nk,yj:src.yj,buhi:src.buhi};expBase=src.exp;
  }else if(M.routeDef){
    /* フェーズ5-A: クリア後ルート戦（post-clear-routes.md §0.2）。
       進行は G.routes に保存し、本編の wins/stage には触れない。
       再戦（勝利済みの試合）は ゆうじょうP・ねっけつP 40％／部費 50％／経験値 70％ に逓減。
       敗北時は P・部費なし、経験値のみ勝利時の20％（再戦は逓減後の値から計算） */
    const rd=M.routeDef,prog=routeProg(rd.routeId);
    const clearedBefore=!!prog.win[rd.no];
    routeResultWin=win;
    if(win){
      const f=clearedBefore?{nk:0.4,yj:0.4,buhi:0.5,exp:0.7}:{nk:1,yj:1,buhi:1,exp:1};
      rw={nk:Math.floor(rd.nk*f.nk),yj:Math.floor(rd.yj*f.yj),buhi:Math.floor(rd.buhi*f.buhi)};
      expBase=Math.floor(rd.exp*f.exp);
      prog.win[rd.no]=true;
      /* scout-all.md 申し送り: 帝峰の freewin 条件はルート1第8戦／ルート3の勝利でも代替可 */
      if((rd.routeId==='r1'&&rd.no===8)||rd.routeId==='r3')G.freeWinTeiho=true;
      note=rd.name+'に勝利！（'+rd.label+'）';
      if(routeDone(rd.routeId)&&!G.flags[rd.routeId+'_done']){
        G.flags[rd.routeId+'_done']=true;
        if(rd.routeId==='r1'){G.flags.advTrain=true;note+=' ― ルート1全制覇！ 上級特訓が解放された（特訓の累計上限が +30 まで拡張）';}
        if(rd.routeId==='r2')note+=' ― ルート2全制覇！ 夢チーム6人のゲスト登録が解放された（凪のメニューから登録できる）';
        if(rd.routeId==='r3')note+=' ― ルート3全制覇！ 対戦ルートの頂点に到達した';
      }
      /* ルート1の4校撃破報酬（post-clear-routes §1.5）: 合体技の新規習得枠を解放する。
         未視聴のミニイベント要件が免除され、残りの合体技が ゆうじょうP のみで習得可能になる */
      if(rd.routeId==='r1'&&routeWinCount('r1')>=4&&!G.flags.comboFrame){
        G.flags.comboFrame=true;
        note+=' ― ルート1で4校撃破！ 合体技の新規習得枠が解放された（ミニイベントなしで残りの合体技を習得できる）';
      }
    }else{
      rw={nk:0,yj:0,buhi:0};
      expBase=Math.floor(rd.exp*(clearedBefore?0.7:1)*0.2);
      note='敗北。経験値だけ少し入った（勝利時の20％）。編成と特訓を見直して再挑戦しよう';
    }
  }else{
    rw=M.rewards?(win?M.rewards.win:M.rewards.lose):(win?{nk:60,yj:40}:{nk:20,yj:10});
    if(win&&miniFactor<1)rw={nk:Math.floor(rw.nk*miniFactor),yj:Math.floor(rw.yj*miniFactor)};
    if(M.mini){
      /* 章ごとのミニバトル獲得上限（§7.3）: ねっけつP 150／ゆうじょうP 80。
         章は公式戦の勝利数で近似し（特訓と同じ扱い）、章が変われば累計をリセットする */
      if(!G.miniChap||G.miniChap.chap!==G.wins)G.miniChap={chap:G.wins,nk:0,yj:0};
      const nkAdd=Math.min(rw.nk,Math.max(0,150-G.miniChap.nk));
      const yjAdd=Math.min(rw.yj,Math.max(0,80-G.miniChap.yj));
      G.miniChap.nk+=nkAdd;G.miniChap.yj+=yjAdd;
      rw={nk:nkAdd,yj:yjAdd};
    }
    rw.buhi=0;
  }
  G.nekketsu+=rw.nk;G.yuujou+=rw.yj;G.buhi=(G.buhi||0)+(rw.buhi||0);
  /* 本編の進行: 公式戦に勝つと次の試合が解放される。県決勝（第8試合）勝利でクリア状態になり、
     帝峰8人のスカウトが解放される（schoolUnlocked の clear 条件と接続） */
  if(M.matchDef&&win){
    G.wins++;
    G.stage=Math.min(9,Math.max(G.stage||1,M.matchDef.no+1));
    if(M.matchDef.no===8){G.cleared=true;note='県優勝！ 朝凪学園が県の頂点に立った！';}
    else{const nx=matchDef(M.matchDef.no+1);note=M.matchDef.name+'に勝利！ 次の試合：'+nx.label+' vs '+nx.name;}
  }
  if(M.practice){
    practiceResultWin=win;
    G.practice=true; /* 勝敗によらず練習試合は消化済みになり、地区決勝へ進める */
    note=win?'練習試合に勝利。だが試合後、桐原の言葉が引っかかった……':'練習試合は敗北。地区決勝で、データの外側を見せよう';
  }
  if(M.mini){miniResultWin=win;if(win&&M.teamId){G.miniWin[M.teamId]=true;
    if(!G.miniWinN)G.miniWinN={};
    G.miniWinN[M.teamId]=(G.miniWinN[M.teamId]||0)+1; /* スカウトの連勝条件用に通算勝利数を数える */}}
  /* 解放通知と資源の初回説明（v1.0.2）: 公式戦に勝って新要素が解放された時は
     結果画面の note に明記する。ねっけつP／ゆうじょうP の用途説明は、
     初めて所持した時に1回だけ note の末尾へ足す */
  if(!G.flags)G.flags={};
  if(M.matchDef&&win){
    const sc=SCOUT_SCHOOLS.find(s=>s.id===M.matchDef.id);
    if(sc&&schoolUnlocked(sc))note+=' ― '+sc.name+'の選手がスカウト候補に加わった！ ライブラリ（Lキー）の「スカウト候補」から、ゆうじょうPで勧誘できる';
    if(M.matchDef.no===8)note+=' 対戦ルート（クリア後コンテンツ）も解放された。凪に話しかけて挑戦できる';
  }
  if(!G.flags.nkIntro&&G.nekketsu>0){G.flags.nkIntro=true;if(note)note+=' ';note+='（ねっけつP：特訓に使うポイント。マップの色つきタイルのスポットで、選手の能力を上げられる）';}
  if(!G.flags.yjIntro&&G.yuujou>0){G.flags.yjIntro=true;if(note)note+=' ';note+='（ゆうじょうP：スカウトと合体技の習得に使うポイント）';}
  /* 経験値の配分（§3.3）
     公式戦・練習試合: 基礎EXP（試合別単価）×出場ラリー比率。1本でも出場すれば最低30%保証、
     エントリー控え（出場なし）は50%。非エントリーは0%
     ミニバトル: 出場した3人に同量（勝利=チーム別EXP×再戦係数／敗北=5）。
     非出場メンバーにも 30% を配分し、平均Lv −3 以下には ×1.5 の追いつきボーナス */
  let expSummary='',levelUps=[];
  if(!M.mini){
    const base=expBase;
    const tot=Math.max(1,M.totalRallies);
    /* 配分対象はエントリーした選手（M.A.all）のみ。非エントリーの所持選手は0%（§3.3） */
    for(const p of M.A.all){
      const seen=M.rallySeen[p.name]||0;
      const ratio=seen>0?Math.max(0.30,seen/tot):0.50;
      levelUps=levelUps.concat(gainExp(p.name,Math.floor(base*ratio)));
    }
    expSummary='経験値：基礎'+base+' を出場ラリー比率で配分（エントリー控えは50%）';
  }else if(M.picks){
    const teamExp=(MOB_TEAMS[M.teamId]&&MOB_TEAMS[M.teamId].exp)||20;
    const amt=win?Math.floor(teamExp*miniFactor):5;
    const lib=libPlayers();
    const avgLv=lib.length?lib.reduce((s,p)=>s+progOf(p.name).lv,0)/lib.length:1;
    const giveMini=(nm,base)=>{
      const catchUp=avgLv-progOf(nm).lv>=3?1.5:1; /* 追いつきボーナス（§3.3） */
      return gainExp(nm,Math.floor(base*catchUp));
    };
    for(const nm of (M.pickNames||[]))levelUps=levelUps.concat(giveMini(nm,amt));
    const benchAmt=Math.floor(amt*0.3); /* 非出場メンバーへの 30% 配分（§3.3） */
    if(benchAmt>0)for(const p of lib)if(!(M.pickNames||[]).includes(p.name))levelUps=levelUps.concat(giveMini(p.name,benchAmt));
    expSummary='経験値：出場3人 +'+amt+'／非出場メンバー +'+benchAmt+'（30%配分）';
  }
  /* 試合スタッツとMVP（v1.1）: 結果画面用に自チーム分を得点順に集計し、
     通算成績（G.career）へ加算する。通算はミニバトルと練習試合を除く */
  const myStats=Object.keys(M.stats||{}).filter(n=>M.stats[n].team==='A').map(n=>({name:n,pts:M.stats[n].pts,spike:M.stats[n].spike,block:M.stats[n].block,ace:M.stats[n].ace,dig:M.stats[n].dig}));
  myStats.sort((a,b)=>b.pts-a.pts||(b.spike+b.block+b.ace+b.dig)-(a.spike+a.block+a.ace+a.dig));
  const mvpS=myStats.length?myStats[0]:null;
  if(!M.mini&&!M.practice){
    if(!G.career)G.career={};
    const careerOf=n=>G.career[n]||(G.career[n]={matches:0,pts:0,spike:0,block:0,ace:0,dig:0,wins:0});
    for(const p of M.A.all){if((M.rallySeen[p.name]||0)>0){const c=careerOf(p.name);c.matches++;if(win)c.wins++;}}
    for(const s of myStats){const c=careerOf(s.name);c.pts+=s.pts;c.spike+=s.spike;c.block+=s.block;c.ace+=s.ace;c.dig+=s.dig;}
  }

  M.result={win,rk:rw.nk,yk:rw.yj,buhi:rw.buhi||0,expSummary,note,
    stats:myStats.slice(0,5),mvp:mvpS?{name:mvpS.name,short:(baseOf(mvpS.name)||{short:mvpS.name}).short,pts:mvpS.pts}:null,
    levelUps:levelUps.map(u=>{const b=baseOf(u.name);return {short:b?b.short:u.name,lv:u.lv,techs:u.techs};})};
  openMenu(330,452,[{label:'探索に戻る'}],()=>{scene='explore';const cb=M?M.onReturn:null;M=null;if(cb)cb();});
}

function matchUpdate(dt){
  for(const t of [M.A,M.H])for(const p of t.all){
    if(p.tx!==undefined){p.x+=(p.tx-p.x)*Math.min(1,dt*6);p.y+=(p.ty-p.y)*Math.min(1,dt*6);}
  }
  if(M.phase==='cutin'){
    /* 演出テンポ（v1.0）: 決定キーでカットインをスキップできる。
       高速設定時はタイマーの進みも速くする */
    if(hit('z','Z','Enter',' '))M.cutin.timer=0;
    M.cutin.timer-=dt*(fxFast()?2.5:1);
    if(M.cutin.timer<=0){const cb=M.cutinCb;M.cutin=null;M.cutinCb=null;if(cb)cb();}
    return;
  }
  if(M.ballAnim){
    const b=M.ballAnim;b.t+=dt*(fxFast()?2:1)/b.dur;
    const k=Math.min(1,b.t);
    M.ball.x=b.x0+(b.x1-b.x0)*k;
    M.ball.y=b.y0+(b.y1-b.y0)*k-Math.sin(k*Math.PI)*36;
    if(b.t>=1){M.ballAnim=null;const cb=b.onDone;if(cb)cb();}
    return;
  }
  if(M.phase==='aiWait'||M.phase==='point'){
    M.wait-=dt*(fxFast()?2:1);
    if(M.wait<=0){const cb=M.afterWait;M.afterWait=null;if(cb)cb();}
    return;
  }
  if(menu)menuUpdate();
}

    const awL=awakeLeft(p);
    ctx.fillStyle=isAwake(p)?'#ffd76a':'#cfe';ctx.fillText((awL?'★':'')+p.short,10,y);
    ctx.fillStyle='#28406b';ctx.fillRect(44,y-7,58,5);ctx.fillRect(108,y-7,40,5);
    ctx.fillStyle='#57d95e';ctx.fillRect(44,y-7,58*p.fp/p.maxFP,5);
    ctx.fillStyle='#ffd76a';ctx.fillRect(108,y-7,40*p.tp/p.maxTP,5);
    if(awL){ctx.fillStyle='#ffd76a';ctx.font='9px sans-serif';ctx.fillText('残'+awL,152,y);ctx.font='10px sans-serif';}
  });
  ctx.fillStyle='#9ab';ctx.fillText('緑:FP 黄:TP'+(M.mini?'':'　タイムアウト残り'+(M.timeouts?M.timeouts.A:0)),10,540-4);
}
function drawActorPanel(p){
  ctx.fillStyle='rgba(8,12,28,.94)';ctx.strokeStyle=ELEM[p.elem].c;ctx.lineWidth=2;
  ctx.fillRect(6,120,240,170);ctx.strokeRect(6,120,240,170);
  ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.fillText(p.name,16,146);
  ctx.font='12px sans-serif';ctx.fillStyle='#9ab';
  ctx.fillText(p.pos+' / '+p.elem+'属性',16,164);
  ctx.fillText('FP '+Math.round(p.fp)+'/'+p.maxFP+'　TP '+Math.round(p.tp)+'/'+p.maxTP,16,182);
  const lb=['スパイク','ブロック','レシーブ','サーブ','トス','スピード'];
  lb.forEach((s,i)=>{ctx.fillStyle='#cfe';ctx.fillText(s+' '+p.st[i],16+(i%2)*110,204+Math.floor(i/2)*18);});
  ctx.fillStyle='#eef';ctx.font='11px sans-serif';
  wrapText(p.intro,16,262,224,15);
}
function drawCutin(){
  const c=M.cutin,col=ELEM[c.p.elem].c;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=col;ctx.fillRect(0,210,W,120);
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(0,222,W,10);ctx.fillRect(0,308,W,10);
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.fillText(c.p.name+'（'+c.p.elem+'）',40,248);
  ctx.font='bold 38px sans-serif';ctx.fillText(c.t.name+'！',40,300);
  ctx.font='14px sans-serif';
  if(c.t.awake)ctx.fillText('全対決値 +10％（3ラリー）',700,248);
  else ctx.fillText('威力 '+c.t.rank+' ／ TP '+c.t.tp+' 消費',700,248);
}
function drawResult(){
  const r=M.result;
  ctx.fillStyle='rgba(4,8,20,.88)';ctx.fillRect(230,96,500,344);
  ctx.strokeStyle='#ffd76a';ctx.lineWidth=2;ctx.strokeRect(230,96,500,344);
  ctx.fillStyle='#fff';ctx.font='bold 34px sans-serif';ctx.textAlign='center';
  ctx.fillText(r.win?'勝 利！':'敗 北…',480,158);
  ctx.font='20px sans-serif';
  ctx.fillText(M.myName+' '+M.scoreA+' ― '+M.scoreH+' '+M.oppName,480,201);
  ctx.fillStyle='#ffd76a';ctx.font='17px sans-serif';
  ctx.fillText(r.rk||r.yk||r.buhi?('ねっけつP +'+r.rk+'　ゆうじょうP +'+r.yk+(r.buhi?'　部費 +'+r.buhi+'円':'')):'報酬なし（また挑戦しよう）',480,240);
  ctx.fillStyle='#cfe';ctx.font='14px sans-serif';
  if(r.expSummary)ctx.fillText(r.expSummary,480,264);
  /* v1.1: MVP と試合スタッツ上位 */
  if(r.mvp){ctx.fillStyle='#ffd76a';ctx.font='bold 15px sans-serif';ctx.fillText('MVP：'+r.mvp.short+'（得点'+r.mvp.pts+'）',480,288);}
  ctx.fillStyle='#cfe';ctx.font='12px sans-serif';
  (r.stats||[]).slice(0,3).forEach((s,i)=>{
    const b=baseOf(s.name);
    ctx.fillText((b?b.short:s.name)+'　得点'+s.pts+'（スパイク'+s.spike+'・ブロック'+s.block+'・エース'+s.ace+'）ディグ'+s.dig,480,308+i*18);
  });
  ctx.fillStyle='#ffd76a';ctx.font='15px sans-serif';
  (r.levelUps||[]).slice(0,3).forEach((u,i)=>{
    ctx.fillText('Lvアップ！ '+u.short+' → Lv'+u.lv+(u.techs.length?'　新技「'+u.techs.join('」「')+'」習得':''),480,368+i*19);
  });
  ctx.fillStyle='#9ab';ctx.font='13px sans-serif';
  ctx.fillText(r.note?r.note:(M.mini?(r.win?'ミニバトル勝利！':'負けてもゲームオーバーにはならない。再戦可能')
    :(r.win?M.oppName+'に勝利！ 次の相手へ向けて特訓しよう':'再挑戦は凪から。作戦ヒントか補助モードが選べる')),480,424);
  ctx.textAlign='left';
}

/* ---------- タイトル ---------- */
function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16264d');g.addColorStop(1,'#0a0f22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd76a';ctx.font='bold 64px sans-serif';ctx.textAlign='center';
  ctx.fillText('ファイアーシックス',480,180);
  ctx.fillStyle='#fff';ctx.font='15px sans-serif';
  ctx.fillText('廃部寸前の男女混合バレー部。再建の物語が始まる。',480,262);
  /* v1.1: 名鑑コレクションの達成率と現在の称号 */
  const dbTotal=Object.keys(PLAYER_DB).length, libN=(G.library||[]).length;
  ctx.fillStyle='#9ab';ctx.font='12px sans-serif';
  ctx.fillText('選手名鑑：'+libN+'/'+dbTotal+'人（'+(dbTotal?Math.floor(libN/dbTotal*100):0)+'%）'+((G.titles&&G.titles.length)?'　称号：'+G.titles[G.titles.length-1]:''),480,286);
  const items=['はじめから',validSave()?'つづきから':'つづきから（セーブなし）',
    '演出速度：'+(fxFast()?'高速':'通常')];
  items.forEach((s,i)=>{
    const y=330+i*50;
    if(i===titleSel){ctx.fillStyle='#33507e';ctx.fillRect(330,y-30,300,42);}
    ctx.fillStyle=(i===1&&!validSave())?'#667':'#fff';ctx.font='22px sans-serif';
    ctx.fillText((i===titleSel?'▶ ':'')+s,480,y);
  });
  ctx.fillStyle='#9ab';ctx.font='12px sans-serif';
  ctx.fillText('演出速度は Z キーで「通常／高速」を切り替え（カットインやボールの速さが変わります）',480,462);
  if(titleWarn){
    ctx.fillStyle='#ff9a9a';ctx.font='15px sans-serif';
    ctx.fillText('セーブデータがあります。もう一度「はじめから」を選ぶと上書きして開始します',480,486);
  }
  ctx.fillStyle='#9ab';ctx.font='12px sans-serif';
  ctx.fillText('v1.1 ― 本編8試合＋加入・章イベント＋全校・モブ・無所属・全国編スカウト＋装備ショップ＋クリア後ルート3本＋合体技＋覚醒＋選手交代＋スタッツ',480,516);
  ctx.textAlign='left';
}
function titleUpdate(){
  if(hit('ArrowUp','w','W')){titleSel=(titleSel+2)%3;titleWarn=false;}
  if(hit('ArrowDown','s','S')){titleSel=(titleSel+1)%3;titleWarn=false;}
  let confirm=false;
  if(mouseClick){
    // 項目の矩形内のクリックでのみ選択＋確定する（項目外クリックでは何も起きない）
    for(let i=0;i<3;i++){const y=330+i*50;if(mouseClick.y>y-32&&mouseClick.y<y+14&&mouseClick.x>330&&mouseClick.x<630){if(titleSel!==i)titleWarn=false;titleSel=i;confirm=true;}}
    mouseClick=null;
  }
  if(hit('z','Z','Enter',' ')||confirm){
    if(titleSel===2){
      // 演出速度の切り替え（v1.0）: その場で通常／高速を入れ替えて保存する
      setFx(fxFast()?'normal':'fast');
      return;
    }
    if(titleSel===0){
      // 既存セーブがある場合は一度警告を出し、もう一度選んだら上書き開始
      if(hasSave()&&!titleWarn){titleWarn=true;return;}
      titleWarn=false;G={nekketsu:0,yuujou:0,introDone:false,wins:0,miniWin:{},prog:{},tutDone:false,trainTeam:{chap:0,n:0},story:true};ensureSave();saveGame();scene='explore';
      /* v1.0.1: 新規開始直後、探索を操作できるようになる前に序章を自動再生する
         （会話中は exploreUpdate が会話を優先し、移動できない） */
      startIntro();
    }
    else if(validSave()){
      titleWarn=false;loadGame();scene='explore';
      /* v1.0.1: 物語モードで序章が未読のままのセーブ（序章の途中で終了した
         場合など）も、読み込み直後に序章を自動再生する。物語モードでない
         旧セーブや、既読のセーブには影響しない */
      if(G.story&&!G.introDone)startIntro();
    }
  }
}

/* ---------- メインループ ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  ctx.clearRect(0,0,W,H);
  if(scene==='title'){titleUpdate();drawTitle();}
  else if(scene==='explore'){exploreUpdate(dt);drawExplore();}
  else if(scene==='match'&&M){matchUpdate(dt);if(scene==='match'&&M)drawMatch();}
  pressed={};mouseClick=null;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
